<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluaciones EF y Salud</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Evaluaciones EF">
<meta name="theme-color" content="#2b8fc7">
<style>
:root{
  /* Azul y dorado: la identidad. Verde y rojo: solo el estado de una marca. */
  --bg:#f4f8fa; --surface:#fff; --surface-2:#edf4f8;
  --ink:#102b38; --soft:#5b7383; --line:#d5e2ea;
  --verde:#1f7fb0; --verde-oscuro:#175f85; --verde-claro:#e4f0f8;
  --oro:#e0980f;
  --logro:#1e8a5f; --falta:#b8392e;
  --n1:#b8392e; --n2:#d99a10; --n3:#6f9e46; --n4:#1e8a5f;
  --alerta:#b8392e;
  --r:12px; --r-s:8px;
  --curva:cubic-bezier(.22,.61,.36,1);
  /* Avenir Next viene en iOS y Segoe UI Semibold en Windows: carácter sin descargar nada,
     que es lo que importa en una app que debe abrir sin conexión. */
  --display:"Avenir Next","Segoe UI Semibold","Seravek",system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
/* Tres niveles de título: cada uno con su tamaño, peso y espaciado.
   Los titulares se aprietan; los rótulos pequeños se abren. */
h1,h2,h3{font-family:var(--display); margin:0; color:var(--ink)}
h1{font-size:21px; font-weight:800; letter-spacing:-.028em; line-height:1.18}
h2{font-size:16px; font-weight:700; letter-spacing:-.018em; line-height:1.3}
h3{font-size:17px; font-weight:800; letter-spacing:-.024em; line-height:1.22}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
table,.nota,.pastilla,input[type=number]{font-variant-numeric:tabular-nums}
button,select,a{-webkit-tap-highlight-color:transparent}

/* ---------- Estructura ---------- */
.envoltura{max-width:900px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.barra-sup{
  position:sticky; top:0; z-index:30; color:#fff;
  background:var(--verde-oscuro);
  border-bottom:3px solid var(--oro);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  transition:padding .22s var(--curva);
}
.barra-sup.compacta{padding:calc(env(safe-area-inset-top) + 5px) 14px 5px}

.barra-sup .interior{max-width:900px; margin:0 auto; display:flex; align-items:center; gap:10px}
.marca{font-family:var(--display); font-size:15px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.marca small{display:block; font-family:var(--body); font-weight:400; font-size:11px; opacity:.75; letter-spacing:.04em; text-transform:uppercase}
.estado{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:11.5px; opacity:.9}
.punto{width:8px; height:8px; border-radius:50%; background:#9FD8BE}
.punto.trabajando{background:#F3D26A; animation:latido 1s infinite}
.punto.error{background:#F2A099}
@keyframes latido{50%{opacity:.35}}
.btn-salir{background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:8px; padding:5px 9px; font-size:12px}

/* Oscuro: para la sala con poca luz. Los estados conservan su significado. */
:root[data-tema="oscuro"]{
  --bg:#0e1a21; --surface:#16262f; --surface-2:#1d3038;
  --ink:#e6eff3; --soft:#9fb3bd; --line:#2b414c;
  --verde:#4aa8d8; --verde-oscuro:#123344; --verde-claro:#1b3a4a;
  --logro:#2fa878; --falta:#e0685c; --oro:#eab53d;
  --n1:#e0685c; --n2:#eab53d; --n3:#8fbf5f; --n4:#2fa878;
}
:root[data-tema="oscuro"] .planilla thead th{background:#123344; color:#e6eff3}
:root[data-tema="oscuro"] .cas{border-color:#3d5a68}
/* En oscuro, las sombras no se ven: la jerarquía la dan los bordes. */
:root[data-tema="oscuro"] .tarjeta.principal{border-color:#2f5f7a; box-shadow:none}
:root[data-tema="oscuro"] .tarjeta.apoyo{background:#12212a; border-color:#243842}
:root[data-tema="oscuro"] .modal,
:root[data-tema="oscuro"] .menu-curso{box-shadow:0 14px 34px rgba(0,0,0,.5)}
:root[data-tema="oscuro"] .barra-deshacer{background:#25404e; box-shadow:0 8px 24px rgba(0,0,0,.45)}
:root[data-tema="oscuro"] .cifra.c-prom,:root[data-tema="oscuro"] .cifra.c-logro,
:root[data-tema="oscuro"] .cifra.c-pend,:root[data-tema="oscuro"] .cifra.c-aus{
  background:#17313f; border-color:#2b4b5c}
:root[data-tema="oscuro"] .cifra b{color:#8fd0f0}
:root[data-tema="oscuro"] .oa-chip,:root[data-tema="oscuro"] .btn-sugerencia,
:root[data-tema="oscuro"] .rem-item.puesta,:root[data-tema="oscuro"] .quitar-ade{
  background:#17313f; border-color:#2b4b5c; color:#8fd0f0}
:root[data-tema="oscuro"] .hueso{
  background:linear-gradient(90deg,#1d3038,#2b414c,#1d3038); background-size:200% 100%}
:root[data-tema="oscuro"] .aviso-pend{background:#33201e; border-color:#5c332f}
:root[data-tema="oscuro"] .aviso-dua{background:#1d3038}

/* Sol: para la cancha al mediodía. Más contraste y bordes más gruesos. */
:root[data-tema="sol"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#eef3f6;
  --ink:#000000; --soft:#3a4a54; --line:#7f96a3;
  --verde:#0f5f8a; --verde-oscuro:#0b445f; --verde-claro:#dceaf3;
  --logro:#126b45; --falta:#8e2118; --oro:#a86c00;
}
:root[data-tema="sol"] .cas{border-width:2.5px}
:root[data-tema="sol"] .tarjeta,:root[data-tema="sol"] .envoltura-tabla{border-width:1.5px}
:root[data-tema="sol"] .sub,:root[data-tema="sol"] .cifra span{color:var(--soft)}

/* Navegación inferior: al alcance del pulgar. */
/* Barra de deshacer: flota sobre la navegación durante 30 segundos. */
.barra-deshacer{
  position:fixed; left:12px; right:12px; z-index:45;
  bottom:calc(70px + env(safe-area-inset-bottom));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--ink); color:#fff; border-radius:12px; padding:10px 12px;
  box-shadow:0 8px 24px rgba(16,43,56,.3); font-size:13px;
  animation:subir .22s var(--curva);
}
.barra-deshacer .btn{background:transparent; border-color:rgba(255,255,255,.4); color:#fff;
  padding:6px 12px; font-weight:700}
.barra-deshacer .btn:active{background:rgba(255,255,255,.15)}

.barra-inf{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.barra-inf .ir{
  border:0; background:transparent; color:var(--soft);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:5px 2px; font-size:10.5px; font-weight:600; min-height:52px;
  transition:color .18s var(--curva);
}
.barra-inf .ir svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; transition:transform .2s var(--curva)}
.barra-inf .ir[aria-pressed="true"]{color:var(--verde)}
.barra-inf .ir[aria-pressed="true"] svg{transform:translateY(-1px) scale(1.08)}
.barra-inf .ir:active svg{transform:scale(.92)}

/* El curso: una píldora en la cabecera que despliega su menú justo debajo. */
/* Escudo del colegio en la barra: se achica cuando la cabecera se compacta. */
.escudo-barra{height:36px; width:36px; object-fit:contain; flex:0 0 auto;
  transition:height .22s var(--curva), width .22s var(--curva)}
.barra-sup.compacta .escudo-barra{height:27px; width:27px}

.zona-curso{position:relative}
.pildora-curso{
  display:inline-flex; align-items:baseline; gap:5px;
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.26); color:#fff;
  border-radius:999px; padding:6px 12px 6px 14px; min-height:38px;
  transition:background .18s var(--curva), transform .12s var(--curva), padding .22s var(--curva);
}
.pildora-curso:active{transform:scale(.96); background:rgba(255,255,255,.24)}
.pildora-curso b{font-family:var(--display); font-size:19px; font-weight:700; letter-spacing:-.02em}
.pildora-curso span{font-size:11px; opacity:.8; letter-spacing:.06em; text-transform:uppercase}
.pildora-curso svg{width:15px; height:15px; align-self:center; fill:none; stroke:currentColor;
  stroke-width:2.5; stroke-linecap:round; opacity:.85; transition:transform .2s var(--curva)}
.pildora-curso[aria-expanded="true"] svg{transform:rotate(180deg)}
.barra-sup.compacta .pildora-curso{padding:3px 10px 3px 12px; min-height:32px}
.barra-sup.compacta .pildora-curso b{font-size:16px}

.tapa-menu{position:fixed; inset:0; z-index:65}
.menu-curso{
  position:absolute; top:calc(100% + 9px); left:0; z-index:70; min-width:206px;
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:7px; box-shadow:0 16px 38px rgba(16,43,56,.24);
  animation:caer .2s var(--curva);
}
@keyframes caer{from{opacity:0; transform:translateY(-8px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)}}
.menu-curso::before{
  content:""; position:absolute; top:-6px; left:22px; width:11px; height:11px;
  background:var(--surface); border-left:1px solid var(--line); border-top:1px solid var(--line);
  transform:rotate(45deg); border-radius:2px 0 0 0;
}
.opcion-curso{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  border:0; background:transparent; color:var(--ink); text-align:left;
  padding:10px 11px; border-radius:9px; font-size:14.5px; min-height:44px;
  transition:background .14s var(--curva);
}
.opcion-curso:active{background:var(--surface-2)}
.opcion-curso[aria-pressed="true"]{background:var(--verde-claro); color:var(--verde-oscuro); font-weight:700;
  box-shadow:inset 3px 0 0 var(--oro)}
.opcion-curso svg{width:17px; height:17px; flex:0 0 17px; fill:none; stroke:currentColor;
  stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}

/* ---------- Cursos ---------- */
.cursos{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:12px 0 4px}
.curso{
  padding:8px 4px; border-radius:var(--r-s); border:1px solid var(--line);
  background:var(--surface); color:var(--verde); text-align:center; line-height:1.1;
  transition:background .2s var(--curva), color .2s var(--curva), border-color .2s var(--curva);
}
.curso b{display:block; font-size:17px; font-weight:700}
.curso small{display:block; font-size:8.5px; letter-spacing:.09em; color:var(--soft); margin-top:2px}
.curso[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff; box-shadow:inset 0 -3px 0 #f0a500}
.curso[aria-pressed="true"] small{color:rgba(255,255,255,.82)}
/* fila de criterios en la vista por criterio */
.chip-crit{flex:0 0 auto; min-width:44px; padding:8px 10px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface); color:var(--soft); font-weight:600}
.chip-crit[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff}

/* ---------- Pestañas ---------- */
.pestanas{display:flex; gap:2px; background:var(--surface-2); border:0; border-radius:10px; padding:3px; margin:10px 0 14px}
.pestana{flex:1; border:0; background:transparent; border-radius:8px; padding:9px 4px; font-size:13.5px; font-weight:500; color:var(--soft);
  transition:background .2s var(--curva), color .2s var(--curva)}
.pestana[aria-pressed="true"]{background:var(--verde-claro); color:var(--verde-oscuro); font-weight:600}

/* ---------- Tarjetas ---------- */
/* Tres pesos de tarjeta: la principal manda, la de apoyo acompaña,
   la de trabajo aloja la tabla y va al ras. */
.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:14px}
.tarjeta.principal{border-color:#bcdcef; box-shadow:0 2px 10px rgba(16,43,56,.06)}
.tarjeta.apoyo{background:var(--surface-2); border-color:transparent; padding:14px}
.tarjeta.trabajo{padding:12px 12px 4px}
.tarjeta > h2{font-size:16px; margin-bottom:2px}
.sub{color:var(--soft); font-size:12.5px; line-height:1.45}
.fila{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.fila-sep{justify-content:space-between}
.pasos{margin:0; padding-left:20px}
.pasos li{margin-bottom:9px; line-height:1.45; font-size:14px}
.pasos li:last-child{margin-bottom:0}
.caja-oa-lista{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  padding:9px 10px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface)}
/* Rótulo de sección: marca el comienzo de un bloque, con el filo dorado
   que en el resto de la app significa "aquí estás". */
.rotulo-seccion{display:flex; align-items:center; gap:10px;
  font-family:var(--display); font-size:12px; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--verde-oscuro);
  margin:22px 0 10px; padding-left:10px; border-left:3px solid var(--oro)}
.rotulo-seccion::after{content:""; flex:1; height:2px; border-radius:2px;
  background:linear-gradient(90deg, var(--line), transparent)}
.bloque-seccion{border-top:1px solid var(--line); margin-top:14px; padding-top:2px}
.fila-peligro{border-top:1px solid var(--line); margin-top:14px; padding-top:11px}
.campo{display:block; margin-bottom:10px}
/* Etiqueta del campo: pequeña y sobria, para que el dato mande. */
.campo > span{display:block; font-family:var(--display); font-size:11px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase; color:var(--soft); margin-bottom:5px}
/* La explicación bajo el campo, en cursiva y más chica que el dato. */
.campo .sub,.campo > span.sub{font-family:var(--body); font-size:12px; font-weight:400;
  letter-spacing:0; text-transform:none; font-style:italic; color:var(--soft);
  margin:5px 0 0; line-height:1.4}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s);
  padding:10px 11px; font-size:15px; font-weight:500; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--verde); box-shadow:0 0 0 3px var(--verde-claro)}
textarea{resize:vertical; min-height:76px}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r-s);
  padding:9px 13px; font-size:14px; font-weight:500;
  transition:background .16s var(--curva), border-color .16s var(--curva), transform .1s var(--curva);
}
.btn:active{transform:scale(.97)}
.btn:active{transform:translateY(1px)}
.btn-lleno{background:var(--verde); border-color:var(--verde); color:#fff; font-weight:600}
.btn-peligro{color:var(--alerta); border-color:#E7C4C0}
.btn-mini{padding:6px 9px; font-size:12.5px; border-radius:7px}
.btn-ancho{width:100%; justify-content:center}

/* ---------- Medidor de niveles (elemento distintivo) ---------- */
.medidor{display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.nivel{
  position:relative; border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:5px; min-height:54px;
  transition:background .12s, border-color .12s; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.nivel:active{transform:scale(.97)}
.nivel .barra{transition:background .2s var(--curva), height .2s var(--curva)}
.nivel .barra{width:14px; border-radius:2px 2px 0 0; background:var(--line)}
.nivel .num{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--soft); line-height:1}
.nivel[aria-pressed="true"]{background:var(--c,var(--verde)); border-color:transparent}
.nivel[aria-pressed="true"] .num{color:#fff}
.nivel[aria-pressed="true"] .barra{background:rgba(255,255,255,.92)}
.medidor .nivel:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- Filas de estudiantes ---------- */
.alumno{border-top:1px solid var(--line); padding:11px 0}
.alumno:first-of-type{border-top:0}
.alumno-cab{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.n-orden{font-family:var(--mono); font-size:11px; color:var(--soft); min-width:20px}
.nombre{font-weight:500; font-size:14.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nota{font-family:var(--mono); font-weight:600; font-size:14px; padding:2px 7px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line)}
.nota.roja{color:var(--n1); border-color:#EBC9C5; background:#FCF2F1}
.nota.azul{color:var(--verde); border-color:#BEDFCE; background:var(--verde-claro)}
.ausente-aviso{font-size:12px; color:var(--soft); font-style:italic; padding:4px 0}
.criterio-linea{margin:9px 0 0}
.criterio-linea .rotulo{font-size:12.5px; color:var(--soft); margin-bottom:5px; display:flex; gap:6px}
.criterio-linea .rotulo b{font-family:var(--mono); font-weight:600; color:var(--ink); font-size:11.5px}
.obs-boton{background:none; border:0; padding:4px 0; font-size:12.5px; color:var(--verde); text-decoration:underline; text-underline-offset:2px}

/* ---------- Tabla ---------- */
.envoltura-tabla{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center; white-space:nowrap}
th{background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--soft); text-transform:uppercase; letter-spacing:.03em}
td.izq,th.izq{text-align:left}
.col-fija{position:sticky; left:0; background:var(--surface); z-index:2; box-shadow:1px 0 0 var(--line)}
th.col-fija{background:var(--surface-2); z-index:3}

/* ---------- Resumen ---------- */
.metricas{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.metrica{background:var(--surface-2); border-radius:var(--r-s); padding:10px; text-align:center}
.metrica b{display:block; font-family:var(--mono); font-size:20px; font-weight:600}
.metrica span{font-size:11px; color:var(--soft); letter-spacing:.02em}
.logro{margin-top:12px}
.logro-item{margin-bottom:11px}
.detalle-logro{margin:3px 0 0; font-size:11.5px; color:var(--soft); line-height:1.4}

/* Detalle por indicador de cada estudiante. */
/* Apoyo sugerido para quienes están bajo 4,0. */
.det-apoyo{border:1px solid var(--line); border-left:3px solid var(--oro);
  border-radius:var(--r-s); padding:10px 12px; margin-bottom:8px; background:var(--surface)}
.det-apoyo summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between;
  gap:10px; align-items:baseline; min-height:32px; font-size:14px}
.det-apoyo summary::-webkit-details-marker{display:none}
.det-apoyo summary em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--falta);
  white-space:nowrap}
.det-apoyo summary em::after{content:" ▸"; opacity:.6}
.det-apoyo[open] summary em::after{content:" ▾"}
.caja-medidas{display:flex; flex-direction:column; gap:5px}
.rem-item{display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s);
  padding:9px 11px; font-size:13px; line-height:1.4; color:var(--ink); min-height:44px;
  transition:background .14s var(--curva), border-color .14s var(--curva)}
.rem-item i{flex:0 0 18px; font-style:normal; font-weight:700; color:var(--soft); text-align:center}
.rem-item.puesta{background:var(--verde-claro); border-color:#bcd9ec; color:var(--verde-oscuro)}
.rem-item.puesta i{color:var(--logro)}
.rem-item:active{background:var(--surface-2)}

.lista-rem{margin:0; padding-left:18px; font-size:13px; line-height:1.45}
.lista-rem li{margin-bottom:5px}

.det-alumno summary{list-style:none; cursor:pointer; padding:2px 0}
.det-alumno summary::-webkit-details-marker{display:none}
.det-alumno summary .rotulo em::after{content:" ▸"; font-size:10px; opacity:.6}
.det-alumno[open] summary .rotulo em::after{content:" ▾"}
.por-indicador{margin:8px 0 4px; padding:9px 11px; background:var(--surface-2);
  border-radius:var(--r-s); border:1px solid var(--line)}
.sub-criterio{display:flex; justify-content:space-between; gap:10px; margin:9px 0 5px;
  font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--soft)}
.sub-criterio:first-child{margin-top:0}
.sub-criterio em{font-style:normal; font-family:var(--mono); color:var(--verde-oscuro)}
.fila-ind{display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:start;
  padding:5px 0 5px 7px; font-size:12.5px; line-height:1.35; border-left:3px solid var(--line)}
.fila-ind b{font-family:var(--mono); font-size:10.5px; color:var(--soft); padding-top:1px}
.fila-ind i{font-style:normal; font-size:11px; white-space:nowrap; color:var(--soft); padding-top:1px}
.fila-ind.ok{border-left-color:var(--logro)} .fila-ind.ok i{color:var(--logro); font-weight:600}
.fila-ind.medio{border-left-color:var(--n2)} .fila-ind.medio i{color:#8a6300; font-weight:600}
.fila-ind.bajo{border-left-color:var(--falta)} .fila-ind.bajo i{color:var(--falta); font-weight:600}
.logro-item .rotulo{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:4px}
.logro-item .rotulo em{font-family:var(--mono); font-style:normal; font-weight:600}
.pista{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.pista i{display:block; height:100%; border-radius:4px; background:var(--verde)}
.pista i.baja{background:var(--n2)} .pista i.critica{background:var(--n1)}

/* ---------- Criterios (editor) ---------- */
/* Un indicador por tarjeta: texto arriba, sus controles abajo. */
/* El texto oficial del OA queda plegado: se consulta, no estorba. */
/* Campos que crecen con su contenido, sin barra de desplazamiento interna. */
.auto-alto{resize:none; overflow:hidden; min-height:0; line-height:1.4}

/* Botón de sugerencias: vive dentro del campo, discreto pero claro. */
.campo-objeval{position:relative}
/* Objetivo sugerido: el texto y, al costado, el OA al que corresponde. */
.obj-item{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line);
  padding:11px 12px; font-size:13.5px; line-height:1.4; color:var(--ink); min-height:44px}
.obj-item:last-child{border-bottom:0}
.obj-item:active{background:var(--surface-2)}
.obj-item > span{flex:1; min-width:0}
.obj-item i{flex:0 0 auto; font-style:normal; font-family:var(--mono); font-size:10.5px;
  color:var(--verde-oscuro); background:var(--verde-claro); border-radius:5px;
  padding:3px 7px; white-space:nowrap; margin-top:1px}

.btn-sugerencia{
  display:inline-flex; align-items:center; gap:6px; margin-top:7px;
  background:var(--verde-claro); border:1px solid #bcd9ec; border-radius:999px;
  color:var(--verde-oscuro); font-size:12.5px; font-weight:600; padding:7px 13px 7px 11px;
  min-height:38px; transition:background .16s var(--curva), transform .1s var(--curva);
}
.btn-sugerencia:active{transform:scale(.97); background:#d4e8f5}
.btn-sugerencia svg{width:15px; height:15px; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round}


.ind-edit{border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface);
  padding:8px; margin-bottom:8px}
.ind-edit textarea{width:100%; min-height:56px; font-size:14.5px; line-height:1.35; resize:vertical}
.ind-pie{display:flex; align-items:center; gap:7px; margin-top:7px}
.ind-pie .idx{font-family:var(--mono); font-size:11px; color:var(--soft); margin-right:auto}
.pts-edit{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--soft)}
.pts-edit input{width:52px; text-align:center; padding:5px 4px; font-size:13px}
.ind-pie .btn{padding:6px 10px; font-size:12.5px}

.criterio-edit{display:flex; gap:7px; align-items:flex-start; margin-bottom:7px}
.criterio-edit .idx{font-family:var(--mono); font-size:11px; color:var(--soft); padding-top:12px; min-width:18px}

/* ---------- Casillas de verificación ---------- */
.cas{
  width:44px; height:44px; flex:0 0 44px; border-radius:9px; border:1.5px solid #b9cfdc;
  background:var(--surface); font-size:19px; font-weight:700; color:#fff;
  display:inline-flex; align-items:center; justify-content:center; line-height:1;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.cas{transition:background .18s var(--curva), border-color .18s var(--curva), transform .12s var(--curva)}
.cas:active{transform:scale(.92)}
.cas.si{animation:marcar .22s var(--curva)}
@keyframes marcar{0%{transform:scale(.86)} 60%{transform:scale(1.06)} 100%{transform:scale(1)}}
.cas.si{background:var(--logro); border-color:var(--logro); box-shadow:0 1px 3px rgba(16,43,56,.2)}
.cas.no.si{background:var(--falta); border-color:var(--falta)}
.cas.nivel-cas{font-family:var(--mono); font-size:13px; color:var(--soft)}
.cas:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.descriptor-elegido{margin:5px 0 0; font-style:italic}
.etiqueta-tipo{display:inline-block; vertical-align:middle; font-size:11px; font-weight:700;
  background:var(--verde-claro); color:var(--verde-oscuro); border-radius:20px; padding:2px 9px; margin-left:4px}
.rejilla-cursos{display:grid; grid-template-columns:repeat(2, 1fr); gap:7px}
.ficha-curso{display:flex; align-items:center; gap:9px; border:1px solid var(--line);
  border-radius:var(--r-s); padding:11px 12px; min-height:46px; font-size:14px;
  transition:background .14s var(--curva), border-color .14s var(--curva)}
.ficha-curso input{width:19px; height:19px; flex:0 0 19px; margin:0; accent-color:var(--verde)}
.ficha-curso:has(input:checked){background:var(--verde-claro); border-color:#bcd9ec; font-weight:600}
.det-tarea{border:1px solid var(--line); border-radius:var(--r-s); margin-bottom:6px; overflow:hidden}
.det-tarea summary{padding:11px 12px; font-size:14px; font-weight:600; cursor:pointer;
  list-style:none; display:flex; justify-content:space-between; align-items:center; gap:8px;
  min-height:44px; transition:background .14s var(--curva)}
.det-tarea summary::-webkit-details-marker{display:none}
.det-tarea summary .mono{font-size:11px; color:var(--verde-oscuro); margin-right:5px}
.det-tarea summary i{font-style:normal; font-size:11px; font-weight:700; color:var(--verde-oscuro);
  background:var(--verde-claro); border-radius:999px; padding:2px 8px}
.det-tarea[open] summary{background:var(--surface-2); border-bottom:1px solid var(--line)}
.det-tarea .caja-oas{border:0; border-radius:0; max-height:none}
.oa-item.puesta{background:var(--verde-claro); color:var(--verde-oscuro); font-weight:600}
/* Lo aplicado, a la vista y con su propio botón para quitarlo. */
.caja-aplicadas{display:flex; flex-direction:column; gap:6px}
.quitar-ade{display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; background:var(--verde-claro); border:1px solid #bcd9ec;
  border-radius:var(--r-s); padding:10px 12px; min-height:44px; color:var(--verde-oscuro);
  font-size:13.5px; line-height:1.35; transition:background .14s var(--curva), transform .1s var(--curva)}
.quitar-ade:active{transform:scale(.99); background:#d4e8f5}
.quitar-ade i{flex:0 0 auto; font-style:normal; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:var(--falta)}
/* Trayectoria de un indicador a lo largo de las listas. */
.trayecto{padding:10px 12px; border-bottom:1px solid var(--line)}
.trayecto:last-child{border-bottom:0}
.trayecto .txt{margin:0 0 6px; font-size:13.5px; line-height:1.4}
.hitos{display:flex; align-items:center; flex-wrap:wrap; gap:5px}
.hito{display:inline-flex; flex-direction:column; align-items:center; gap:1px;
  border-radius:6px; padding:4px 8px; font-size:9.5px; letter-spacing:.02em;
  background:var(--surface-2); color:var(--soft); min-width:46px}
.hito b{font-family:var(--mono); font-size:12px}
.hito.ok{background:#e6f5ee; color:#1c7a55} .hito.medio{background:#fdf3e0; color:#8a6300}
.hito.bajo{background:#fbeceb; color:#a3322a}
.hitos i{font-style:normal; color:var(--soft); font-size:12px}
.hitos em{font-style:normal; margin-left:auto; font-family:var(--mono); font-size:12px; font-weight:700; color:var(--soft)}
.hitos em.sube{color:var(--logro)} .hitos em.baja{color:var(--falta)}


.aviso-pend{border:1px solid #e8c9c5; border-left:3px solid var(--falta); border-radius:var(--r-s);
  background:#fdf3f2; padding:11px 13px; margin:0 0 12px}
.aviso-pend b{display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--falta); margin-bottom:4px}
.aviso-pend p{margin:0; font-size:13px; line-height:1.45}

.aviso-dua{border:1px solid var(--line); border-left:3px solid var(--oro); border-radius:var(--r-s);
  background:var(--surface-2); padding:9px 11px; margin-top:10px; font-size:13px}
.aviso-dua b{display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--soft); margin-bottom:4px}
.aviso-dua ul{margin:0; padding-left:17px}
.aviso-dua li{margin-bottom:2px; line-height:1.35}
.marca-dua{display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.04em;
  background:var(--oro); color:#fff; border-radius:4px; padding:1px 5px; margin-left:5px; vertical-align:middle}

.det-desc{margin-top:8px}
.det-desc summary{font-size:12.5px; color:var(--verde-oscuro); cursor:pointer; padding:3px 0; list-style:none}
.det-desc summary::-webkit-details-marker{display:none}
.det-desc summary::before{content:"▸ "}
.det-desc[open] summary::before{content:"▾ "}
.ind-escala{display:flex; flex-direction:column; gap:5px; margin-bottom:11px; font-size:13.5px; line-height:1.3}
.ind-escala > span{font-weight:500}
.cabecera-lnl{display:flex; gap:5px; margin-bottom:-3px}
.cabecera-lnl span{width:44px; flex:0 0 44px; text-align:center; font-size:12px; font-weight:700;
  letter-spacing:.04em; color:var(--soft)}
.par-cas{display:inline-flex; gap:8px}
.par-cas.compacto .cas{width:38px; height:38px; flex:0 0 38px; font-size:17px}
.indicadores{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.indicador{display:grid; grid-template-columns:auto 1fr 46px; gap:10px; align-items:center;
  font-size:13.5px; line-height:1.35}
.indicador .pts-ind{display:block; font-style:normal; font-family:var(--mono);
  font-variant-numeric:tabular-nums; font-size:11px; text-align:center; color:var(--soft);
  background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:3px 0}
.indicador-mini{display:flex; flex-direction:column; align-items:center; gap:3px}
.indicador-mini b{font-size:10.5px; color:var(--soft)}
.insignia-nivel{
  font-family:var(--mono); font-size:11.5px; padding:4px 8px; border-radius:6px;
  border:1px solid var(--line); color:var(--soft); background:var(--surface-2); white-space:nowrap;
}
.insignia-nivel.verde{background:#e6f5ee; border-color:#b9e0cd; color:#1c7a55}
.insignia-nivel.media{background:#fdf3e0; border-color:#f0d9a8; color:#8a6300}
.insignia-nivel.roja{background:#fbeeec; border-color:#eecac5; color:#a33327}
.pts-pill{
  display:inline-block; font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:999px;
  background:rgba(255,255,255,.22); color:#fff; margin-top:3px;
}
.pts-pill.oscuro{background:var(--surface-2); color:var(--soft); border:1px solid var(--line)}
.planilla .th-ind .pts-pill{display:block; width:fit-content; margin:4px auto 0}
/* Un indicador por fila, en tres columnas fijas: número, texto y puntaje.
   Los anchos son iguales en todas las filas, así las columnas quedan a plomo. */
.lista-ind{margin:6px 0 0; padding:0; list-style:none; font-size:13.5px; color:var(--ink)}
.lista-ind li{
  display:grid; grid-template-columns:22px 1fr 46px; gap:10px; align-items:start;
  padding:9px 0; border-bottom:1px solid var(--line); line-height:1.4;
}
.lista-ind li:last-child{border-bottom:0}
.lista-ind b{font-family:var(--mono); font-size:11.5px; color:var(--soft);
  text-align:right; padding-top:2px}
.bloque-criterio{border:1px solid var(--line); border-radius:var(--r-s); padding:9px; margin-bottom:9px; background:var(--surface-2)}
.bloque-criterio textarea,.bloque-criterio input{background:var(--surface)}
/* ---------- Currículum ---------- */
.oa-chip{
  display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
  background:var(--verde-claro); color:var(--verde-oscuro); border:1px solid #bcdcee;
  border-radius:5px; padding:2px 6px; white-space:nowrap;
}
.caja-oas{max-height:46vh; overflow:auto; border:1px solid var(--line); border-radius:var(--r-s); padding:10px; background:var(--surface-2)}
.eje-tit{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--verde-oscuro); margin:10px 0 6px}
.eje-tit:first-child{margin-top:0}
.ficha-pauta{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-s); padding:11px 12px; margin-bottom:8px;
  transition:border-color .16s var(--curva), transform .1s var(--curva)}
.ficha-pauta:active{transform:scale(.99); border-color:var(--verde)}
.ficha-pauta b{display:block; font-family:var(--display); font-size:15px; font-weight:700;
  letter-spacing:-.015em; color:var(--verde-oscuro); line-height:1.25}
.ficha-pauta i{display:inline-block; font-style:normal; font-size:10.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:var(--soft); margin:4px 0 5px}
.ficha-pauta span{display:block; font-size:12.5px; line-height:1.4; color:var(--soft)}

.cab-criterio{border-left:3px solid var(--verde); padding-left:11px; margin-bottom:14px}
.barra-curso{padding:12px 0 14px; border-bottom:1px solid var(--line); margin-bottom:4px}
.lista-ind li > span{min-width:0}
/* Puntaje: mismo ancho y misma forma en todas las filas, sea 3 o 12. */
.lista-ind .pts-ind{
  display:block; font-style:normal; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:11px; text-align:center; color:var(--soft);
  background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
  padding:3px 0; margin-top:1px;
}

.oa-item{
  display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:8px 9px; margin-bottom:6px; font-size:12.5px; line-height:1.35;
}
.oa-item input{width:auto; flex:0 0 auto; margin-top:2px}
.oa-item b{color:var(--verde-oscuro)}
.caja-escala{border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface-2); padding:10px; margin:0 0 14px}
.rejilla-escala{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; max-height:46vh; overflow:auto}
.par-nota{
  display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 4px;
  border:1px solid var(--line); border-radius:7px; background:var(--surface);
}
.par-nota b{font-size:11px; color:var(--soft); font-weight:600}
.par-nota i{font-style:normal; font-size:14px; font-weight:600; color:var(--verde)}
.par-nota.roja i{color:var(--n1)}
.bloque-unidad{border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface); padding:10px; margin-bottom:10px}
.titulo-unidad{font-weight:600; font-size:14px; margin:0; color:var(--verde-oscuro); line-height:1.3}
.fuente{font-size:10.5px; color:var(--soft); margin:12px 0 0; line-height:1.4}

/* ---------- Cabecera de la evaluación ---------- */
.titulo-curso{font-size:21px; color:var(--verde); letter-spacing:-.02em}
.pastilla{
  display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--soft);
  border:1px solid var(--line); border-radius:999px; padding:5px 11px; background:var(--surface);
  white-space:nowrap;
}
.pastilla b{color:var(--verde); font-weight:700}

/* Cifras de la lista: lo que se mira de reojo antes de entrar a marcar. */
/* Cada cifra se pinta según cómo va: verde bien, ámbar atención, rojo problema.
   El color de fondo es tenue; el peso lo lleva la barra superior. */
/* Foco sugerido: el indicador que más costó al curso. */
.foco{margin-top:11px; padding:11px 13px; border:1px solid var(--line);
  border-left:3px solid var(--oro); border-radius:var(--r-s); background:var(--surface-2)}
.foco b{display:block; font-family:var(--display); font-size:10.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--soft); margin-bottom:4px}
.foco p{margin:0; font-size:14px; line-height:1.4}
.foco .mono{font-size:11.5px; color:var(--verde-oscuro); margin-right:4px}
.foco-pct{display:block; margin-top:5px; font-size:12px; color:var(--falta); font-weight:600}

.panel-cifras{display:grid; grid-template-columns:repeat(4, 1fr); gap:7px; margin-top:13px}
.cifra{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s);
  padding:10px 6px 9px; text-align:center; position:relative; overflow:hidden;
  transition:background .2s var(--curva), border-color .2s var(--curva)}
.cifra::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--line)}
.cifra b{display:block; font-family:var(--display); font-size:21px; font-weight:800; line-height:1.1;
  letter-spacing:-.02em; color:var(--soft); font-variant-numeric:tabular-nums;
  transition:color .2s var(--curva)}
.cifra span{display:block; font-size:10.5px; color:var(--soft); margin-top:4px; letter-spacing:.02em}

/* Cada cifra tiene su color fijo, para reconocerla de un vistazo.
   El rojo queda reservado para avisar de un valor que requiere atención. */
/* Las cuatro cifras comparten el celeste de la app. */
.cifra.c-prom,.cifra.c-logro,.cifra.c-pend,.cifra.c-aus{
  background:#e8f3fa; border-color:#bcdcef;
}
.cifra.c-prom::before,.cifra.c-logro::before,
.cifra.c-pend::before,.cifra.c-aus::before{background:#4aa3d4}
.cifra.c-prom b,.cifra.c-logro b,.cifra.c-pend b,.cifra.c-aus b{color:var(--verde-oscuro)}

.cifra.alerta{background:#fbf0ef; border-color:#e8c9c5}
.cifra.alerta::before{background:var(--falta)}
.cifra.alerta b{color:var(--falta)}
.cifra.gris::before{background:var(--soft)}
.cifra.gris b{color:var(--ink)}

.tira-oa{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}

.barra-acciones{display:flex; align-items:flex-end; gap:10px; margin-top:13px}
.campo-fecha{flex:0 0 148px}
.campo-fecha span{display:block; font-size:11px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; color:var(--soft); margin-bottom:4px}
.campo-fecha input{width:100%; text-align:center}
.barra-acciones .btn{flex:1; padding:11px 12px}

.acciones-menores{margin-top:10px; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  padding-bottom:2px; border-top:1px solid var(--line); padding-top:11px}
.acciones-menores::-webkit-scrollbar{display:none}
.acciones-menores .btn{flex:0 0 auto}


/* ===== Panel pedagógico v128 ===== */
.acciones-principales{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin-top:13px;align-items:stretch}
.accion-continuar{min-height:46px;font-weight:800;letter-spacing:-.01em}
.menu-acciones{position:relative}
.menu-acciones>summary{list-style:none;height:100%;min-height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 13px;background:var(--surface);color:var(--verde-oscuro);font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
.menu-acciones>summary::-webkit-details-marker{display:none}.menu-acciones[open]>summary{background:var(--verde-claro);border-color:#aacfe4}

.tiras.v2{padding:8px;gap:8px}.tiras.v2 .tira{min-width:116px;text-align:left;padding:8px 10px}.tiras.v2 .tira b{font-size:12px;color:inherit;text-transform:uppercase;letter-spacing:.05em}.tiras.v2 .tira small{font-size:10px;margin-top:1px}.tiras.v2 .tira .tira-nombre{display:block;max-width:145px;margin-top:5px;font-size:12px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiras.v2 .tira.activa .tira-nombre{color:#fff}.tiras.v2 .tira.nueva{min-width:52px;text-align:center}
.cab-lista{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.estado-lista{display:inline-flex;align-items:center;gap:6px;border:1px solid #b8dfcf;background:#eaf7f1;color:#176b4c;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.estado-lista::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--logro)}:root[data-tema="oscuro"] .estado-lista{background:#18392f;border-color:#285f4d;color:#82d4b3}

.panel-cifras.v2{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.panel-cifras.v2 .cifra{padding:11px 5px 10px}.panel-cifras.v2 .cifra span{font-size:10px}
.panorama{margin-top:11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:11px 12px}.panorama-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}.panorama-cab b{font-family:var(--display);font-size:13px;color:var(--ink)}.panorama-cab span{font-size:10.5px;color:var(--soft);text-align:right}.panorama-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nivel-aprendizaje{border-radius:8px;padding:8px 6px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}.nivel-aprendizaje strong{display:block;font-family:var(--display);font-size:20px;line-height:1.1}.nivel-aprendizaje span{display:block;margin-top:3px;font-size:10px;color:var(--soft)}.nivel-aprendizaje.logrado{border-top:3px solid var(--logro)}.nivel-aprendizaje.proceso{border-top:3px solid var(--oro)}.nivel-aprendizaje.apoyo{border-top:3px solid var(--falta)}
.foco.v2{padding:12px 13px;border-left-width:4px;background:linear-gradient(135deg,var(--surface-2),var(--surface))}.foco.v2 .foco-titulo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}.foco.v2 .foco-titulo b{margin:0}.foco.v2 .foco-etiqueta{font-size:10px;font-weight:800;color:#7b5900;background:#fff5d9;border:1px solid #ecd9a2;border-radius:999px;padding:3px 7px;white-space:nowrap}.foco.v2 .foco-pct{color:var(--soft);font-weight:600}.foco-acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.fecha-compacta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.fecha-compacta .campo-fecha{flex:0 0 160px}.estado-guardado-mini{font-size:11px;color:var(--soft);padding-bottom:9px;text-align:right}.administrar-lista{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.administrar-lista>summary{cursor:pointer;color:var(--soft);font-size:11px;font-weight:700;width:max-content}.administrar-lista .fila{margin-top:8px}

.titulo-eval{font-family:var(--display); font-size:19px; font-weight:800; letter-spacing:-.028em;
  line-height:1.2; color:var(--verde-oscuro); text-wrap:balance}

.tiras{display:flex; gap:7px; overflow-x:auto; margin-top:12px; padding:9px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface-2); scrollbar-width:none}
.tiras::-webkit-scrollbar{display:none}
.tira{

  background:var(--surface); color:var(--verde); text-align:center; line-height:1.15;
}

.btn-todos{margin-top:4px; border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.12); color:#fff; border-radius:6px; padding:2px 9px; font-size:11px}
.th-lnl{font-size:10px; padding:3px 4px; background:#17587e !important; color:rgba(255,255,255,.9); font-weight:600}
.planilla td{padding:4px 5px}

.celda-tap{width:52px; padding:3px 2px}
.raya{color:var(--line)}

.asis{

}

/* ---------- Modal ---------- */
.velo{position:fixed; inset:0; background:rgba(16,43,56,.42); display:flex; align-items:flex-end; justify-content:center; z-index:60; padding:0;
  animation:aparecer .18s var(--curva)}
@keyframes aparecer{from{opacity:0} to{opacity:1}}
.modal{background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;
  animation:subir .26s var(--curva)}
@keyframes subir{from{transform:translateY(18px)} to{transform:translateY(0)}}

  .velo{align-items:center; padding:20px}

}

/* ---------- Ingreso ---------- */
.ingreso{max-width:400px; margin:0 auto; padding:34px 16px 60px}
.ingreso .logo{display:flex; gap:3px; align-items:flex-end; height:34px; margin-bottom:16px}

/* Huesos del esqueleto: bloques grises que laten mientras se espera. */
.hueso{display:block; height:13px; border-radius:7px; margin-bottom:9px;
  background:linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2));

  border-bottom:1px solid var(--line)}
.fila-hueso .hueso{margin:0}
@keyframes latir{0%{background-position:200% 0} 100%{background-position:-200% 0}}

.vacio{text-align:center; padding:26px 14px; color:var(--soft); font-size:14px}
.vacio strong{display:block; color:var(--ink); font-family:var(--display); font-size:16px;
  margin-bottom:5px; letter-spacing:-.015em}
.vacio{max-width:340px; margin:0 auto; line-height:1.5}

/* ===== Apariencia v130 · Dashboard docente + móvil premium + modo cancha ===== */
:root{
  --dash-blue:#075f9f;
  --dash-blue-dark:#063f70;
  --dash-blue-soft:#eaf5fd;
  --dash-green:#169447;
  --dash-green-soft:#eef9f1;
  --dash-purple:#6d3db2;
  --dash-purple-soft:#f4effb;
  --dash-orange:#ed5a15;
  --dash-orange-soft:#fff4ec;
  --dash-gold:#e49a00;
  --dash-red:#e83932;
}
.barra-sup{background:linear-gradient(135deg,#073f70 0%,#0868a8 100%);border-bottom-color:#e8a400}
.dashboard-v130{padding:0;border:0;background:transparent;box-shadow:none;overflow:visible}

.dashboard-v130 .hero-status::before{content:"";width:8px;height:8px;border-radius:50%;background:#25a75a;box-shadow:0 0 0 3px rgba(37,167,90,.12)}

.dashboard-v130 .hero-primary{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px;margin-top:16px}
.dashboard-v130 .hero-primary .btn{min-height:52px;border-radius:12px;font-weight:850;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px}
.dashboard-v130 .hero-primary .btn-lleno{background:linear-gradient(135deg,#087bc2,#07569a);border-color:#07569a;box-shadow:0 6px 14px rgba(7,86,154,.18)}
.dashboard-v130 .hero-primary .btn-lleno::before{content:"▶";display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#fff;color:#0874b9;font-size:11px}
.dashboard-v130 .hero-primary .btn-resumen::before{content:"▥";font-size:19px;color:#547182}

.dashboard-v130 .quick-action{min-height:92px;border:1px solid #d9e3e9;background:#fff;border-radius:13px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;font-size:11.5px;font-weight:800;color:#294c64;transition:transform .12s var(--curva),border-color .15s var(--curva),background .15s var(--curva)}

<body>
<div id="raiz"></div>
<div id="capa-modal"></div>
<script type="module">
/* =========================================================
   Bases Curriculares de Educación Física y Salud
   Objetivos de Aprendizaje 1° a 8° básico
   Fuente: Unidad de Currículum y Evaluación, Mineduc
   www.curriculumnacional.cl
   ========================================================= */

const EJES = {
  hm: "Habilidades motrices",
  vas: "Vida activa y saludable",
  sjl: "Seguridad, juego limpio y liderazgo",
  rps: "Responsabilidad personal y social en el deporte y la actividad física",
  act: "Actitudes"
};

const OAA_1_6 = [
  { n: "A", t: "Valorar los efectos positivos de la práctica regular de actividad física en la salud." },
  { n: "B", t: "Demostrar disposición a mejorar su condición física e interés por practicar actividad física de forma regular." },
  { n: "C", t: "Demostrar confianza en sí mismos al practicar actividad física." },
  { n: "D", t: "Demostrar disposición a participar de manera activa en la clase." },
  { n: "E", t: "Promover la participación equitativa de hombres y mujeres en toda actividad física y deporte." },
  { n: "F", t: "Respetar la diversidad física de las personas, sin discriminar por características como altura, peso, color de piel o pelo, etc." },
  { n: "G", t: "Demostrar disposición a trabajar en equipo, colaborar con otros y aceptar consejos y críticas." },
  { n: "H", t: "Demostrar disposición al esfuerzo personal, superación y perseverancia." }
];

const OAA_7_8 = [
  { n: "A", t: "Demostrar respeto por los demás al participar en actividades físicas y/o deportivas; por ejemplo: aplicar el principio de juego limpio, llegar a acuerdos, jugar en forma cooperativa, aceptar el resultado y manejar el triunfo." },
  { n: "B", t: "Promover la participación de todos en las actividades físicas, valorando la diversidad de las personas, sin discriminar por características como altura, peso, color de piel, origen, condición física, discapacidades, etc." },
  { n: "C", t: "Trabajar en equipo, asumiendo responsablemente roles y tareas, colaborando con otros y aceptando consejos y críticas." },
  { n: "D", t: "Apreciar la práctica regular de actividades físicas y deportivas como fuente de bienestar, recreación y crecimiento en lo personal y social." },
  { n: "E", t: "Demostrar valoración de la práctica regular de actividades físicas y/o deportivas como medios de crecimiento, bienestar y recreación personal y social." },
  { n: "F", t: "Demostrar iniciativa en la promoción de una vida activa y los deportes, con sus compañeros y en la comunidad escolar." },
  { n: "G", t: "Cuidar el medio ambiente, la infraestructura y los materiales utilizados durante la práctica de actividad física y/o deportiva." }
];

const CURRICULO = {
  c1: { sigla: "EF01", oaa: OAA_1_6, oas: [
    { n: 1, e: "hm", t: "Demostrar habilidades motrices básicas de locomoción, manipulación y estabilidad en una variedad de juegos y actividades físicas, como saltar con dos pies consecutivamente en una dirección, lanzar un balón hacia un compañero, caminar y correr consecutivamente, lanzar y recoger un balón, caminar sobre una línea manteniendo el control del cuerpo, realizar suspensiones, giros y rodadas o volteos." },
    { n: 2, e: "hm", t: "Ejecutar acciones motrices con relación a sí mismo, a un objeto o un compañero, usando diferentes categorías de ubicación espacial y temporal, como derecha, izquierda, adelante, atrás, arriba, abajo, adentro, afuera, entre, al lado, antes, durante, después, rápido y lento." },
    { n: 3, e: "hm", t: "Practicar una amplia gama de juegos con y sin oposición, con y sin colaboración, de persecución, individuales y colectivos." },
    { n: 4, e: "hm", t: "Ejecutar habilidades motrices básicas en diferentes entornos, como las plazas activas, el patio del colegio, parques, playas, entre otros." },
    { n: 5, e: "hm", t: "Ejecutar movimientos corporales, expresando sensaciones, ideas, estados de ánimo y emociones en variados espacios y a diferentes ritmos." },
    { n: 6, e: "vas", t: "Ejecutar actividades físicas de intensidad moderada a vigorosa que incrementen la condición física, por medio de juegos y circuitos." },
    { n: 7, e: "vas", t: "Practicar en su vida cotidiana actividades físicas de intensidad moderada a vigorosa de forma guiada, por medio de juegos tradicionales y actividades lúdicas." },
    { n: 8, e: "vas", t: "Reconocer las sensaciones y respuestas corporales provocadas por la práctica de actividad física, como cambios del color de la piel, sudor, agitación, ritmo de respiración, cansancio y dificultad al hablar." },
    { n: 9, e: "vas", t: "Practicar actividades físicas en forma segura, demostrando la adquisición de hábitos de higiene, posturales y de vida saludable, como lavarse las manos y la cara después de la clase, mantener una correcta postura y comer una colación saludable antes y después de practicar actividad física." },
    { n: 10, e: "sjl", t: "Practicar juegos o actividades motrices para aprender a trabajar en equipo, asumiendo diferentes roles (respetar al otro, recoger los materiales solicitados o liderar si se le asigna ese rol)." },
    { n: 11, e: "sjl", t: "Practicar actividades físicas, demostrando comportamientos seguros como: realizar un calentamiento mediante un juego; escuchar y seguir instrucciones; utilizar implementos bajo supervisión; mantener su posición dentro de los límites establecidos para la actividad." }
  ] },

  c2: { sigla: "EF02", oaa: OAA_1_6, oas: [
    { n: 1, e: "hm", t: "Demostrar habilidades motrices básicas de locomoción, manipulación y estabilidad en diferentes direcciones, alturas y niveles, como saltar de forma continua en un pie y luego en el otro, botear un balón mientras camina, mantener el equilibrio sobre una base a una pequeña altura, realizar suspensiones, giros y rodadas o volteos." },
    { n: 2, e: "hm", t: "Ejecutar acciones motrices que presenten una solución a un problema, por ejemplo, agrupaciones, representaciones de símbolos, letras, números o figuras geométricas." },
    { n: 3, e: "hm", t: "Practicar una amplia gama de juegos con y sin oposición, con y sin colaboración, de persecución, individuales y colectivos." },
    { n: 4, e: "hm", t: "Ejecutar habilidades motrices básicas en diferentes entornos, como plazas activas, patio del colegio, playa, entre otros, utilizando referencias (rutas, mapas, símbolos, etc.) guiados por el profesor." },
    { n: 5, e: "hm", t: "Ejecutar movimientos corporales, expresando sensaciones, ideas, estados de ánimo y emociones en variados espacios y a diferentes ritmos e intensidades." },
    { n: 6, e: "vas", t: "Ejecutar actividades físicas de intensidad moderada a vigorosa que incrementen la condición física por medio de juegos y circuitos." },
    { n: 7, e: "vas", t: "Ejecutar e incorporar a su vida cotidiana juegos y actividades físicas de intensidad moderada a vigorosa (cinco veces por semana), como juegos tradicionales, saltar la cuerda y realizar caminatas al aire libre." },
    { n: 8, e: "vas", t: "Describir las sensaciones y respuestas corporales provocadas por la práctica de actividad física, como cambios del color de la piel, sudor, agitación, ritmo de respiración, cansancio y dificultad al hablar." },
    { n: 9, e: "vas", t: "Practicar actividades físicas en forma segura, demostrando la adquisición de hábitos de higiene, posturales y de vida saludable, como lavarse las manos y la cara después de la clase, mantener una correcta postura y comer una colación saludable antes y luego de la práctica de actividad física." },
    { n: 10, e: "sjl", t: "Practicar juegos o actividades motrices para aprender a trabajar en equipo, asumiendo diferentes roles (respetar al otro, recoger los materiales solicitados o liderar si se le asigna ese rol)." },
    { n: 11, e: "sjl", t: "Practicar actividades físicas, demostrando comportamientos seguros, como: realizar un calentamiento mediante un juego; escuchar y seguir instrucciones; utilizar implementos bajo supervisión; mantener su posición dentro de los límites establecidos para la actividad." }
  ] },

  c3: { sigla: "EF03", oaa: OAA_1_6, oas: [
    { n: 1, e: "hm", t: "Demostrar capacidad para ejecutar de forma combinada las habilidades motrices básicas de locomoción, manipulación y estabilidad en diferentes direcciones, alturas y niveles, ejemplo, correr y lanzar un objeto con una mano, caminar sobre una línea y realizar un giro de 180° en un pie." },
    { n: 2, e: "hm", t: "Ejecutar acciones motrices que presenten una solución a un problema, reconociendo diversos criterios (tiempo, espacio y números de personas), por ejemplo, juegos de uno contra uno, juegos en grupos reducidos y juegos con superioridad numérica." },
    { n: 3, e: "hm", t: "Practicar juegos pre-deportivos con reglas y espacios adaptados, aplicando los principios generales de juego, como avanzar y retroceder en bloque, recuperar el balón, acompañar la jugada y la visión periférica." },
    { n: 4, e: "hm", t: "Ejecutar actividades físicas y/o lúdicas en diferentes entornos, aplicando medidas para conservar limpios y ordenados los espacios, por ejemplo: jugar en plazas activas; jugar un partido en la plaza o la playa; realizar caminatas en el entorno natural; andar en bicicleta en un parque o en un camino rural." },
    { n: 5, e: "hm", t: "Ejecutar movimientos o elementos de danzas tradicionales de forma coordinada, utilizando actividades rítmicas y lúdicas de forma individual o grupal." },
    { n: 6, e: "vas", t: "Ejecutar actividades físicas de intensidad moderada a vigorosa que desarrollen la condición física por medio de la práctica de ejercicios de resistencia cardiovascular, fuerza, flexibilidad y velocidad, mejorando sus resultados personales." },
    { n: 7, e: "vas", t: "Practicar de manera regular y autónoma actividades físicas de intensidad moderada a vigorosa, como saltar la cuerda y caminar hasta el colegio." },
    { n: 8, e: "vas", t: "Describir y registrar las respuestas corporales provocadas por la práctica de actividad física, como aumento de la frecuencia cardiaca y respiratoria." },
    { n: 9, e: "vas", t: "Practicar actividades físicas en forma segura, demostrando la adquisición de hábitos de higiene, posturales y de vida saludable, como utilizar protección solar, lavarse y cambiarse de ropa después de la clase, hidratarse con agua, comer una colación saludable después de la práctica de actividad física." },
    { n: 10, e: "sjl", t: "Practicar actividades físicas y/o juegos colectivos con responsabilidad y honestidad, cumpliendo las reglas, los roles asignados y los principios de un juego limpio." },
    { n: 11, e: "sjl", t: "Practicar actividades físicas, demostrando comportamientos seguros, como: participar en actividades de calentamiento en forma apropiada; escuchar y seguir instrucciones; mantener su posición dentro de los límites establecidos para la actividad; asegurar que el espacio está libre de obstáculos." }
  ] },

  c4: { sigla: "EF04", oaa: OAA_1_6, oas: [
    { n: 1, e: "hm", t: "Demostrar control en la ejecución de las habilidades motrices básicas de locomoción, manipulación y estabilidad en diferentes direcciones, alturas y niveles; por ejemplo: atrapar un objeto con una mano a diferentes alturas, desplazarse botando un objeto en zigzag y saltar, caminar sobre una base a una pequeña altura y realizar un giro de 360° en un solo pie." },
    { n: 2, e: "hm", t: "Ejecutar juegos colectivos y crear estrategias con el apoyo del docente para resolver problemas en relación con el tiempo, el espacio y el número de personas; por ejemplo: dar cinco pases sin que el equipo rival lo intercepte o sin que el objeto caiga." },
    { n: 3, e: "hm", t: "Practicar juegos predeportivos con reglas y espacios adaptados, aplicando los principios generales de juego, como acoplarse en ataque y replegarse en defensa, utilizar el campo de juego a lo largo y ancho o reconocer el espacio del adversario." },
    { n: 4, e: "hm", t: "Ejecutar actividades físicas y/o lúdicas en diferentes entornos, aplicando medidas para conservar limpios y ordenados los espacios, como: jugar en plazas activas; jugar un partido en la plaza o la playa; realizar caminatas en el entorno natural; andar en bicicleta en un parque o en un camino rural." },
    { n: 5, e: "hm", t: "Ejecutar movimientos o elementos de danzas tradicionales de forma coordinada, utilizando actividades rítmicas y lúdicas de forma individual o grupal." },
    { n: 6, e: "vas", t: "Ejecutar actividades físicas de intensidad moderada a vigorosa que desarrollen la condición física por medio de la práctica de ejercicios de resistencia cardiovascular, fuerza, flexibilidad y velocidad, mejorando sus resultados personales." },
    { n: 7, e: "vas", t: "Practicar de manera regular y autónoma actividades físicas de intensidad moderada a vigorosa, como saltar la cuerda y caminar hasta el colegio." },
    { n: 8, e: "vas", t: "Medir y registrar las respuestas corporales provocadas por la actividad física mediante el pulso o utilizando escalas de percepción de esfuerzo." },

/* Busca a qué tarea pertenece un indicador para ofrecer sus remediales. */
function tareaDelIndicador(texto) {
  const t = (texto || "").trim();
  if (!t) return null;
  const exacto = TAREAS.find(([, items]) => items.includes(t));
  if (exacto) return exacto[0].replace(" · pauta formativa", "");
  const bajo = t.toLowerCase();
  const claves = [
    ["valla", "Salto de vallas"], ["cuerda", "Salto de cuerda girada por el profesor"],
    ["un pie", "Salto en un pie"], ["lanz", "Lanzamiento y recepción"],
    ["recib", "Lanzamiento y recepción"], ["bote", "Bote y conducción del balón"],
    ["bota", "Bote y conducción del balón"], ["equilibri", "Equilibrio y estabilidad"],
    ["gir", "Giros, rodadas y volteos"], ["rueda", "Giros, rodadas y volteos"],
    ["corr", "Carrera de velocidad"], ["resistencia", "Resistencia y trabajo aeróbico"],
    ["danza", "Danza y expresión rítmica"], ["ritmo", "Danza y expresión rítmica"],
    ["equipo", "Actitud"], ["respet", "Actitud"], ["particip", "Actitud"], ["esfuerzo", "Actitud"]
  ];
  const hallada = claves.find(([k]) => bajo.includes(k));
  return hallada ? hallada[1] : null;
}

  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    const fallo = esEscala(ev)
      ? (() => { const v = nivelDe(ev, i, j, q); return v && puntosNivel(ev, v) / maxNivel(ev) < 0.6; })()
      : marcaDe(ev, i, j, q) === 2;
    if (fallo) fallidos.push({ rot: `${j + 1}.${q + 1}`, texto: ind.texto, oa: c.oa, tarea: tareaDelIndicador(ind.texto) });
  }));
  const tareas = [...new Set(fallidos.map((x) => x.tarea).filter(Boolean))];
  return { fallidos, tareas };
}

function oasDelCurso(cursoId) {
  const c = CURRICULO[cursoId];
  if (!c) return [];
  const lista = c.oas.map((o) => ({
    codigo: `${c.sigla} OA ${String(o.n).padStart(2, "0")}`,
    eje: o.e, ejeNombre: EJES[o.e], texto: o.t
  }));
  c.oaa.forEach((o) => lista.push({
    codigo: `${c.sigla} OAA ${o.n}`,
    eje: "act", ejeNombre: EJES.act, texto: o.t
  }));
  return lista;
}

function esTextoDeOA(texto, cursoId) {
  const t = (texto || "").trim();
  return !!t && oasDelCurso(cursoId).some((o) => o.texto.trim() === t);
}

function opcionesOAsHTML(cursoId, ev, actual) {
  const usados = new Set((ev && ev.criterios ? ev.criterios : []).map((c) => c.oa).filter(Boolean));
  if (actual) usados.delete(actual);
  const grupos = {};
  oasDelCurso(cursoId).forEach((o) => { (grupos[o.ejeNombre] = grupos[o.ejeNombre] || []).push(o); });
  return Object.entries(grupos).map(([eje, lista]) => `
    <optgroup label="${esc(eje)}">
      ${lista.map((o) => `<option value="${esc(o.codigo)}" ${o.codigo === actual ? "selected" : ""} ${usados.has(o.codigo) ? "disabled" : ""}>${esc(o.codigo)}${usados.has(o.codigo) ? " (ya está)" : ""} · ${esc(recorte(o.texto, 70))}</option>`).join("")}
    </optgroup>`).join("");
}

function aplicarUnidad(ev, u, cods) {
  ev.oa = `Unidad ${u.n}: ${u.titulo}`;
  if (!ev.nombre || /^Lista de cotejo$/.test(ev.nombre)) ev.nombre = `Unidad ${u.n} · ${u.titulo}`;
  cods = cods || [];
  const vacio = ev.criterios.length === 1 && !ev.criterios[0].texto.trim() && !ev.criterios[0].oa;
  if (vacio && cods.length) { ev.criterios = []; ev.marcas.forEach((f) => { f.length = 0; }); ev.datos.forEach((f) => { f.length = 0; }); }
  cods.forEach((cod) => {
    if (ev.criterios.some((c) => c.oa === cod)) return;
    ev.criterios.push(criterioDesdeOA(cod, S.cursoId, 3));
    ev.marcas.forEach((f) => f.push([0, 0, 0]));
    ev.datos.forEach((f) => f.push(filaNiveles(ev.criterios[ev.criterios.length - 1])));
  });
  S.criterioActivo = 0; marcarCambio(); pintar();
}

function buscarOA(cursoId, codigo) {
  return oasDelCurso(cursoId).find((o) => o.codigo === codigo) || null;
}

/* ===== Escala de notas =====
   Exigencia configurable por lista, 60% por omisión. Nota mínima 2,0 · aprobación 4,0 con el corte del
   puntaje · nota máxima 7,0 con el puntaje total. Los tramos son lineales. */
const EXIGENCIA = 60;
const NOTA_MIN = 2, NOTA_APROB = 4, NOTA_MAX = 7;

function calcularNota(puntaje, total, exig) {
  if (!total || total <= 0) return null;
  const corte = (total * exigenciaValida(exig)) / 100;
  let n;
  if (corte <= 0) n = NOTA_MAX;
  else if (puntaje <= corte) n = NOTA_MIN + (NOTA_APROB - NOTA_MIN) * (puntaje / corte);
  else if (total - corte <= 0) n = NOTA_MAX;
  else n = NOTA_APROB + (NOTA_MAX - NOTA_APROB) * ((puntaje - corte) / (total - corte));
  return Math.round(Math.min(NOTA_MAX, Math.max(NOTA_MIN, n)) * 10) / 10;
}

/* Puntaje mínimo que alcanza cada nota, para mostrar la escala completa */
function tablaNotas(total, exig) {
  const filas = [];
  for (let p = 0; p <= total; p++) filas.push({ p, nota: calcularNota(p, total, exig) });
  return filas;
}

const PALETA = ["#c0392b", "#d9701f", "#e0a50f", "#7fa83f", "#2e9e6b"];
function mezclar(a, b, t) {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.substr(i, 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  const v = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, "0");
  return `#${v(r1, r2)}${v(g1, g2)}${v(b1, b2)}`;
}
function colorNivel(k, total) {
  if (total <= 1) return PALETA[4];
  const t = ((k - 1) / (total - 1)) * (PALETA.length - 1);
  const i = Math.min(PALETA.length - 2, Math.floor(t));
  return mezclar(PALETA[i], PALETA[i + 1], t - i);
}
