/* Crea una lista para el curso abierto a partir de una plantilla. */
function listaDesdePlantilla(pl) {
  const n = S.datos.roster.length;
  const criterios = JSON.parse(JSON.stringify(pl.criterios));
  // Si la plantilla venía de otro nivel, se traducen los códigos de OA.
  if (pl.curso !== S.cursoId) {
    criterios.forEach((c) => {
      if (!c.oa) return;
      const eq = buscarOA(S.cursoId, c.oa.replace(/^EF\d\d/, CURRICULO[S.cursoId].sigla));
      if (eq) { c.oa = eq.codigo; c.eje = eq.eje; if (esTextoDeOA(c.texto, pl.curso)) c.texto = eq.texto; }
      else c.oa = "";
    });
  }
  return {
    id: idNuevo(), nombre: pl.nombre, fecha: hoy(), oa: pl.oa || "",
    tipo: pl.tipo || "docente", adeModo: "curso", ade: null,
    exigencia: exigenciaValida(pl.exigencia), peso: pesoDe(pl),
    ptsDefecto: pl.ptsDefecto || PTS_DEFECTO, modo: pl.modo || "cotejo",
    escala: JSON.parse(JSON.stringify(pl.escala)),
    criterios,
    marcas: Array.from({ length: n }, () => criterios.map((c) => Array(c.indicadores.length).fill(0))),
    datos: Array.from({ length: n }, () => criterios.map((c) => c.indicadores.map(() => 0))),
    estado: Array(n).fill(0),
    obs: Array(n).fill("")
  };
}

/* Deja una nómina nueva en un curso, ajustando las filas de todas sus listas. */
function ponerNomina(datos, nombres) {
  datos.roster = nombres.slice();
  datos.adecuaciones = nombres.map(() => []);
  const n = nombres.length;
  datos.evaluaciones.forEach((e) => {
    e.marcas = Array.from({ length: n }, () => e.criterios.map((c) => Array(c.indicadores.length).fill(0)));
    e.datos = Array.from({ length: n }, () => e.criterios.map((c) => c.indicadores.map(() => 0)));
    e.estado = Array(n).fill(0);
    e.obs = Array(n).fill("");
    if (Array.isArray(e.ade)) e.ade = Array.from({ length: n }, () => []);
  });
}

/* Lee el respaldo de Planillas EF y ofrece sus nóminas. */
function pedirNominaPlanillas() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      let j;
      try { j = JSON.parse(lector.result); } catch { j = null; }
      const cursos = j && j.cursos ? j.cursos : null;
      if (!cursos) {
        abrirModal(`<h3>No se pudo leer el archivo</h3>
          <p class="sub" style="margin:6px 0 0">Debe ser el respaldo que descarga Planillas EF, en formato .json.</p>
          <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`);
        return;
      }
      const hallados = CURSOS.map((c) => {
        const r = cursos[c.id] && Array.isArray(cursos[c.id].roster) ? cursos[c.id].roster : [];
        const limpios = r.map((x) => String(x || "").trim()).filter(Boolean);
        return limpios.length ? [c, limpios] : null;
      }).filter(Boolean);
      if (!hallados.length) {
        abrirModal(`<h3>El archivo no trae nóminas</h3>
          <p class="sub" style="margin:6px 0 0">No se encontraron estudiantes en ninguno de los ocho cursos.</p>
          <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`);
        return;
      }
      const actual = hallados.find(([c]) => c.id === S.cursoId);
      const todos = JSON.stringify(hallados.map(([c, r]) => [c.id, r]));
      abrirModal(`
        <h3>Nóminas encontradas</h3>
        <p class="sub" style="margin:4px 0 10px">Archivo de ${esc(j.app || "Planillas EF")}${j.fecha ? ` · ${esc(j.fecha)}` : ""}.
          Se copian solo los nombres; las marcas de esta app se reinician en los cursos que traigas.</p>
        <div class="caja-oas">${hallados.map(([c, r]) => `<button class="oa-item" data-accion="aplicar-nomina"
          data-c='${esc(JSON.stringify([[c.id, r]]))}'><b>${esc(c.nombre)}</b> · ${r.length} estudiantes<br>
          <span class="sub">${esc(recorte(r.join(", "), 70))}</span></button>`).join("")}</div>
        <div class="fila" style="margin-top:12px">
          <button class="btn btn-lleno" data-accion="aplicar-nomina" data-c='${esc(todos)}'>Traer los ${hallados.length} cursos</button>
          <button class="btn" data-accion="cerrar-modal">Cancelar</button>
        </div>
        ${actual ? "" : `<p class="sub" style="margin:9px 0 0">El curso abierto no viene en el archivo.</p>`}`);
    };
    lector.readAsText(f);
  };
  inp.click();
}

/* Medidas remediales aplicadas a un estudiante en esta lista. */
function medidasDe(i) {
  const ev = evalActual();
  ev.medidas = ev.medidas || [];
  if (!Array.isArray(ev.medidas[i])) ev.medidas[i] = [];
  return ev.medidas[i];
}

/* Adecuaciones del curso: valen para todas sus listas. */
function adeCurso(i) {
  S.datos.adecuaciones = S.datos.adecuaciones || [];
  if (!Array.isArray(S.datos.adecuaciones[i])) S.datos.adecuaciones[i] = [];
  return S.datos.adecuaciones[i];
}

const MODOS_ADE = ["curso", "propias", "ninguna"];
const adeModo = (ev) => (ev && MODOS_ADE.includes(ev.adeModo) ? ev.adeModo : "curso");

/* Adecuaciones que rigen en una lista concreta. */
function adeDeLista(ev, i) {
  const modo = adeModo(ev);
  if (modo === "ninguna") return [];
  if (modo === "curso") return adeCurso(i);
  ev.ade = ev.ade || [];
  if (!Array.isArray(ev.ade[i])) ev.ade[i] = [];
  return ev.ade[i];
}

/* En la nómina se editan siempre las del curso; en el resto, las que rigen. */
function adeDe(i) {
  const ev = S.pestana === "curso" ? null : evalActual();
  return ev ? adeDeLista(ev, i) : adeCurso(i);
}

/* Agrega un estudiante y su fila en todas las listas del curso. */
function sumarEstudiante(nombre) {
  S.datos.roster.push(nombre);
  (S.datos.adecuaciones = S.datos.adecuaciones || []).push([]);
  S.datos.evaluaciones.forEach((e) => {
    e.marcas.push(e.criterios.map((c) => Array(c.indicadores.length).fill(0)));
    e.datos.push(e.criterios.map(filaNiveles));
    e.estado.push(0); e.obs.push("");
  });
}

function puntajeTotal(ev) {
  if (esEscala(ev)) return totalIndicadores(ev) * maxNivel(ev);
  let t = 0;
  ev.criterios.forEach((c) => c.indicadores.forEach((ind) => { t += Number(ind.pts) || 0; }));
  return t;
}

function totalIndicadores(ev) {
  return ev.criterios.reduce((a, c) => a + c.indicadores.length, 0);
}

function marcaDe(ev, i, j, q) {
  const f = ev.marcas[i];
  if (!f || !f[j]) return 0;
  return f[j][q] || 0;
}

/* Resultado de un estudiante: puntaje logrado sobre el total del instrumento */
function resultado(ev, i) {
  let puntaje = 0, marcados = 0, logrados = 0, sinMarca = 0;
  if (esEscala(ev)) {
    ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
      const v = nivelDe(ev, i, j, q);
      if (v) { puntaje += puntosNivel(ev, v); marcados++; if (v === nNiveles(ev)) logrados++; }
      else sinMarca++;
    }));
    const tot = puntajeTotal(ev);
    return { puntaje, total: tot, marcados, logrados, sinMarca,
      nota: marcados ? calcularNota(puntaje, tot, ev.exigencia) : null };
  }
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    const v = marcaDe(ev, i, j, q);
    if (v === 1) { puntaje += Number(ind.pts) || 0; logrados++; marcados++; }
    else if (v === 2) marcados++;
    else sinMarca++;
  }));
  const total = puntajeTotal(ev);
  return {
    puntaje, total, marcados, logrados, sinMarca,
    nota: marcados ? calcularNota(puntaje, total, ev.exigencia) : null
  };
}

/* Logro de un criterio para un estudiante */
function logroCriterio(ev, i, j) {
  const c = ev.criterios[j];
  let logrados = 0, marcados = 0, puntaje = 0, total = 0;
  if (esEscala(ev)) {
    c.indicadores.forEach((ind, q) => {
      total += maxNivel(ev);
      const v = nivelDe(ev, i, j, q);
      if (v) { marcados++; puntaje += puntosNivel(ev, v); if (v === nNiveles(ev)) logrados++; }
    });
    return { logrados, marcados, puntaje, total, n: c.indicadores.length };
  }
  c.indicadores.forEach((ind, q) => {
    const v = marcaDe(ev, i, j, q);
    total += Number(ind.pts) || 0;
    if (v === 1) { logrados++; marcados++; puntaje += Number(ind.pts) || 0; }
    else if (v === 2) marcados++;
  });
  return { logrados, marcados, puntaje, total, n: c.indicadores.length };
}

/* ===== Estructura de datos ===== */
function normalizarIndicador(x, ptsDefecto) {
  if (typeof x === "string") return { texto: x, pts: ptsDefecto };
  const o = x && typeof x === "object" ? x : {};
  const pts = Number(o.pts);
  return { texto: String(o.texto == null ? "" : o.texto), pts: Number.isFinite(pts) && pts >= 0 ? pts : ptsDefecto };
}

function normalizarCriterio(c, ptsDefecto) {
  const base = typeof c === "string" ? { texto: c } : (c && typeof c === "object" ? c : {});
  const texto = String(base.texto == null ? "" : base.texto);
  const oa = String(base.oa || "");
  const eje = String(base.eje || "");
  let indicadores = Array.isArray(base.indicadores) ? base.indicadores.map((x) => normalizarIndicador(x, ptsDefecto)) : [];
  if (!indicadores.length) indicadores = [{ texto: "", pts: ptsDefecto }];
  const descriptores = Array.isArray(base.descriptores) ? base.descriptores.slice(0, 8).map((x) => String(x == null ? "" : x)) : [];
  const objEval = String(base.objEval == null ? "" : base.objEval);
  return { texto, oa, eje, objEval, indicadores, descriptores };
}

function criterioDesdeOA(codigo, cursoId, nInd) {
  const oa = buscarOA(cursoId, codigo);
  const n = nInd || 3;
  const sug = (SUG_OA[codigo] || SUGERENCIAS[oa ? oa.eje : "hm"] || SUGERENCIAS.hm || []);
  return {
    texto: oa ? oa.texto : "",
    oa: oa ? oa.codigo : "",
    eje: oa ? oa.eje : "",
    objEval: "",
    indicadores: Array.from({ length: n }, (_, q) => ({ texto: sug[q] || "", pts: PTS_DEFECTO }))
  };
}

function nuevaEvaluacion(nAlumnos, oaCodigos, nombre, cursoId) {
  const cods = Array.isArray(oaCodigos) ? oaCodigos : [];
  let criterios = cods.map((c) => criterioDesdeOA(c, cursoId, 3));
  if (!criterios.length) criterios = [{ texto: "", oa: "", eje: "", indicadores: [
    { texto: "", pts: PTS_DEFECTO }, { texto: "", pts: PTS_DEFECTO }, { texto: "", pts: PTS_DEFECTO }] }];
  const auto = cods.length === 1 ? cods[0] : cods.length ? `${cods.length} objetivos` : "Lista de cotejo";
  return {
    id: idNuevo(),
    nombre: nombre || auto,
    fecha: hoy(),
    oa: "",
    tipo: "docente",
    medidas: [],
    adeModo: "curso",
    ade: null,
    exigencia: EXIGENCIA,
    peso: 1,
    ptsDefecto: PTS_DEFECTO,
    modo: "cotejo",
    escala: { niveles: ESCALA_BASE.map((n) => ({ ...n })) },
    criterios,
    marcas: Array.from({ length: nAlumnos }, () => criterios.map((c) => Array(c.indicadores.length).fill(0))),
    datos: Array.from({ length: nAlumnos }, () => criterios.map(filaNiveles)),
    estado: Array(nAlumnos).fill(0),
    obs: Array(nAlumnos).fill("")
  };
}

function cursoVacio(cursoId) {
  return { roster: [], adecuaciones: [], evaluaciones: [nuevaEvaluacion(0, [], "", cursoId)] };
}

function normalizar(d) {
  const base = d && typeof d === "object" ? d : {};
  const roster = Array.isArray(base.roster) ? base.roster.map((n) => String(n || "")) : [];
  let evs = Array.isArray(base.evaluaciones) ? base.evaluaciones : [];
  if (!evs.length) evs = [nuevaEvaluacion(roster.length, [], "", S.cursoId)];
  const n = roster.length;
  return {
    roster,
    adecuaciones: Array.from({ length: n }, (_, i) => {
      const a = Array.isArray(base.adecuaciones) ? base.adecuaciones[i] : null;
      return Array.isArray(a) ? a.map((x) => String(x || "")).filter(Boolean) : [];
    }),
    evaluaciones: evs.map((e) => {
      const ptsDefecto = Number(e.ptsDefecto) > 0 ? Number(e.ptsDefecto) : PTS_DEFECTO;
      const crudos = Array.isArray(e.criterios) && e.criterios.length ? e.criterios : [""];
      const criterios = crudos.map((c) => normalizarCriterio(c, ptsDefecto));
      return {
        id: e.id || idNuevo(),
        nombre: e.nombre || "Lista de cotejo",
        fecha: e.fecha || hoy(),
        oa: e.oa || "",
        tipo: TIPOS[e.tipo] !== undefined ? e.tipo : "docente",
        adeModo: MODOS_ADE.includes(e.adeModo) ? e.adeModo : "curso",
        medidas: Array.from({ length: n }, (_, i) =>
          Array.isArray(e.medidas) && Array.isArray(e.medidas[i])
            ? e.medidas[i].map((x) => String(x || "")).filter(Boolean) : []),
        ade: Array.isArray(e.ade) ? Array.from({ length: n }, (_, i) =>
          Array.isArray(e.ade[i]) ? e.ade[i].map((x) => String(x || "")).filter(Boolean) : []) : null,
        exigencia: exigenciaValida(e.exigencia),
        peso: pesoDe(e),
        ptsDefecto,
        modo: e.modo === "escala" ? "escala" : "cotejo",
        escala: { niveles: (Array.isArray(e.escala && e.escala.niveles) && e.escala.niveles.length >= 2
          ? e.escala.niveles : ESCALA_BASE).slice(0, 8).map((x, k) => ({
            r: String(x && x.r != null ? x.r : "Nivel " + (k + 1)),
            p: Number.isFinite(Number(x && x.p)) ? Number(x.p) : k + 1 })) },
        criterios,
        marcas: Array.from({ length: n }, (_, i) =>
          criterios.map((c, j) =>
            Array.from({ length: c.indicadores.length }, (_, q) => {
              const v = e.marcas && e.marcas[i] && e.marcas[i][j] ? Number(e.marcas[i][j][q]) : 0;
              return v === 1 || v === 2 ? v : 0;
            }))),
        datos: Array.from({ length: n }, (_, i) =>
          criterios.map((c, j) => {
            const bruto = e.datos && e.datos[i] ? e.datos[i][j] : null;
            const limpio = (x) => { const v = Number(x); return v >= 1 && v <= 8 ? v : 0; };
            if (Array.isArray(bruto)) return c.indicadores.map((_, q) => limpio(bruto[q]));
            const v = limpio(bruto);
            return c.indicadores.map((_, q) => (q === 0 ? v : 0));
          })),
        estado: Array.from({ length: n }, (_, i) => {
          const v = e.estado ? Number(e.estado[i]) : 0;
          return v === 1 || v === 2 ? v : 0;
        }),
        obs: Array.from({ length: n }, (_, i) => (e.obs && e.obs[i]) || "")
      };
    })
  };
}

/* ===== Almacenamiento ===== */
let sb = null;
let sbListo = (async () => {
  try {
    const m = await import("https://esm.sh/@supabase/supabase-js@2");
    sb = m.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: "sb-evalef-auth" }
    });
  } catch (err) {
    console.warn("Sin conexión con el servidor:", err);
    sb = null;
  }
})();

async function usuarioActual() {
  if (!sb) return null;
  try {
    const { data } = await sb.auth.getSession();
    return data && data.session && data.session.user ? data.session.user : null;
  } catch { return null; }
}

const almacen = {
  async leer(cursoId) {
    const u = await usuarioActual();
    if (u) {
      const { data, error } = await sb.from(TABLA).select("contenido, actualizado")
        .eq("user_id", u.id).eq("curso_id", cursoId).maybeSingle();
      if (!error && data && data.contenido) {
        try { localStorage.setItem(PREFIJO + cursoId, JSON.stringify(data.contenido)); } catch {}
        anotarVersion(cursoId, data.actualizado);
        return normalizar(data.contenido);
      }
      if (error) throw new Error(error.message);
    }
    const local = localStorage.getItem(PREFIJO + cursoId);
    if (local) { try { return normalizar(JSON.parse(local)); } catch {} }
    return cursoVacio(cursoId);
  },
  /* Lo guardado en este equipo, sin consultar al servidor. */
  leerLocal(cursoId) {
    const local = localStorage.getItem(PREFIJO + cursoId);
    if (!local) return null;
    try { return normalizar(JSON.parse(local)); } catch { return null; }
  },
  async escribir(cursoId, obj, forzar) {
    try { localStorage.setItem(PREFIJO + cursoId, JSON.stringify(obj)); } catch {}
    const u = await usuarioActual();
    if (!u) throw new Error("sin-sesion");

    // Si el servidor cambió después de la última vez que leímos, otro
    // dispositivo escribió en medio: no se pisa sin preguntar.
    if (!forzar) {
      const { data } = await sb.from(TABLA).select("actualizado")
        .eq("user_id", u.id).eq("curso_id", cursoId).maybeSingle();
      const visto = versionVista(cursoId);
      if (data && data.actualizado && visto && data.actualizado > visto) {
        const e = new Error("conflicto");
        e.cursoId = cursoId; e.enServidor = data.actualizado;
        throw e;
      }
    }

    const sello = new Date().toISOString();
    const { error } = await sb.from(TABLA).upsert(
      { user_id: u.id, curso_id: cursoId, contenido: obj, actualizado: sello },
      { onConflict: "user_id,curso_id" }
    );
    if (error) throw new Error(error.message);
    anotarVersion(cursoId, sello);
  }
};

/* ===== Estado ===== */
const S = {
  sesion: null, verificando: true, sinCuenta: false, errorIngreso: "",
  cursoId: localStorage.getItem(PREFIJO + "ultimoCurso") || "c6",
  datos: null, cargando: true, errorCarga: "",
  evalIdx: 0, pestana: "evaluar", modo: "planilla", criterioActivo: 0, alumnoActivo: 0,
  ajustes: false, guardado: "ok", detalleError: ""
};

const evalActual = () => (S.datos ? S.datos.evaluaciones[Math.min(S.evalIdx, S.datos.evaluaciones.length - 1)] : null);

/* ===== Guardado ===== */
let temporizador = null, cursoPendiente = null, datosPendientes = null;
/* Guarda cómo estaba el curso antes de una acción que borra cosas,
   para poder volver atrás durante un rato. */
let deshacer = null;
let relojDeshacer = null;

function anotarDeshacer(descripcion) {
  deshacer = {
    descripcion,
    curso: S.cursoId,
    datos: JSON.parse(JSON.stringify(S.datos)),
    idx: S.evalIdx
  };
  clearTimeout(relojDeshacer);
  relojDeshacer = setTimeout(() => { deshacer = null; pintar(); }, 30000);
  pintar();
}

function aplicarDeshacer() {
  if (!deshacer || deshacer.curso !== S.cursoId) return;
  S.datos = normalizar(deshacer.datos);
  S.evalIdx = Math.min(deshacer.idx, S.datos.evaluaciones.length - 1);
  deshacer = null;
  clearTimeout(relojDeshacer);
  marcarCambio(); pintar();
}

function marcarCambio() {
  /* Se recuerda a qué curso pertenece el cambio: si se cambia de curso antes de
     que alcance a guardar, los datos igual van a donde corresponden. */
  cursoPendiente = S.cursoId;
  datosPendientes = S.datos;
  S.guardado = "pendiente";
  pintarEstado();
  clearTimeout(temporizador);
  temporizador = setTimeout(guardar, 700);
}
async function guardar() {
  const curso = cursoPendiente || S.cursoId;
  const datos = datosPendientes || S.datos;
  cursoPendiente = null; datosPendientes = null;
  if (!datos) return;
  S.guardado = "guardando"; S.detalleError = ""; pintarEstado();
  try {
    await almacen.escribir(curso, datos);
    S.guardado = "ok";
    marcarSubido(curso);
  } catch (e) {
    if (e.message === "conflicto") {
      S.guardado = "conflicto";
      marcarSinSubir(curso, "conflicto");
      avisarConflicto(curso);
      pintarEstado();
      return;
    }
    S.guardado = e.message === "sin-sesion" ? "local" : "error";
    S.detalleError = e.message === "sin-sesion" ? "" : e.message;
    marcarSinSubir(curso, e.message);
  }
  pintarEstado();
}

/* ---- Qué quedó sin llegar al servidor ----
   Si el gimnasio no tiene señal, la app guarda en el equipo. Este registro
   deja constancia de qué cursos faltan por subir y desde cuándo. */
/* Última versión del servidor que este equipo alcanzó a ver, por curso. */
const CLAVE_VER = PREFIJO + "versiones";

function versionesVistas() {
  try { const j = JSON.parse(localStorage.getItem(CLAVE_VER) || "{}"); return j && typeof j === "object" ? j : {}; }
  catch { return {}; }
}
const versionVista = (cursoId) => versionesVistas()[cursoId] || null;

function anotarVersion(cursoId, sello) {
  if (!sello) return;
  const v = versionesVistas();
  v[cursoId] = sello;
  try { localStorage.setItem(CLAVE_VER, JSON.stringify(v)); } catch {}
}

const CLAVE_PEND = PREFIJO + "pendientes";

function leerPendientes() {
  try { const j = JSON.parse(localStorage.getItem(CLAVE_PEND) || "{}"); return j && typeof j === "object" ? j : {}; }
  catch { return {}; }
}

function marcarSinSubir(curso, motivo) {
  const p = leerPendientes();
  if (!p[curso]) p[curso] = { desde: new Date().toISOString(), motivo };
  else p[curso].motivo = motivo;
  try { localStorage.setItem(CLAVE_PEND, JSON.stringify(p)); } catch {}
}

function marcarSubido(curso) {
  const p = leerPendientes();
  if (!p[curso]) return;
  delete p[curso];
  try { localStorage.setItem(CLAVE_PEND, JSON.stringify(p)); } catch {}
}

/* Cuando otro dispositivo escribió en medio, se pregunta con cuál quedarse. */
function avisarConflicto(cursoId) {
  const nombre = (CURSOS.find((c) => c.id === cursoId) || {}).nombre || cursoId;
  abrirModal(`
    <h3>Hay otra versión de ${esc(nombre)}</h3>
    <p class="sub" style="margin:6px 0 10px">Este curso se modificó en otro dispositivo después de la última vez
      que se abrió aquí. Para no borrar trabajo sin querer, no se guardó nada todavía.</p>
    <div class="fila" style="flex-direction:column;gap:8px;align-items:stretch">
      <button class="btn btn-ancho" data-accion="conflicto-traer" data-c="${cursoId}">Traer la del servidor</button>
      <span class="sub">Se descartan los cambios hechos en este equipo.</span>
      <button class="btn btn-ancho" data-accion="conflicto-respaldo" data-c="${cursoId}">Descargar lo de este equipo</button>
      <span class="sub">Guarda una copia antes de decidir.</span>
      <button class="btn btn-ancho btn-peligro" data-accion="conflicto-forzar" data-c="${cursoId}">Conservar la de este equipo</button>
      <span class="sub">Reemplaza lo que hay en el servidor.</span>
    </div>`);
}

/* Reintenta subir todo lo que quedó pendiente. */
async function reintentarPendientes() {
  const p = leerPendientes();
  const cursos = Object.keys(p);
  if (!cursos.length) return;
  const fallaron = [];
  for (const c of cursos) {
    try {
      const d = c === S.cursoId ? S.datos : await almacen.leerLocal(c);
      if (!d) { marcarSubido(c); continue; }
      await almacen.escribir(c, d);
      marcarSubido(c);
    } catch (e) { fallaron.push(CURSOS.find((x) => x.id === c)?.nombre || c); }
  }
  pintar();
  abrirModal(fallaron.length
    ? `<h3>Quedaron cursos sin subir</h3>
       <p class="sub" style="margin:6px 0 0">${esc(fallaron.join(", "))}. Vuelve a intentarlo cuando tengas señal.</p>
       <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`
    : `<h3>Todo sincronizado</h3>
       <p class="sub" style="margin:6px 0 0">No queda nada por subir.</p>
       <div class="fila" style="margin-top:12px"><button class="btn btn-lleno" data-accion="cerrar-modal">Listo</button></div>`);
}
function pintarEstado() {
  const c = $("#estado");
  if (!c) return;
  const mapa = {
    ok: ["", "Guardado automático"], guardando: ["trabajando", "Guardando…"],
    conflicto: ["error", "Hay otra versión"],
    pendiente: ["trabajando", "Guardando…"], local: ["error", "Solo en este equipo"],
    error: ["error", "No se pudo guardar"]
  };
  const pend = Object.keys(leerPendientes()).length;
  let [cls, txt] = mapa[S.guardado] || mapa.ok;
  if (pend && S.guardado !== "guardando") { cls = "error"; txt = `${pend} curso${pend > 1 ? "s" : ""} sin subir`; }
  c.innerHTML = `<span class="punto ${cls}"></span><span>${esc(txt)}</span>`;
}

/* ===== Carga de curso ===== */
async function cargarCurso(id) {
  if (datosPendientes) { clearTimeout(temporizador); await guardar(); }
  S.cursoId = id; S.cargando = true; S.errorCarga = ""; S.evalIdx = 0;
  S.criterioActivo = 0; S.alumnoActivo = 0; S.ajustes = false;
  try { localStorage.setItem(PREFIJO + "ultimoCurso", id); } catch {}
  pintar();
  try { S.datos = await almacen.leer(id); }
  catch (e) { S.errorCarga = e.message; S.datos = cursoVacio(id); }
  S.cargando = false;
  pintar();
}

/* Zonas que el profesor deja desplazadas y no deben volver al inicio al repintar. */
const ZONAS_SCROLL = ".envoltura-tabla,.tiras,.tira-crit";

function guardarScroll() {
  return {
    y: window.scrollY,
    zonas: [...document.querySelectorAll(ZONAS_SCROLL)].map((e) => [e.scrollLeft, e.scrollTop])
  };
}

function devolverScroll(memoria) {
  const zonas = [...document.querySelectorAll(ZONAS_SCROLL)];
  memoria.zonas.forEach(([izq, arriba], i) => {
    if (!zonas[i]) return;
    zonas[i].scrollLeft = izq;
    zonas[i].scrollTop = arriba;
  });
  if (Math.abs(window.scrollY - memoria.y) > 1) window.scrollTo(0, memoria.y);
}

function aplicarTema() {
  const elegido = temaGuardado();
  const oscuroSistema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const resuelto = elegido === "auto" ? (oscuroSistema ? "oscuro" : "claro") : elegido;
  document.documentElement.dataset.tema = resuelto;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = resuelto === "oscuro" ? "#123344" : resuelto === "sol" ? "#0b445f" : "#175f85";
}

/* ---- Cabecera que se encoge ---- */
function vigilarCabecera() {
  const barra = document.querySelector(".barra-sup");
  if (!barra) return;
  const ajustar = () => barra.classList.toggle("compacta", window.scrollY > 40);
  window.addEventListener("scroll", ajustar, { passive: true });
  ajustar();
}

/* ---- Deslizar entre estudiantes ---- */
function vigilarDeslizamiento() {
  let x0 = 0, y0 = 0, activo = false;
  document.addEventListener("touchstart", (evt) => {
    const zona = evt.target.closest && evt.target.closest(".zona-desliz");
    activo = !!zona && !evt.target.closest("input,textarea,select,button");
    if (!activo) return;
    x0 = evt.touches[0].clientX; y0 = evt.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", (evt) => {
    if (!activo) return;
    activo = false;
    const t = evt.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45) return;      // gesto claro y horizontal
    const ultimo = S.datos.roster.length - 1;
    const nuevo = S.alumnoActivo + (dx < 0 ? 1 : -1);
    if (nuevo < 0 || nuevo > ultimo) return;
    S.alumnoActivo = nuevo; pintar();
  }, { passive: true });
}

/* Al marcar, solo cambia esa casilla y los totales de su fila.
   Redibujar la app completa en cada toque se siente lento con 25 estudiantes. */
let relojResumen = null;

function refrescarMarca(ev, i, j, q) {
  const esc2 = (x) => String(x).replace(/"/g, "&quot;");
  // la casilla o el nivel que se acaba de tocar
  if (esEscala(ev)) {
    const v = nivelDe(ev, i, j, q);
    document.querySelectorAll(`[data-accion="ciclo-nivel"][data-i="${i}"][data-j="${j}"][data-q="${q}"]`).forEach((b) => {
      b.textContent = v || "";
      b.style.cssText = v ? `background:${colorNivel(v, nNiveles(ev))};color:#fff;border-color:transparent` : "";
    });
    document.querySelectorAll(`[data-accion="poner-nivel"][data-i="${i}"][data-j="${j}"][data-q="${q}"]`).forEach((b) => {
      b.setAttribute("aria-pressed", String(+b.dataset.k === v));
    });
  } else {
    const v = marcaDe(ev, i, j, q);
    [["marca-l", 1, "✓"], ["marca-nl", 2, "✗"]].forEach(([acc, val, signo]) => {
      document.querySelectorAll(`[data-accion="${acc}"][data-i="${i}"][data-j="${j}"][data-q="${q}"]`).forEach((b) => {
        b.classList.toggle("si", v === val);
        b.textContent = v === val ? signo : "";
        b.setAttribute("aria-pressed", String(v === val));
      });
    });
  }
  // los totales de ese estudiante
  const r = resultado(ev, i);
  const fila = document.querySelector(`tr[data-fila="${i}"]`);
  if (fila) {
    const pts = fila.querySelector("[data-cel=pts]");
    const nota = fila.querySelector("[data-cel=nota]");
    if (pts) pts.textContent = `${r.puntaje}/${r.total}`;
    if (nota) { nota.textContent = num1(r.nota); nota.className = `nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}`; }
  }
  // el resumen de arriba se recalcula al soltar, no en cada toque
  clearTimeout(relojResumen);
  relojResumen = setTimeout(pintar, 700);
}

function pintar() {
  const raiz = $("#raiz");
  if (S.verificando) { raiz.innerHTML = `<div class="vacio" style="padding-top:60px">Verificando sesión…</div>`; return; }
  if (!S.sesion && !S.sinCuenta) { raiz.innerHTML = vistaIngreso(); return; }
  const memoria = guardarScroll();

  pintarEstado();
}

/* --- Cabecera de la evaluación --- */
/* El indicador con menor logro del curso: por dónde conviene partir
   la próxima clase. Solo se propone si de verdad está descendido. */
function focoDelCurso(ev) {
  const n = S.datos.roster.length;
  if (!n) return null;
  let peor = null;
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    let suma = 0, cont = 0, apoyo = 0;
    for (let i = 0; i < n; i++) {
      if (ev.estado[i]) continue;
      if (esEscala(ev)) {
        const v = nivelDe(ev, i, j, q);
        if (v) { const ratio = puntosNivel(ev, v) / maxNivel(ev); suma += ratio; cont++; if (ratio < .75) apoyo++; }
      } else {
        const v = marcaDe(ev, i, j, q);
        if (v) { suma += v === 1 ? 1 : 0; cont++; if (v === 2) apoyo++; }
      }
    }
    if (!cont) return;
    const pct = Math.round((suma / cont) * 100);
    if (!peor || pct < peor.pct) peor = { rot: `${j + 1}.${q + 1}`, texto: ind.texto, oa: c.oa, pct, j, q, apoyo, observados: cont };
  }));
  return peor && peor.pct < 80 ? peor : null;
}

function panoramaAprendizaje(ev) {
  const r = { logrado: 0, proceso: 0, apoyo: 0, sinDatos: 0 };
  for (let i = 0; i < S.datos.roster.length; i++) {
    if (ev.estado[i]) continue;
    let suma = 0, maximo = 0;
    ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
      if (esEscala(ev)) {
        const v = nivelDe(ev, i, j, q);
        if (v) { suma += puntosNivel(ev, v); maximo += maxNivel(ev); }
      } else {
        const v = marcaDe(ev, i, j, q);
        if (v) { maximo += Number(ind.pts) || 0; if (v === 1) suma += Number(ind.pts) || 0; }
      }
    }));
    if (!maximo) { r.sinDatos++; continue; }
    const pct = (suma / maximo) * 100;
    if (pct >= 80) r.logrado++; else if (pct >= 60) r.proceso++; else r.apoyo++;
  }
  return r;
}

function estudiantesDelFoco(ev, f) {
  if (!f) return [];
  const lista = [];
  for (let i = 0; i < S.datos.roster.length; i++) {
    if (ev.estado[i]) continue;
    let requiere = false, nivel = "";
    if (esEscala(ev)) {
      const v = nivelDe(ev, i, f.j, f.q);
      if (v) { const ratio = puntosNivel(ev, v) / maxNivel(ev); requiere = ratio < .75; nivel = descriptorDe(ev, ev.criterios[f.j], Math.max(0, v - 1)); }
    } else {
      const v = marcaDe(ev, i, f.j, f.q); requiere = v === 2; nivel = v === 2 ? "No logrado" : v === 1 ? "Logrado" : "";
    }
    if (requiere) lista.push({ i, nombre: S.datos.roster[i] || `Estudiante ${i + 1}`, nivel });
  }
  return lista;
}

function estadisticas(ev) {
  const n = S.datos.roster.length;
  let puntaje = 0, maximo = 0, sinEvaluar = 0, ausentes = 0, evaluados = 0;
  const notas = [];
  const total = puntajeTotal(ev);
  for (let i = 0; i < n; i++) {
    if (ev.estado[i]) { ausentes++; continue; }
    const r = resultado(ev, i);
    puntaje += r.puntaje; maximo += total;
    if (r.sinMarca > 0) sinEvaluar++;
    if (r.marcados > 0 && r.sinMarca === 0) evaluados++;
    if (r.nota !== null) notas.push(r.nota);
  }
  return { puntaje, maximo, sinEvaluar, ausentes, evaluados, presentes: Math.max(0, n - ausentes),
    logro: maximo ? Math.round((puntaje / maximo) * 100) : null,
    prom: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null };
}

  return `<div class="medidor${compacto ? " compacto" : ""}" style="grid-template-columns:repeat(${N},1fr)">
    ${ev.escala.niveles.map((n, k) => {
      const k1 = k + 1, alto = 6 + Math.round((k / Math.max(1, N - 1)) * 12);
      return `<button class="nivel" style="--c:${colorNivel(k1, N)}" data-accion="poner-nivel"
        data-i="${i}" data-j="${j}" data-q="${q}" data-k="${k1}" aria-pressed="${valor === k1}"
        title="${esc(descriptorDe(ev, c, k))} · ${n.p} pt"><span class="barra" style="height:${alto}px"></span>
        <span class="num">${k1}</span></button>`;
    }).join("")}
  </div>${compacto || !valor ? "" : `<p class="sub descriptor-elegido">${esc(descriptorDe(ev, c, valor - 1))}</p>`}`;
}

function leyendaEscala(ev) {
  return ev.escala.niveles.map((n, k) => `${k + 1} ${esc(n.r)} (${n.p} pt)`).join(" · ");
}

function botonAsistencia(ev, i) {
  const e = ev.estado[i] || 0;
  const cls = e === 1 ? "ausente" : e === 2 ? "justificado" : "";
  const txt = e === 1 ? "A" : e === 2 ? "J" : "P";
  const tit = e === 1 ? "Ausente" : e === 2 ? "Ausente justificado" : "Presente";
  return `<button class="asis ${cls}" data-accion="asistencia" data-i="${i}" title="${tit}">${txt}</button>`;
}

/* Busca las remediales del OA de un criterio. */
function remedialesDelOA(codigo) {
  const n = +((codigo || "").match(/OA (\d+)/) || [])[1];
  if (!n) return null;
  const superior = CURRICULO[S.cursoId].oaa === OAA_7_8;
  return REMEDIALES_OA.find((r) => (superior ? r[2] : r[1]).includes(n)) || null;
}

function insigniaCriterio(ev, i, j) {
  const l = logroCriterio(ev, i, j);
  const cls = !l.marcados ? "" : l.puntaje === l.total ? "verde" : l.puntaje === 0 ? "roja" : "media";
  return `<span class="insignia-nivel ${cls}">${l.marcados ? `${l.logrados}/${l.n} · ${l.puntaje} pts` : "sin marcar"}</span>`;
}

/* --- Planilla --- */
function columnasPlanilla(ev) {
  const cols = [];
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => cols.push({ j, q, ind })));
  return cols;
}

function vistaPlanilla(ev) {
  const cols = columnasPlanilla(ev);
  const total = puntajeTotal(ev);
  return `
  <p class="ayuda no-imprimir">${esEscala(ev) ? `Cada indicador se marca con un nivel de la escala: <b>${leyendaEscala(ev)}</b>.
  Toca la celda para avanzar de nivel y sigue tocando para volver a dejarla vacía.` : `Cada indicador tiene dos casillas: <b>L</b> logrado y <b>NL</b> no logrado.
  Toca para marcar y vuelve a tocar la misma casilla para dejarla sin marca. El botón <b>✓✓</b> del encabezado
  marca logrado ese indicador a todo el curso presente, y lo limpia si ya estaban todos. El botón de asistencia
  cicla <b>P → A</b> (ausente) <b>→ J</b> (justificado). El botón <b>✎</b> agrega una observación. Con <b>+</b>
  agregas otro indicador al criterio, y el texto del encabezado se edita tocándolo.`}
  Escala automática al ${exigenciaValida(ev.exigencia)}%: <b>0</b> pts = 2,0 · <b>${ptsAprobacion(total, ev.exigencia).toString().replace(".", ",")}</b> pts = 4,0 · <b>${total}</b> pts = 7,0.</p>
  <div class="envoltura-tabla planilla">
    <table>
      <thead>
        <tr>
          <th class="izq col-fija" rowspan="3">ESTUDIANTE</th>
          <th rowspan="3">ASIS.</th>
          ${ev.criterios.map((c, j) => `<th class="th-grupo" colspan="${c.indicadores.length * (esEscala(ev) ? 1 : 2)}">
            <span class="rot-crit">${esc(c.oa || "Sin OA")}</span> ${esc(recorte(c.objEval || c.texto || "Objetivo sin redactar", 90))}
            <button class="btn-mas" data-accion="agregar-indicador" data-j="${j}" title="Agregar indicador">+</button>
          </th>`).join("")}
          <th rowspan="3">PTS</th><th rowspan="3">NOTA</th><th rowspan="3">OBS</th>
        </tr>
        <tr>
          ${ev.criterios.map((c, j) => c.indicadores.map((ind, q) => `<th ${esEscala(ev) ? "" : `colspan="2"`} class="th-ind">
              <input type="text" data-campo="indicador" data-j="${j}" data-q="${q}" value="${esc(ind.texto)}" placeholder="Indicador ${q + 1}">
              ${esEscala(ev) ? `<span class="pts-pill">1–${nNiveles(ev)}</span>`
                : `<span class="pts-pill">${ind.pts} pts</span>
              <button class="btn-todos" data-accion="todos-marca" data-j="${j}" data-q="${q}" title="Marcar logrado a todo el curso">✓✓</button>`}
            </th>`).join("")).join("")}
        </tr>
        <tr>
          ${cols.map(() => esEscala(ev) ? `<th class="th-lnl">nivel</th>` : `<th class="th-lnl">L</th><th class="th-lnl">NL</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${S.datos.roster.map((nom, i) => {
          const r = resultado(ev, i);
          const est = ev.estado[i] || 0;
          return `<tr class="${est ? "fila-ausente" : ""}" data-fila="${i}">
            <td class="izq col-fija"><span class="n-orden">${String(i + 1).padStart(2, "0")}</span> ${esc(nom || "—")}</td>
            <td>${botonAsistencia(ev, i)}</td>
            ${cols.map((col) => {
              if (esEscala(ev)) {
                if (est) return `<td class="raya">—</td>`;
                const v = nivelDe(ev, i, col.j, col.q);
                return `<td class="celda-tap"><button class="cas nivel-cas"
                  style="${v ? `background:${colorNivel(v, nNiveles(ev))};color:#fff;border-color:transparent` : ""}"
                  data-accion="ciclo-nivel" data-i="${i}" data-j="${col.j}" data-q="${col.q}"
                  title="${v ? esc(descriptorDe(ev, ev.criterios[col.j], v - 1)) : "Sin marca"}">${v || ""}</button></td>`;
              }
              if (est) return `<td class="raya">—</td><td class="raya">—</td>`;
              const v = marcaDe(ev, i, col.j, col.q);
              return `<td class="celda-tap"><button class="cas ${v === 1 ? "si" : ""}" data-accion="marca-l"
                  data-i="${i}" data-j="${col.j}" data-q="${col.q}" aria-pressed="${v === 1}"
                  aria-label="Logrado">${v === 1 ? "✓" : ""}</button></td>
                <td class="celda-tap"><button class="cas no ${v === 2 ? "si" : ""}" data-accion="marca-nl"
                  data-i="${i}" data-j="${col.j}" data-q="${col.q}" aria-pressed="${v === 2}"
                  aria-label="No logrado">${v === 2 ? "✗" : ""}</button></td>`;
            }).join("")}
            <td class="mono" data-cel="pts">${est ? "—" : r.puntaje + "/" + total}</td>
            <td>${est ? "—" : `<span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}" data-cel="nota">${num1(r.nota)}</span>`}</td>
            <td><button class="btn-obs" data-accion="fila-completa" data-i="${i}" title="Marcar todo logrado a este estudiante">✓</button>
              <button class="btn-obs ${ev.obs[i] ? "con-texto" : ""}" data-accion="obs" data-i="${i}" title="Observación">✎</button></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>
  <div class="fila no-imprimir" style="margin-top:10px">
    <button class="btn btn-mini" data-accion="imprimir">Imprimir o guardar PDF</button>
    <button class="btn btn-mini" data-accion="excel">Descargar Excel</button>
  </div>`;
}

/* --- Por criterio --- */
function vistaPorCriterio(ev) {
  const j = Math.min(S.criterioActivo, ev.criterios.length - 1);
  const c = ev.criterios[j];
  return `
  <div class="tarjeta">
    <div class="fila no-imprimir tira-crit" style="gap:5px;margin-bottom:10px;overflow-x:auto">
      ${ev.criterios.map((x, k) => `<button class="chip-crit" data-accion="criterio" data-j="${k}" aria-pressed="${k === j}">${esc(x.oa || "Sin OA")}</button>`).join("")}
    </div>
    <div class="cab-criterio">
      <span class="rotulo-seccion" style="margin:0 0 6px">${c.oa ? esc(c.oa) : "Criterio " + (j + 1)}</span>
      <h2 class="titulo-criterio">${esc(c.objEval || c.texto || "Sin redactar")}</h2>
      ${c.objEval && c.texto ? `<p class="sub" style="margin:5px 0 0">${esc(recorte(c.texto, 110))}</p>` : ""}
      ${c.oa ? `<p class="sub" style="margin:4px 0 0">${esc(EJES[c.eje] || "")}</p>` : ""}
    </div>
    ${esEscala(ev) ? `<p class="sub" style="margin:6px 0 0">${leyendaEscala(ev)}</p>`
      : `<span class="rotulo-seccion">${c.indicadores.length} indicadores · ${c.indicadores.reduce((a, x) => a + (Number(x.pts) || 0), 0)} pts</span>
         <ol class="lista-ind">${c.indicadores.map((ind, q) => `<li><b class="mono">${q + 1}</b>
           <span>${esc(ind.texto || "Indicador sin redactar")}</span>
           <i class="pts-ind">${ind.pts}</i></li>`).join("")}</ol>`}
    <div class="barra-curso no-imprimir">
      <span class="rotulo-seccion" style="margin:0 0 7px">${esEscala(ev) ? "Poner un nivel a todo el curso" : "Marcar logrado a todo el curso"}</span>
      <div class="fila" style="gap:6px">
        ${esEscala(ev)
          ? ev.escala.niveles.map((n, k) => `<button class="btn btn-mini" data-accion="todos-nivel" data-j="${j}" data-k="${k + 1}" title="${esc(n.r)}">${k + 1}</button>`).join("")
          : c.indicadores.map((ind, q) => `<button class="btn btn-mini" data-accion="todos-marca" data-j="${j}" data-q="${q}" title="${esc(ind.texto)}">${q + 1}</button>`).join("")}
        <button class="btn btn-mini" data-accion="limpiar-criterio" data-j="${j}">Limpiar</button>
      </div>
    </div>
    <span class="rotulo-seccion">Estudiantes</span>
    ${S.datos.roster.map((nombre, i) => {
      const r = resultado(ev, i);
      const est = ev.estado[i] || 0;
      return `<div class="alumno">
        <div class="alumno-cab">
          <span class="n-orden">${String(i + 1).padStart(2, "0")}</span>
          <span class="nombre">${esc(nombre || "—")}</span>
          <span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}">${num1(r.nota)}</span>
          ${botonAsistencia(ev, i)}
        </div>
        ${est ? `<p class="ausente-aviso">${est === 1 ? "Ausente" : "Ausente justificado"} · no se promedia</p>`
          : esEscala(ev) ? ev.criterios[j].indicadores.map((ind, q) => `<div class="ind-escala">
              <span>${esc(ind.texto || "Indicador " + (q + 1))}</span>${medidor(ev, i, j, q, true)}</div>`).join("")
          : `<div class="fila" style="gap:9px;align-items:flex-end">
              ${c.indicadores.map((ind, q) => `<div class="indicador-mini"><b class="mono">${q + 1}</b>${parCasillas(ev, i, j, q, true)}</div>`).join("")}
              <span style="margin-left:auto">${insigniaCriterio(ev, i, j)}</span>
            </div>`}
      </div>`;
    }).join("")}
  </div>`;
}

/* --- Por estudiante --- */
function vistaPorAlumno(ev) {
  const i = Math.min(S.alumnoActivo, S.datos.roster.length - 1);
  const r = resultado(ev, i);
  const est = ev.estado[i] || 0;
  return `
  <div class="tarjeta zona-desliz">
    <div class="fila fila-sep no-imprimir" style="margin-bottom:10px">
      <button class="btn btn-mini" data-accion="alumno-mover" data-d="-1" ${i === 0 ? "disabled" : ""}>‹ Anterior</button>
      <select data-accion="elegir-alumno" style="flex:1;min-width:140px">
        ${S.datos.roster.map((n, k) => `<option value="${k}" ${k === i ? "selected" : ""}>${esc(n || "—")}</option>`).join("")}
      </select>
      <button class="btn btn-mini" data-accion="alumno-mover" data-d="1" ${i === S.datos.roster.length - 1 ? "disabled" : ""}>Siguiente ›</button>
    </div>
    <div class="fila fila-sep" style="border-bottom:1px solid var(--line);padding-bottom:10px">
      <div>
        <h2>${esc(S.datos.roster[i] || "—")}</h2>
        <p class="sub" style="margin:2px 0 0">${esEscala(ev) ? `${r.marcados} de ${totalIndicadores(ev)} indicadores evaluados` : `${r.logrados} de ${totalIndicadores(ev)} indicadores logrados`} · ${r.puntaje} de ${r.total} pts${r.sinMarca ? ` · ${r.sinMarca} sin marcar` : ""}</p>
      </div>
      <div class="fila">
        <span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}" style="font-size:17px">${num1(r.nota)}</span>
        ${botonAsistencia(ev, i)}
      </div>
    </div>
    ${est ? `<p class="ausente-aviso">${est === 1 ? "Ausente" : "Ausente justificado"} · no se promedia</p>`
      : ev.criterios.map((c, j) => `
        <div class="criterio-linea">
          <div class="rotulo"><b>${esc(c.oa || "C" + (j + 1))}</b><span>${esc(c.texto || "Criterio " + (j + 1))}</span></div>
          ${esEscala(ev) ? `<div class="indicadores">
            ${c.indicadores.map((ind, q) => `<div class="ind-escala">
              <span>${esc(ind.texto || "Indicador " + (q + 1))}</span>${medidor(ev, i, j, q)}</div>`).join("")}
          </div>
          <div class="fila" style="margin-top:7px">${insigniaCriterio(ev, i, j)}</div>` : `<div class="indicadores">
            <div class="cabecera-lnl"><span>L</span><span>NL</span></div>
            ${c.indicadores.map((ind, q) => `<div class="indicador">${parCasillas(ev, i, j, q)}
              <span>${esc(ind.texto || "Indicador " + (q + 1))}</span>
              <i class="pts-ind">${ind.pts}</i></div>`).join("")}
          </div>
          <div class="fila" style="margin-top:7px">${insigniaCriterio(ev, i, j)}</div>`}
        </div>`).join("")}
    <div style="margin-top:12px">
      <button class="obs-boton" data-accion="obs" data-i="${i}">${ev.obs[i] ? "Ver observación" : "Agregar observación"}</button>
      ${ev.obs[i] ? `<p class="sub" style="margin:2px 0 0">${esc(ev.obs[i])}</p>` : ""}
      ${adeDe(i).length ? `<div class="aviso-dua"><b>Adecuaciones aplicadas</b>
        <ul>${adeDe(i).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      <div class="fila" style="margin-top:8px">
        <button class="btn btn-mini" data-accion="fila-completa" data-i="${i}">Marcar todo logrado</button>
        <button class="btn btn-mini" data-accion="fila-limpia" data-i="${i}">Borrar sus marcas</button>
      </div>
      <div style="margin-top:6px"><button class="obs-boton" data-accion="ficha" data-i="${i}">Ver todas sus observaciones del curso</button></div>
    </div>
  </div>`;
}

/* --- Pestaña Resumen --- */
function vistaResumen() {
  const ev = evalActual();
  const n = S.datos.roster.length;
  if (!n) return `<div class="tarjeta"><div class="vacio">
    <strong>Todavía no hay resumen</strong>
    El resumen se arma con las marcas del curso. Primero carga la nómina y evalúa a tus estudiantes.
    <div style="margin-top:14px"><button class="btn btn-lleno" data-accion="pestana" data-v="curso">Cargar la nómina</button></div>
  </div></div>`;

  const e = estadisticas(ev);
  const notas = [];
  for (let i = 0; i < n; i++) {
    if (ev.estado[i]) continue;
    const r = resultado(ev, i);
    if (r.nota !== null) notas.push(r.nota);
  }
  const aprob = notas.filter((x) => x >= 4).length;

  const logros = [];
  if (esEscala(ev)) {
    ev.criterios.forEach((c, j) => {
      let suma = 0, cont = 0;
      for (let i = 0; i < n; i++) {
        if (ev.estado[i]) continue;
        c.indicadores.forEach((ind, q) => {
          const v = nivelDe(ev, i, j, q);
          if (v) { suma += puntosNivel(ev, v); cont++; }
        });
      }
      logros.push({ rot: c.oa || `C${j + 1}`, texto: c.texto || `Criterio ${j + 1}`,
        pct: cont ? Math.round((suma / (cont * maxNivel(ev))) * 100) : null });
    });
  } else ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    let log = 0, marc = 0;
    for (let i = 0; i < n; i++) {
      if (ev.estado[i]) continue;
      const v = marcaDe(ev, i, j, q);
      if (v === 1) { log++; marc++; } else if (v === 2) marc++;
    }
    logros.push({ rot: `${j + 1}.${q + 1}`, texto: ind.texto || `Indicador ${q + 1}`, pct: marc ? Math.round((log / marc) * 100) : null, log, marc });
  }));

  return `
  <div class="tarjeta">
    <h2>${esc(ev.nombre)}</h2>
    <p class="sub" style="margin:2px 0 12px">${fechaLarga(ev.fecha)} · ${esc((CURSOS.find((c) => c.id === S.cursoId) || {}).nombre)} · ${esEscala(ev) ? "escala de apreciación" : totalIndicadores(ev) + " indicadores"} · ${puntajeTotal(ev)} pts</p>
    <div class="metricas">
      <div class="metrica"><b>${num1(e.prom)}</b><span>PROMEDIO</span></div>
      <div class="metrica"><b>${notas.length ? Math.round((aprob / notas.length) * 100) + "%" : "—"}</b><span>SOBRE 4,0</span></div>
      <div class="metrica"><b>${e.logro === null ? "—" : e.logro + "%"}</b><span>LOGRO DEL CURSO</span></div>
    </div>
    ${e.ausentes ? `<p class="sub" style="margin:10px 0 0">${e.ausentes} estudiante${e.ausentes > 1 ? "s" : ""} sin evaluar por inasistencia.</p>` : ""}
    ${e.sinEvaluar ? `<p class="sub" style="margin:4px 0 0">${e.sinEvaluar} con indicadores sin marcar.</p>` : ""}
  </div>

  <div class="tarjeta">
    <h2>${esEscala(ev) ? "Logro por criterio" : "Logro por indicador"}</h2>
    <p class="sub" style="margin:2px 0 12px">${esEscala(ev) ? "Porcentaje del puntaje posible alcanzado en cada criterio." : "Porcentaje de estudiantes que logró cada indicador, entre quienes ya tienen marca."}</p>
    <div class="logro">
      ${logros.map((l) => `
        <div class="logro-item">
          <div class="rotulo"><span><b class="mono" style="font-size:11px">${l.rot}</b> ${esc(l.texto)}</span><em>${l.pct === null ? "—" : l.pct + "%"}</em></div>
          <div class="pista"><i class="${l.pct === null ? "" : l.pct < 50 ? "critica" : l.pct < 70 ? "baja" : ""}" style="width:${l.pct || 0}%"></i></div>
        </div>`).join("")}
    </div>
  </div>

  ${(() => {
    const bajos = S.datos.roster.map((nom, i) => {
      if (ev.estado[i]) return null;
      const r = resultado(ev, i);
      if (r.nota === null || r.nota >= 4) return null;
      // el criterio con menor logro es donde conviene intervenir
      const flojos = ev.criterios.map((c, j) => {
        const l = logroCriterio(ev, i, j);
        return { j, c, pct: l.total ? Math.round((l.puntaje / l.total) * 100) : null, l };
      }).filter((x) => x.pct !== null).sort((a, b) => a.pct - b.pct);
      return { i, nom, r, flojos };
    }).filter(Boolean);
    if (!bajos.length) return "";
    return `
  <div class="tarjeta">
    <h2>Apoyo sugerido</h2>
    <p class="sub" style="margin:2px 0 12px">${bajos.length} estudiante${bajos.length > 1 ? "s" : ""} bajo 4,0.
      Se propone dónde intervenir según el objetivo con menor logro.</p>
    ${bajos.map(({ i, nom, r, flojos }) => {
      const peor = flojos[0];
      const rem = peor ? remedialesDelOA(peor.c.oa) : null;
      const falla = remedialesPara(ev, i);
      return `<details class="det-apoyo">
        <summary>
          <span><b>${esc(nom || "N° " + (i + 1))}</b> · nota ${num1(r.nota)}</span>
          <em>${peor ? `${esc(peor.c.oa || "Criterio " + (peor.j + 1))} · ${peor.pct}%` : ""}</em>
        </summary>
        ${falla.fallidos.length ? `<p class="rotulo-seccion" style="margin:8px 0 5px">No logró · ${falla.fallidos.length}</p>
          <ul class="lista-rem">${falla.fallidos.slice(0, 6).map((f) => `<li><b class="mono">${f.rot}</b> ${esc(f.texto || "sin redactar")}</li>`).join("")}</ul>` : ""}
        ${(() => {
          const puestas = new Set(medidasDe(i));
          const opcion = (t) => `<button class="rem-item ${puestas.has(t) ? "puesta" : ""}"
            data-accion="marcar-medida" data-i="${i}" data-t="${esc(t)}">
            <i>${puestas.has(t) ? "✓" : "+"}</i><span>${esc(t)}</span></button>`;
          return `
          ${puestas.size ? `<p class="rotulo-seccion" style="margin:12px 0 5px">Medidas tomadas · ${puestas.size}</p>
            <div class="caja-medidas">${medidasDe(i).map((t) => `<button class="rem-item puesta"
              data-accion="marcar-medida" data-i="${i}" data-t="${esc(t)}"><i>✓</i><span>${esc(t)}</span></button>`).join("")}</div>` : ""}
          ${falla.tareas.map((t) => `<p class="rotulo-seccion" style="margin:12px 0 5px">Para ${esc(t.replace(" · pauta formativa", ""))}</p>
            <div class="caja-medidas">${(REMEDIALES_TAREA[t] || []).filter((x) => !puestas.has(x)).map(opcion).join("")}</div>`).join("")}

/* --- Pestaña Consolidado --- */
function datosConsolidado() {
  const evs = S.datos.evaluaciones;
  const filas = S.datos.roster.map((nom, i) => {
    const notas = evs.map((ev) => (ev.estado[i] ? null : resultado(ev, i).nota));
    const val = notas.filter((x) => x !== null);
    let sum = 0, pesos = 0;
    notas.forEach((n, k) => { if (n === null) return; const w = pesoDe(evs[k]); sum += n * w; pesos += w; });
    return { nom, notas, val, prom: pesos > 0 ? sum / pesos : null };
  });
  const proms = filas.map((f) => f.prom).filter((x) => x !== null);
  return {
    evs, filas,
    promCurso: proms.length ? proms.reduce((a, b) => a + b, 0) / proms.length : null,
    aprob: proms.filter((x) => x >= 4).length, conNota: proms.length
  };
}

function fichaDe(i) {
  const evs = S.datos.evaluaciones;
  const items = evs.map((ev) => {
    const est = ev.estado[i] || 0;
    const r = est ? null : resultado(ev, i);
    return { ev, est, nota: r ? r.nota : null, obs: (ev.obs[i] || "").trim() };
  });
  const notas = items.map((x) => x.nota).filter((n) => n !== null);
  let sum = 0, pesos = 0;
  items.forEach((x) => { if (x.nota === null) return; const w = pesoDe(x.ev); sum += x.nota * w; pesos += w; });
  return {
    nombre: S.datos.roster[i] || "—",
    items,
    conObs: items.filter((x) => x.obs).length,
    prom: pesos > 0 ? sum / pesos : null
  };
}

/* Un mismo indicador puede repetirse en varias listas del curso.
   Esto reúne cómo le fue al estudiante cada vez, en orden de fecha. */
function trayectoriaIndicadores(i) {
  const mapa = new Map();
  S.datos.evaluaciones.forEach((ev) => {
    if (ev.estado[i]) return;
    ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
      const clave = (ind.texto || "").trim();
      if (!clave) return;
      let logro = null;
      if (esEscala(ev)) {
        const v = nivelDe(ev, i, j, q);
        if (v) logro = Math.round((puntosNivel(ev, v) / maxNivel(ev)) * 100);
      } else {
        const v = marcaDe(ev, i, j, q);
        if (v) logro = v === 1 ? 100 : 0;
      }
      if (logro === null) return;
      if (!mapa.has(clave)) mapa.set(clave, []);
      mapa.get(clave).push({ fecha: ev.fecha, lista: ev.nombre, logro, oa: c.oa });
    }));
  });
  // solo interesan los que se evaluaron más de una vez
  return [...mapa.entries()]
    .map(([texto, hitos]) => ({ texto, hitos: hitos.sort((a, b) => (a.fecha || "").localeCompare(b.fecha || "")) }))
    .filter((x) => x.hitos.length > 1)
    .map((x) => ({ ...x, avance: x.hitos[x.hitos.length - 1].logro - x.hitos[0].logro }));
}

function fichaHTML(i) {
  const f = fichaDe(i);
  return f.items.map((x) => `

/* =========================================================
   Acciones
   ========================================================= */
document.addEventListener("click", async (evt) => {
  const btn = evt.target.closest("[data-accion]");
  if (!btn) return;
  const a = btn.dataset.accion;
  const ev = evalActual();

  if (a === "cerrar-modal") { if (btn.classList.contains("velo") && evt.target !== btn) return; cerrarModal(); return; }
  if (a === "confirmar-si") { cerrarModal(); if (pendienteConfirmar) pendienteConfirmar(); pendienteConfirmar = null; return; }

  /* --- sesión --- */
  if (a === "entrar") {
    const correo = $("#correo").value.trim(), clave = $("#clave").value;
    if (!sb) { S.errorIngreso = "No hay conexión con el servidor."; pintar(); return; }
    btn.disabled = true; btn.textContent = "Entrando…";
    const { data, error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
    if (error) { S.errorIngreso = "Correo o contraseña incorrectos."; pintar(); return; }
    S.sesion = data.user; S.errorIngreso = ""; await cargarCurso(S.cursoId); return;
  }
  if (a === "sin-cuenta") { S.sinCuenta = true; await cargarCurso(S.cursoId); return; }
  if (a === "salir") {
    confirmar("Vas a cerrar la sesión en este equipo.", async () => {
      if (sb) await sb.auth.signOut();
      S.sesion = null; S.sinCuenta = false; S.datos = null; pintar();
    });
    return;
  }

  /* --- navegación --- */
  if (a === "curso") { S.menuCurso = false; await cargarCurso(btn.dataset.id); return; }
  if (a === "menu-curso") { S.menuCurso = !S.menuCurso; pintar(); return; }
  if (a === "cerrar-menu") { S.menuCurso = false; pintar(); return; }
  if (a === "pestana") { S.pestana = btn.dataset.v; pintar(); return; }
  if (a === "modo") { S.modo = btn.dataset.v; pintar(); return; }
  if (a === "criterio") { S.criterioActivo = +btn.dataset.j; pintar(); return; }
  if (a === "ajustes") { S.ajustes = !S.ajustes; pintar(); return; }
  if (a === "abrir-eval") { S.evalIdx = +btn.dataset.i; S.pestana = "evaluar"; S.criterioActivo = 0; pintar(); return; }
  if (a === "ir-evaluacion") {

                <em class="${x.avance > 0 ? "sube" : x.avance < 0 ? "baja" : ""}">${

      <div class="fila" style="margin-top:10px">

  if (a === "borrar-plantillas") {
    abrirModal(`
      <h3>Plantillas guardadas</h3>
      <p class="sub" style="margin:4px 0 10px">Toca una para eliminarla. Las listas ya creadas no se ven afectadas.</p>
      <div class="caja-oas">${plantillas().map((pl) => `<button class="oa-item" data-accion="quitar-plantilla" data-id="${esc(pl.id)}">
        ${esc(pl.nombre)} <span class="sub">· quitar</span></button>`).join("") || `<p class="sub">No hay plantillas guardadas.</p>`}</div>
      <div class="fila" style="margin-top:10px"><button class="btn btn-ancho" data-accion="cerrar-modal">Cerrar</button></div>`);
    return;
  }
  if (a === "quitar-plantilla") {
    guardarPlantillas(plantillas().filter((x) => x.id !== btn.dataset.id));
    cerrarModal(); pintar(); return;
  }
  if (a === "crear-eval") {
    const nom = $("#ne-nombre").value.trim(), f = $("#ne-fecha").value;

    const nueva = nuevaEvaluacion(S.datos.roster.length, cods, nom, S.cursoId);
    if (f) nueva.fecha = f;
    nueva.ptsDefecto = ev.ptsDefecto;
    S.datos.evaluaciones.push(nueva);
    S.evalIdx = S.datos.evaluaciones.length - 1; S.criterioActivo = 0;
    cerrarModal(); marcarCambio(); pintar(); return;
  }
  if (a === "copiar-a-curso") {
    abrirModal(`
      <h3>Copiar a otro curso</h3>
      <p class="sub" style="margin:4px 0 10px">Se copian los criterios, los indicadores y la escala.
        Las marcas no viajan. Los códigos de OA se traducen al nivel de destino cuando existe el mismo número.</p>
      <div class="rejilla-cursos">${CURSOS.filter((c) => c.id !== S.cursoId).map((c) => `
        <label class="ficha-curso"><input type="checkbox" class="dest-curso" value="${c.id}">
          <span>${esc(c.nombre)}</span></label>`).join("")}</div>
      <div class="fila" style="margin-top:12px">
        <button class="btn btn-lleno" data-accion="copiar-destino">Copiar</button>
        <button class="btn" data-accion="cerrar-modal">Cancelar</button>
      </div>`);
    return;
  }
  if (a === "copiar-destino") {
    const destinos = [...document.querySelectorAll(".dest-curso:checked")].map((x) => x.value);
    if (!destinos.length) return;
    const nombreDestino = destinos.map((d) => CURSOS.find((c) => c.id === d).nombre).join(", ");
    let traducidos = 0, sueltos = 0;
    const tareas = destinos.map((destino) => {
      const copia = JSON.parse(JSON.stringify(ev));
      copia.id = idNuevo(); copia.fecha = hoy();
      copia.criterios.forEach((c) => {
        const eq = c.oa ? buscarOA(destino, c.oa.replace(/^EF\d\d/, CURRICULO[destino].sigla)) : null;
        if (eq) { c.oa = eq.codigo; c.eje = eq.eje; c.texto = eq.texto; traducidos++; }
        else if (c.oa) { c.oa = ""; sueltos++; }
      });
      return copiarListaA(destino, copia);

    Promise.all(tareas).then(() => {
      abrirModal(`
        <h3>Lista copiada a ${esc(nombreDestino)}</h3>
        <p class="sub" style="margin:6px 0 0">${traducidos} objetivo${traducidos === 1 ? "" : "s"} traducido${traducidos === 1 ? "" : "s"} al nivel de destino${
          sueltos ? ` · ${sueltos} sin equivalente, quedaron como criterio propio` : ""}.
          Las marcas no se copian.</p>
        <div class="fila" style="margin-top:12px"><button class="btn btn-lleno" data-accion="cerrar-modal">Entendido</button></div>`);
    }).catch((e) => {
      abrirModal(`<h3>No se pudo copiar</h3><p class="sub" style="margin:6px 0 0">${esc(e.message)}</p>
        <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`);

    cerrarModal();
    return;
  }
  if (a === "duplicar-eval") {
    const copia = JSON.parse(JSON.stringify(ev));
    copia.id = idNuevo(); copia.nombre = ev.nombre + " (copia)"; copia.fecha = hoy();
    copia.marcas = copia.marcas.map((f) => f.map((g) => g.map(() => 0)));
    copia.datos = copia.datos.map(() => copia.criterios.map(filaNiveles));
    copia.estado = copia.estado.map(() => 0);
    copia.obs = copia.obs.map(() => "");
    S.datos.evaluaciones.push(copia);
    S.evalIdx = S.datos.evaluaciones.length - 1;
    marcarCambio(); pintar(); return;
  }
  if (a === "borrar-eval") {
    if (S.datos.evaluaciones.length === 1) {
      confirmar("Es la única lista del curso: se vaciarán sus marcas.", () => {
      anotarDeshacer("Lista vaciada");
        S.datos.evaluaciones = [nuevaEvaluacion(S.datos.roster.length, [], "", S.cursoId)];
        S.evalIdx = 0; marcarCambio(); pintar();
      });
      return;
    }
    confirmar(`Se eliminará "${ev.nombre}" con todas sus marcas.`, () => {
      anotarDeshacer(`Lista eliminada: ${ev.nombre}`);
      S.datos.evaluaciones.splice(S.evalIdx, 1);
      S.evalIdx = Math.max(0, S.evalIdx - 1); marcarCambio(); pintar();
    });
    return;
  }

  /* --- criterios e indicadores --- */
  if (a === "ejemplos-obj") {
    const j = +btn.dataset.j, cur = CURRICULO[S.cursoId];
    const superior = cur.oaa === OAA_7_8;                 // 7° y 8° numeran distinto
    const nOA = ((ev.criterios[j].oa || "").match(/OA (\d+)/) || [])[1];
    const numero = nOA ? +nOA : null;
    const codigo = (k) => `${cur.sigla} OA ${String(k).padStart(2, "0")}`;

  if (a === "informe-comparacion") { cerrarModal(); imprimirComparacion(); return; }
  if (a === "notas-curso") { imprimirNotasCurso(); return; }
  if (a === "comparar-cursos") { compararEntreCursos(); return; }
  if (a === "excel") { await exportarExcel(); return; }
  if (a === "cambiar-logo") { pedirLogo(); return; }
  if (a === "quitar-logo") { localStorage.removeItem(CLAVE_LOGO); pintar(); return; }
  if (a === "conflicto-traer") {
    const c = btn.dataset.c;
    cerrarModal(); marcarSubido(c);
    S.guardado = "ok";
    await cargarCurso(c);
    return;
  }
  if (a === "conflicto-respaldo") { descargarRespaldo(); return; }
  if (a === "conflicto-forzar") {
    const c = btn.dataset.c;
    cerrarModal();
    try {
      await almacen.escribir(c, c === S.cursoId ? S.datos : almacen.leerLocal(c), true);
      marcarSubido(c); S.guardado = "ok";
    } catch (e) { S.guardado = "error"; S.detalleError = e.message; }
    pintar();
    return;
  }
  if (a === "deshacer") { aplicarDeshacer(); return; }
  if (a === "reintentar") { reintentarPendientes(); return; }
  if (a === "respaldo") { descargarRespaldo(); return; }
  if (a === "respaldo-todo") { descargarRespaldoTotal(); return; }
  if (a === "restaurar") { pedirRestaurar(); return; }
});

document.addEventListener("input", (evt) => {
  const el = evt.target.closest("[data-campo]");
  if (!el || !S.datos) return;
  const ev = evalActual();
  const campo = el.dataset.campo;
  if (campo === "nombre") ev.nombre = el.value;
  else if (campo === "fecha") ev.fecha = el.value;
  else if (campo === "oa") ev.oa = el.value;
  else if (campo === "ptsDefecto") ev.ptsDefecto = Math.min(20, Math.max(1, +el.value || 1));
  else if (campo === "criterio") ev.criterios[+el.dataset.j].texto = el.value;
  else if (campo === "indicador") ev.criterios[+el.dataset.j].indicadores[+el.dataset.q].texto = el.value;
  else if (campo === "nivel-r") ev.escala.niveles[+el.dataset.k].r = el.value;
  else if (campo === "nivel-p") ev.escala.niveles[+el.dataset.k].p = Math.max(0, +el.value || 0);
  else if (campo === "pts") ev.criterios[+el.dataset.j].indicadores[+el.dataset.q].pts = Math.max(0, +el.value || 0);
  else if (campo === "alumno") S.datos.roster[+el.dataset.i] = el.value;
  else if (campo === "docente") { localStorage.setItem(CLAVE_DOCENTE, el.value); return; }
  else if (campo === "colegio") { try { localStorage.setItem(CLAVE_COLEGIO, el.value); } catch {} return; }
  else if (campo === "objeval") {
    ev.criterios[+el.dataset.j].objEval = el.value;
    ajustarAlto(el);
    marcarCambio(); return;
  }
  else if (campo === "exigencia") { ev.exigencia = Math.min(100, Math.max(10, +el.value || EXIGENCIA)); marcarCambio(); pintar(); return; }
  else if (campo === "peso") { ev.peso = Math.min(10, Math.max(0, +el.value || 0)); marcarCambio(); pintar(); return; }
  else if (campo === "descriptor") {
    const c = ev.criterios[+el.dataset.j];
    c.descriptores = c.descriptores || [];
    c.descriptores[+el.dataset.k] = el.value;
    marcarCambio(); return;
  }
  else return;
  marcarCambio();
});

document.addEventListener("change", (evt) => {
  const el = evt.target.closest("[data-accion]");
  if (el) {
    const a = el.dataset.accion;
    if (a === "elegir-alumno") { S.alumnoActivo = +el.value; pintar(); }
    else if (a === "elegir-unidad") {
      const u = unidadesDelCurso(S.cursoId)[+el.value];
      if (u) aplicarUnidad(evalActual(), u, []);
    }
    else if (a === "cambiar-oa") {
      const ev = evalActual(), j = +el.dataset.j, c = ev.criterios[j];
      if (!el.value) { c.oa = ""; c.eje = ""; marcarCambio(); pintar(); return; }
      const nuevo = criterioDesdeOA(el.value, S.cursoId, c.indicadores.length);
      c.oa = nuevo.oa; c.eje = nuevo.eje;
      if (!c.texto.trim() || esTextoDeOA(c.texto, S.cursoId)) c.texto = nuevo.texto;
      c.indicadores.forEach((ind, q) => { if (!ind.texto.trim()) ind.texto = nuevo.indicadores[q] ? nuevo.indicadores[q].texto : ""; });
      marcarCambio(); pintar(); return;
    }
    else if (a === "tema") {
      localStorage.setItem(CLAVE_TEMA, el.value); aplicarTema(); pintar(); return;
    }
    else if (a === "ade-lista") {
      const ev = evalActual();
      ev.adeModo = el.value;
      if (el.value === "propias" && !ev.ade) ev.ade = S.datos.roster.map((_, i) => adeCurso(i).slice());
      marcarCambio(); pintar(); return;
    }
    else if (a === "tipo-eval") {
      evalActual().tipo = el.value; marcarCambio(); pintar(); return;
    }
    else if (a === "elegir-oa" && el.value) {
      const ev = evalActual();
      ev.criterios.push(criterioDesdeOA(el.value, S.cursoId, 3));
      ev.marcas.forEach((f) => f.push([0, 0, 0]));

});

/* =========================================================
   Salidas: impresión, Excel, respaldo
   ========================================================= */
/* El PDF se adapta: pocas columnas van en vertical y con letra grande;
   muchas, en horizontal y más apretadas. */

/* La planilla se parte en bloques que siempre caben en el ancho de la hoja.
   Las columnas de marca no llevan ancho: el reparto lo hace la tabla. */
function planImpresion(nMarcas) {
  const n = Math.max(0, nMarcas);
  const orientacion = n <= 8 ? "portrait" : "landscape";
  // Mientras más indicadores, más recuadros por fila y letra más chica:
  // así la leyenda no se come la hoja y cada recuadro crece hacia abajo.
  const cajas = n <= 6 ? 2 : n <= 12 ? 3 : n <= 20 ? 4 : 5;
  const fuenteLey = n <= 6 ? 9.5 : n <= 12 ? 8.5 : n <= 20 ? 7.5 : 7;
  return { orientacion, fuente: n <= 14 ? 9 : 8, cajas: orientacion === "landscape" ? cajas + 1 : cajas,
    fuenteLey };
}

/* Toma una imagen del equipo, la cuadra y la guarda como escudo.
   Se guarda en PNG para conservar la transparencia si la trae. */
function pedirLogo() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const lado = 160;
        const c = document.createElement("canvas");
        c.width = lado; c.height = lado;
        const g = c.getContext("2d");
        const escala = Math.min(lado / img.width, lado / img.height);
        const w = img.width * escala, h = img.height * escala;
        g.drawImage(img, (lado - w) / 2, (lado - h) / 2, w, h);
        try { localStorage.setItem(CLAVE_LOGO, c.toDataURL("image/png")); } catch {}
        pintar();
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(f);
  };
  inp.click();
}

/* Membrete con el escudo, para encabezar cada documento impreso. */
function membreteHTML() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  return `<div class="membrete"><img src="${logoColegio()}" alt="">
    <span class="txt"><b>${esc(colegio())}</b>
    <span>Educación Física y Salud · ${esc(curso.nombre)}</span></span></div>`;
}

/* Los informes son de texto, no de casillas: van en vertical, con anchos
   fijos para que ninguna columna empuje la tabla fuera de la hoja. */
function hojaInforme(nFilas) {
  // Con cursos grandes se aprieta la letra para que quepan en una hoja;
  // con pocos estudiantes se agranda, para no dejar la hoja despoblada.
  const n = nFilas || S.datos.roster.length || 0;
  const fuente = n <= 12 ? 11 : n <= 20 ? 10 : n <= 28 ? 9 : n <= 36 ? 8 : 7.5;
  const alto = n <= 12 ? 4 : n <= 20 ? 3 : n <= 28 ? 2 : 1.5;
  const css = `
    @page{size:A4 portrait; margin:10mm}
    .hoja-impresion table{width:100%; table-layout:fixed; font-size:${fuente}px}
    .hoja-impresion td{padding-top:${alto}px; padding-bottom:${alto}px}
    .hoja-impresion th,.hoja-impresion td{overflow-wrap:anywhere; word-break:break-word}
    .hoja-impresion .c-n{width:7mm}
    .hoja-impresion .c-nom{width:34mm}
    .hoja-impresion .c-pct{width:12mm}
    .hoja-impresion .c-pts{width:14mm}
    .hoja-impresion .c-nota{width:12mm}
    .hoja-impresion .c-asis{width:14mm}
    .hoja-impresion .col-barra{width:22mm}
    .hoja-impresion .col-barra-ancha{width:56mm}
    .leyenda-oa{font-size:9px}`;
  let tag = $("#css-informe");
  if (!tag) {
    tag = document.createElement("style");
    tag.id = "css-informe"; tag.media = "print";
    document.head.appendChild(tag);
  }
  tag.textContent = css;
}

/* Se retira al imprimir cualquier otra cosa. */
function quitarHojaInforme() {
  const tag = $("#css-informe");
  if (tag) tag.textContent = "";
}

function prepararImpresion(nMarcas) {
  quitarHojaInforme();
  const { orientacion, fuente, cajas, fuenteLey } = planImpresion(nMarcas);
  const css = `
    @page{size:A4 ${orientacion}; margin:9mm}
    .hoja-impresion table{font-size:${fuente}px}
    .leyenda-oa{font-size:${fuenteLey}px}
    .leyenda-oa .rejilla-ind{grid-template-columns:repeat(${cajas}, 1fr)}
    .leyenda-oa .oa-titulo{margin-top:${fuenteLey < 8 ? 4 : 7}px}`;
  let tag = $("#css-impresion");
  if (!tag) {
    tag = document.createElement("style");
    tag.id = "css-impresion";
    tag.media = "print";
    document.head.appendChild(tag);
  }
  tag.textContent = css;
}

function claseCol(k, n) {
  if (k === 0) return "c-n";
  if (k === 1) return "c-nom izq";
  if (k === 2) return "c-asis";
  if (k === n - 1) return "c-obs izq";
  if (k === n - 2) return "c-nota";
  if (k === n - 3) return "c-pct";
  if (k === n - 4) return "c-pts";
  return "c-marca";
}

function filasDeEvaluacion(ev) {
  const cols = columnasPlanilla(ev);
  const total = puntajeTotal(ev);
  const cab = ["N°", "Estudiante", "Adecuaciones", "Asis.",
    ...cols.map((c) => (c.ind && c.ind.texto.trim()) || `${c.j + 1}.${c.q + 1}`),
    "Puntaje", "% logro", "Nota", "Observación", "Medidas remediales"];
  const filas = S.datos.roster.map((n, i) => {
    const r = resultado(ev, i);
    const est = ev.estado[i] || 0;
    return [
      i + 1, n || "", adeDe(i).join("; "), est === 1 ? "A" : est === 2 ? "J" : "P",
      ...cols.map((c) => {
        if (est) return "";
        if (esEscala(ev)) return nivelDe(ev, i, c.j, c.q) || "";
        const v = marcaDe(ev, i, c.j, c.q);
        return v === 1 ? "L" : v === 2 ? "NL" : "";
      }),
      est ? "" : `${r.puntaje}/${total}`,
      est || !total ? "" : Math.round((r.puntaje / total) * 100) + "%",
      est ? "" : (r.nota === null ? "" : num1(r.nota)),
      ev.obs[i] || "",
      (ev.medidas && ev.medidas[i] ? ev.medidas[i] : []).join("; ")
    ];
  });
  return { cab, filas, total, cols };
}

/* Informe de logro: qué indicadores costaron al curso y cómo le fue a cada estudiante. */
/* ---- Comparar la misma unidad entre cursos ----
   Busca en los ocho cursos las listas de nombre parecido y reúne su logro. */
async function compararEntreCursos() {
  const ev = evalActual();
  const clave = (t) => (t || "").toLowerCase().replace(/[^a-záéíóúñ0-9 ]/gi, " ").replace(/\s+/g, " ").trim();
  const buscada = clave(ev.nombre);
  const hallados = [];
  for (const c of CURSOS) {
    let datos;
    if (c.id === S.cursoId) datos = S.datos;
    else { try { datos = await almacen.leer(c.id); } catch { datos = almacen.leerLocal(c.id); } }
    if (!datos) continue;
    datos.evaluaciones.forEach((e) => {
      const k = clave(e.nombre);
      if (!k || (k !== buscada && !k.includes(buscada) && !buscada.includes(k))) return;
      const n = datos.roster.length;
      let suma = 0, cont = 0, notas = [];
      for (let i = 0; i < n; i++) {
        if (e.estado[i]) continue;
        const r = resultado(e, i);
        if (r.total && r.marcados) { suma += r.puntaje / r.total; cont++; }
        if (r.nota !== null) notas.push(r.nota);
      }
      hallados.push({
        curso: c, lista: e, roster: datos.roster, evaluados: cont,
        pct: cont ? Math.round((suma / cont) * 100) : null,
        prom: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null,
        bajo4: notas.filter((x) => x < 4).length
      });
    });
  }
  if (hallados.length < 2) {
    abrirModal(`<h3>Sin comparación posible</h3>
      <p class="sub" style="margin:6px 0 0">No se encontraron listas con un nombre parecido a
        <b>${esc(ev.nombre)}</b> en otros cursos. Para comparar, la lista debe llamarse igual en cada curso;
        el botón <b>Copiar a otro curso</b> conserva el nombre.</p>
      <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`);
    return;
  }
  const mejor = Math.max(...hallados.map((x) => x.pct === null ? -1 : x.pct));
  abrirModal(`
    <h3>${esc(ev.nombre)} en ${hallados.length} cursos</h3>
    <p class="sub" style="margin:4px 0 12px">Logro promedio de cada curso en esta misma lista.</p>
    ${hallados.sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1)).map((x) => `
      <div class="logro-item">
        <div class="rotulo">
          <span><b>${esc(x.curso.nombre)}</b>${x.curso.id === S.cursoId ? " · este curso" : ""}</span>
          <em>${x.pct === null ? "—" : x.pct + "%"}${x.pct === mejor && x.pct !== null ? " ★" : ""}</em>
        </div>
        <div class="pista"><i class="${x.pct === null ? "" : x.pct < 50 ? "critica" : x.pct < 70 ? "baja" : ""}"
          style="width:${x.pct || 0}%"></i></div>
        <p class="detalle-logro">${x.evaluados} evaluados · promedio ${num1(x.prom)}${
          x.bajo4 ? ` · ${x.bajo4} bajo 4,0` : ""} · ${fechaLarga(x.lista.fecha)}</p>
      </div>`).join("")}
    <div class="fila" style="margin-top:10px">
      <button class="btn btn-lleno" data-accion="informe-comparacion">Informe en PDF</button>
      <button class="btn" data-accion="cerrar-modal">Cerrar</button>
    </div>`);
  S.comparacion = { nombre: ev.nombre, hallados };
}

/* Informe impreso de la comparación entre cursos: qué curso logró más
   y en qué indicadores se separaron. */
function imprimirComparacion() {
  const c = S.comparacion;
  if (!c || !c.hallados || c.hallados.length < 2) return;
  prepararImpresion(0);
  const orden = [...c.hallados].sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
  const mejor = orden[0], peor = orden[orden.length - 1];

  // logro de cada indicador, curso por curso, usando la lista con más indicadores
  const base = orden.reduce((a, b) =>
    totalIndicadores(b.lista) > totalIndicadores(a.lista) ? b : a, orden[0]).lista;
  const filasInd = [];
  base.criterios.forEach((cr, j) => cr.indicadores.forEach((ind, q) => {
    const porCurso = orden.map((x) => {
      const c2 = x.lista.criterios[j];
      if (!c2 || !c2.indicadores[q]) return null;
      let suma = 0, cont = 0;
      x.roster.forEach((_, i) => {
        if (x.lista.estado[i]) return;
        if (esEscala(x.lista)) {
          const v = (x.lista.datos[i] || [])[j];
          const nv = Array.isArray(v) ? v[q] : 0;
          if (nv) { suma += puntosNivel(x.lista, nv) / maxNivel(x.lista); cont++; }
        } else {
          const v = ((x.lista.marcas[i] || [])[j] || [])[q];
          if (v) { suma += v === 1 ? 1 : 0; cont++; }
        }
      });
      return cont ? Math.round((suma / cont) * 100) : null;
    });
    const validos = porCurso.filter((x) => x !== null);
    filasInd.push({ rot: `${j + 1}.${q + 1}`, texto: ind.texto, porCurso,
      brecha: validos.length > 1 ? Math.max(...validos) - Math.min(...validos) : null });
  }));
  const mayorBrecha = filasInd.filter((f) => f.brecha !== null).sort((a, b) => b.brecha - a.brecha)[0];
  hojaInforme(filasInd.length + orden.length);

  $("#impresion").innerHTML = `
    ${membreteHTML()}
    <h1 class="titulo-hoja">Comparación entre cursos · ${esc(c.nombre)}</h1>
    <table class="ficha-hoja"><tbody>
      <tr><th>Cursos comparados</th><td>${orden.length}</td>
          <th>Mayor logro</th><td>${esc(mejor.curso.nombre)} · ${mejor.pct}%</td>
          <th>Menor logro</th><td>${esc(peor.curso.nombre)} · ${peor.pct === null ? "—" : peor.pct + "%"}</td></tr>
      <tr><th>Fecha del informe</th><td>${fechaLarga(hoy())}</td>
          <th>Diferencia</th><td>${mejor.pct !== null && peor.pct !== null ? (mejor.pct - peor.pct) + " puntos" : "—"}</td>
          <th>Asignatura</th><td>Educación Física y Salud</td></tr>
    </tbody></table>

    <p class="rot-informe">Logro por curso</p>
    <table><thead><tr><th class="c-n">N°</th><th class="c-nom izq">Curso</th>
      <th class="col-barra">Logro</th><th class="c-pct">%</th><th class="c-nota">Prom.</th>
      <th class="c-asis">Evaluados</th><th class="c-asis">Bajo 4,0</th><th class="izq">Fecha</th></tr></thead>
    <tbody>${orden.map((x, k) => `<tr>
      <td class="c-n">${k + 1}</td>
      <td class="c-nom izq">${esc(x.curso.nombre)}${x.curso.id === S.cursoId ? " ·" : ""}</td>
      <td><span class="barra-pdf"><i style="width:${x.pct || 0}%;
        background:${x.pct === null ? "#d5e2ea" : x.pct < 50 ? "#b8392e" : x.pct < 70 ? "#d99a10" : "#1e8a5f"}"></i></span></td>
      <td class="c-pct">${x.pct === null ? "—" : x.pct + "%"}</td>
      <td class="c-nota">${num1(x.prom)}</td>
      <td class="c-asis">${x.evaluados}</td>
      <td class="c-asis">${x.bajo4 || ""}</td>
      <td class="izq">${fechaLarga(x.lista.fecha)}</td></tr>`).join("")}</tbody></table>
    <p class="nota-med">El curso marcado con · es desde el que se generó este informe.</p>

    <p class="rot-informe">Logro por indicador en cada curso</p>
    <table><thead><tr><th class="c-n">N°</th><th class="izq">Indicador</th>
      ${orden.map((x) => `<th class="c-pct">${esc(x.curso.label)}</th>`).join("")}
      <th class="c-pct">Brecha</th></tr></thead>
    <tbody>${filasInd.map((f) => `<tr>
      <td class="c-n mono">${f.rot}</td>
      <td class="izq">${esc(f.texto || "sin redactar")}</td>
      ${f.porCurso.map((v) => `<td class="c-pct">${v === null ? "—" : v + "%"}</td>`).join("")}
      <td class="c-pct">${f.brecha === null ? "—" : f.brecha}</td></tr>`).join("")}</tbody></table>
    ${mayorBrecha && mayorBrecha.brecha >= 20 ? `<p class="nota-dua"><b>Mayor diferencia entre cursos:</b>
      indicador ${mayorBrecha.rot} · ${esc(mayorBrecha.texto || "")} · ${mayorBrecha.brecha} puntos de diferencia.
      Conviene revisar cómo se trabajó en cada curso.</p>` : ""}`;
  setTimeout(() => window.print(), 60);
}

function imprimirInforme() {
