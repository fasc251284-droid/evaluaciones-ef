<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluaciones EF y Salud</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Evaluaciones EF">
<meta name="theme-color" content="#2b8fc7">
<style>
:root{
  --bg:#f5f9fb; --surface:#fff; --surface-2:#eef5f9;
  --ink:#14303d; --soft:#5a7382; --line:#d7e3ea;
  --verde:#2b8fc7; --verde-oscuro:#1f6d99; --verde-claro:#e3f1fa;
  --n1:#c0392b; --n2:#e0a50f; --n3:#7fa83f; --n4:#2e9e6b;
  --alerta:#c0392b;
  --r:12px; --r-s:8px;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:var(--display); font-weight:700; letter-spacing:-.015em; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.oculto{display:none !important}

/* ---------- Estructura ---------- */
.envoltura{max-width:900px; margin:0 auto; padding:0 14px 120px}
.barra-sup{
  position:sticky; top:0; z-index:30; color:#fff;
  background:linear-gradient(180deg,#3aa0d6,#1f6d99);
  border-bottom:4px solid #f0a500;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
}
.barra-sup .interior{max-width:900px; margin:0 auto; display:flex; align-items:center; gap:10px}
.marca{font-family:var(--display); font-size:15px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.marca small{display:block; font-family:var(--body); font-weight:400; font-size:11px; opacity:.75; letter-spacing:.04em; text-transform:uppercase}
.estado{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:11.5px; opacity:.9}
.punto{width:8px; height:8px; border-radius:50%; background:#9FD8BE}
.punto.trabajando{background:#F3D26A; animation:latido 1s infinite}
.punto.error{background:#F2A099}
@keyframes latido{50%{opacity:.35}}
.btn-salir{background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:8px; padding:5px 9px; font-size:12px}

/* ---------- Cursos ---------- */
.cursos{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:12px 0 4px}
.curso{
  padding:8px 4px; border-radius:var(--r-s); border:1px solid var(--line);
  background:var(--surface); color:var(--verde); text-align:center; line-height:1.1;
}
.curso b{display:block; font-size:17px; font-weight:700}
.curso small{display:block; font-size:8.5px; letter-spacing:.09em; color:var(--soft); margin-top:2px}
.curso[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff; box-shadow:inset 0 -3px 0 #f0a500}
.curso[aria-pressed="true"] small{color:rgba(255,255,255,.82)}
/* fila de criterios en la vista por criterio */
.chip-crit{flex:0 0 auto; min-width:44px; padding:8px 10px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface); color:var(--soft); font-weight:600}
.chip-crit[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff}

/* ---------- Pestañas ---------- */
.pestanas{display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s); padding:3px; margin:10px 0 14px}
.pestana{flex:1; border:0; background:transparent; border-radius:7px; padding:8px 4px; font-size:13.5px; font-weight:500; color:var(--soft)}
.pestana[aria-pressed="true"]{background:var(--verde-claro); color:var(--verde-oscuro); font-weight:600}

/* ---------- Tarjetas ---------- */
.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:12px}
.tarjeta > h2{font-size:16px; margin-bottom:2px}
.sub{color:var(--soft); font-size:12.5px}
.fila{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.fila-sep{justify-content:space-between}
.pasos{margin:0; padding-left:20px}
.pasos li{margin-bottom:9px; line-height:1.45; font-size:14px}
.pasos li:last-child{margin-bottom:0}
.caja-oa-lista{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  padding:9px 10px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface)}
.rotulo-seccion{display:block; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--soft); margin:16px 0 7px}
.bloque-seccion{border-top:1px solid var(--line); margin-top:14px; padding-top:2px}
.fila-peligro{border-top:1px solid var(--line); margin-top:14px; padding-top:11px}
.campo{display:block; margin-bottom:10px}
.campo span{display:block; font-size:12px; font-weight:600; color:var(--soft); margin-bottom:4px; letter-spacing:.01em}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s);
  padding:10px 11px; font-size:15px; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--verde); box-shadow:0 0 0 3px var(--verde-claro)}
textarea{resize:vertical; min-height:76px}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r-s);
  padding:9px 13px; font-size:14px; font-weight:500;
}
.btn:active{transform:translateY(1px)}
.btn-lleno{background:var(--verde); border-color:var(--verde); color:#fff; font-weight:600}
.btn-peligro{color:var(--alerta); border-color:#E7C4C0}
.btn-mini{padding:6px 9px; font-size:12.5px; border-radius:7px}
.btn-ancho{width:100%; justify-content:center}

/* ---------- Medidor de niveles (elemento distintivo) ---------- */
.medidor{display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.nivel{
  position:relative; border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  padding:7px 0 5px; display:flex; flex-direction:column; align-items:center; gap:4px; min-height:46px;
  transition:background .12s, border-color .12s;
}
.nivel .barra{width:14px; border-radius:2px 2px 0 0; background:var(--line)}
.nivel .num{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--soft); line-height:1}
.nivel[aria-pressed="true"]{background:var(--c,var(--verde)); border-color:transparent}
.nivel[aria-pressed="true"] .num{color:#fff}
.nivel[aria-pressed="true"] .barra{background:rgba(255,255,255,.92)}
.medidor .nivel:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- Filas de estudiantes ---------- */
.alumno{border-top:1px solid var(--line); padding:11px 0}
.alumno:first-of-type{border-top:0}
.alumno-cab{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.n-orden{font-family:var(--mono); font-size:11px; color:var(--soft); min-width:20px}
.nombre{font-weight:500; font-size:14.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nota{font-family:var(--mono); font-weight:600; font-size:14px; padding:2px 7px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line)}
.nota.roja{color:var(--n1); border-color:#EBC9C5; background:#FCF2F1}
.nota.azul{color:var(--verde); border-color:#BEDFCE; background:var(--verde-claro)}
.marca-est{border:1px solid var(--line); background:var(--surface); border-radius:7px; width:30px; height:30px; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--soft)}
.marca-est.activa{background:var(--ink); border-color:var(--ink); color:#fff}
.ausente-aviso{font-size:12px; color:var(--soft); font-style:italic; padding:4px 0}
.criterio-linea{margin:9px 0 0}
.criterio-linea .rotulo{font-size:12.5px; color:var(--soft); margin-bottom:5px; display:flex; gap:6px}
.criterio-linea .rotulo b{font-family:var(--mono); font-weight:600; color:var(--ink); font-size:11.5px}
.obs-boton{background:none; border:0; padding:4px 0; font-size:12.5px; color:var(--verde); text-decoration:underline; text-underline-offset:2px}

/* ---------- Tabla ---------- */
.envoltura-tabla{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center; white-space:nowrap}
th{background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--soft); text-transform:uppercase; letter-spacing:.03em}
td.izq,th.izq{text-align:left}
.col-fija{position:sticky; left:0; background:var(--surface); z-index:2; box-shadow:1px 0 0 var(--line)}
th.col-fija{background:var(--surface-2); z-index:3}
.celda-n{font-family:var(--mono); font-weight:600}
.celda-n[data-v="1"]{color:var(--n1)} .celda-n[data-v="2"]{color:var(--n2)}
.celda-n[data-v="3"]{color:var(--n3)} .celda-n[data-v="4"]{color:var(--n4)}
.celda-n[data-v="0"]{color:var(--line)}

/* ---------- Resumen ---------- */
.metricas{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.metrica{background:var(--surface-2); border-radius:var(--r-s); padding:10px; text-align:center}
.metrica b{display:block; font-family:var(--mono); font-size:20px; font-weight:600}
.metrica span{font-size:11px; color:var(--soft); letter-spacing:.02em}
.logro{margin-top:12px}
.logro-item{margin-bottom:11px}
.logro-item .rotulo{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:4px}
.logro-item .rotulo em{font-family:var(--mono); font-style:normal; font-weight:600}
.pista{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.pista i{display:block; height:100%; border-radius:4px; background:var(--verde)}
.pista i.baja{background:var(--n2)} .pista i.critica{background:var(--n1)}

/* ---------- Criterios (editor) ---------- */
.criterio-edit{display:flex; gap:7px; align-items:flex-start; margin-bottom:7px}
.criterio-edit .idx{font-family:var(--mono); font-size:11px; color:var(--soft); padding-top:12px; min-width:18px}

/* ---------- Casillas de verificación ---------- */
.cas{
  width:30px; height:30px; flex:0 0 30px; border-radius:7px; border:1.5px solid #b9cfdc;
  background:var(--surface); font-size:15px; font-weight:700; color:#fff;
  display:inline-flex; align-items:center; justify-content:center; line-height:1;
}
.cas.si{background:var(--verde); border-color:var(--verde); box-shadow:0 1px 2px rgba(20,48,61,.18)}
.cas.no.si{background:var(--n1); border-color:var(--n1)}
.cas.nivel-cas{font-family:var(--mono); font-size:13px; color:var(--soft)}
.cas:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.descriptor-elegido{margin:5px 0 0; font-style:italic}
.det-desc{margin-top:8px}
.det-desc summary{font-size:12.5px; color:var(--verde-oscuro); cursor:pointer; padding:3px 0; list-style:none}
.det-desc summary::-webkit-details-marker{display:none}
.det-desc summary::before{content:"▸ "}
.det-desc[open] summary::before{content:"▾ "}
.ind-escala{display:flex; flex-direction:column; gap:5px; margin-bottom:11px; font-size:13.5px; line-height:1.3}
.ind-escala > span{font-weight:500}
.cabecera-lnl{display:flex; gap:5px; margin-bottom:-3px}
.cabecera-lnl span{width:30px; flex:0 0 30px; text-align:center; font-size:11px; font-weight:700;
  letter-spacing:.04em; color:var(--soft)}
.par-cas{display:inline-flex; gap:5px}
.par-cas.compacto .cas{width:26px; height:26px; flex:0 0 26px; font-size:13px}
.indicadores{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.indicador{display:flex; gap:10px; align-items:center; font-size:13.5px; line-height:1.3}
.indicador-mini{display:flex; flex-direction:column; align-items:center; gap:3px}
.indicador-mini b{font-size:10.5px; color:var(--soft)}
.insignia-nivel{
  font-family:var(--mono); font-size:11.5px; padding:4px 8px; border-radius:6px;
  border:1px solid var(--line); color:var(--soft); background:var(--surface-2); white-space:nowrap;
}
.insignia-nivel.verde{background:#e6f5ee; border-color:#b9e0cd; color:#1c7a55}
.insignia-nivel.media{background:#fdf3e0; border-color:#f0d9a8; color:#8a6300}
.insignia-nivel.roja{background:#fbeeec; border-color:#eecac5; color:#a33327}
.pts-pill{
  display:inline-block; font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:999px;
  background:rgba(255,255,255,.22); color:#fff; margin-top:3px;
}
.pts-pill.oscuro{background:var(--surface-2); color:var(--soft); border:1px solid var(--line)}
.planilla .th-ind .pts-pill{display:block; width:fit-content; margin:4px auto 0}
.lista-ind{margin:8px 0 0; padding:0; list-style:none; font-size:13px; color:var(--soft)}
.lista-ind li{margin:3px 0; display:flex; gap:8px; align-items:baseline}
.lista-ind b{color:var(--ink); font-size:11.5px}
.bloque-criterio{border:1px solid var(--line); border-radius:var(--r-s); padding:9px; margin-bottom:9px; background:var(--surface-2)}
.bloque-criterio textarea,.bloque-criterio input{background:var(--surface)}
.par-mapa{display:flex; align-items:center; gap:4px}
/* ---------- Currículum ---------- */
.oa-chip{
  display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
  background:var(--verde-claro); color:var(--verde-oscuro); border:1px solid #bcdcee;
  border-radius:5px; padding:2px 6px; white-space:nowrap;
}
.caja-oas{max-height:46vh; overflow:auto; border:1px solid var(--line); border-radius:var(--r-s); padding:10px; background:var(--surface-2)}
.eje-tit{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--verde-oscuro); margin:10px 0 6px}
.eje-tit:first-child{margin-top:0}
.oa-item{
  display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:8px 9px; margin-bottom:6px; font-size:12.5px; line-height:1.35;
}
.oa-item input{width:auto; flex:0 0 auto; margin-top:2px}
.oa-item b{color:var(--verde-oscuro)}
.caja-escala{border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface-2); padding:10px; margin:0 0 14px}
.rejilla-escala{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; max-height:46vh; overflow:auto}
.par-nota{
  display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 4px;
  border:1px solid var(--line); border-radius:7px; background:var(--surface);
}
.par-nota b{font-size:11px; color:var(--soft); font-weight:600}
.par-nota i{font-style:normal; font-size:14px; font-weight:600; color:var(--verde)}
.par-nota.roja i{color:var(--n1)}
.bloque-unidad{border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface); padding:10px; margin-bottom:10px}
.titulo-unidad{font-weight:600; font-size:14px; margin:0; color:var(--verde-oscuro); line-height:1.3}
.fuente{font-size:10.5px; color:var(--soft); margin:12px 0 0; line-height:1.4}
.par-mapa select{padding:4px 6px; font-size:13px; width:auto}

/* ---------- Cabecera de la evaluación ---------- */
.titulo-curso{font-size:21px; color:var(--verde); letter-spacing:-.02em}
.pastilla{
  display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--soft);
  border:1px solid var(--line); border-radius:999px; padding:5px 11px; background:var(--surface);
  white-space:nowrap;
}
.pastilla b{color:var(--verde); font-weight:700}
.pastillas{margin-top:11px; gap:7px}
.titulo-eval{font-size:16px; color:var(--verde-oscuro)}
.tiras{display:flex; gap:7px; overflow-x:auto; margin-top:12px; padding:9px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface-2); scrollbar-width:none}
.tiras::-webkit-scrollbar{display:none}
.tira{
  flex:0 0 auto; min-width:52px; padding:7px 8px; border-radius:7px; border:1px solid var(--line);
  background:var(--surface); color:var(--verde); text-align:center; line-height:1.15;
}
.tira b{display:block; font-size:15px; font-weight:700}
.tira small{display:block; font-size:10px; color:var(--soft)}
.tira.activa{background:var(--verde); border-color:var(--verde); color:#fff}
.tira.activa small{color:rgba(255,255,255,.85)}
.tira.nueva{border-style:dashed; color:var(--soft); font-size:18px; display:flex; align-items:center; justify-content:center}
.ayuda{font-size:12.5px; color:var(--soft); line-height:1.5; margin:0 0 11px}
.ayuda b{color:var(--ink)}

/* ---------- Planilla ---------- */
.planilla table{font-size:12.5px}
.planilla thead th{background:#1f6d99; color:#fff; border-bottom:1px solid #17587e; text-transform:none}
.planilla th.col-fija{background:#1f6d99; color:#fff}
.planilla .th-grupo{
  border-left:1px solid rgba(255,255,255,.25); font-size:11px; font-weight:600;
  white-space:normal; min-width:120px; padding:7px 8px; text-align:center;
}
.rot-crit{display:inline-block; background:rgba(255,255,255,.2); border-radius:5px; padding:1px 5px; margin-right:4px; font-family:var(--mono); font-size:10px}
.btn-mas{margin-left:6px; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:6px; width:22px; height:22px; font-size:14px; line-height:1}
.planilla .th-ind{border-left:1px solid rgba(255,255,255,.18); padding:5px 6px; min-width:112px}
.planilla .rot-crit{font-size:9.5px}
.planilla .th-ind input{
  width:100%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
  color:#fff; font-size:11px; padding:5px 6px; border-radius:6px; text-align:center;
}
.planilla .th-ind input::placeholder{color:rgba(255,255,255,.6)}
.planilla .th-ind input:focus{background:#fff; color:var(--ink); box-shadow:none; border-color:#f0a500}
.btn-todos{margin-top:4px; border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.12); color:#fff; border-radius:6px; padding:2px 9px; font-size:11px}
.sub-blanco{font-size:10.5px; color:rgba(255,255,255,.8)}
.th-lnl{font-size:10px; padding:3px 4px; background:#17587e !important; color:rgba(255,255,255,.9); font-weight:600}
.planilla td{padding:4px 5px}
.planilla tbody tr:nth-child(even) td{background:#f7fbfd}
.planilla tbody tr:nth-child(even) td.col-fija{background:#f7fbfd}
.planilla td.izq{min-width:170px}
.celda-tap{width:38px}
.raya{color:var(--line)}
.fila-ausente td{background:#eef2f4 !important; color:var(--soft)}
.asis{
  width:34px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--soft);
}
.asis.ausente{background:#4a5d66; border-color:#4a5d66; color:#fff}
.asis.justificado{background:#f0a500; border-color:#f0a500; color:#3d2d00}
.btn-obs{width:30px; height:30px; border-radius:7px; border:1px dashed var(--line); background:transparent; color:var(--soft)}
.btn-obs.con-texto{border-style:solid; background:var(--verde-claro); color:var(--verde-oscuro)}

/* ---------- Modal ---------- */
.velo{position:fixed; inset:0; background:rgba(15,33,27,.45); display:flex; align-items:flex-end; justify-content:center; z-index:60; padding:0}
.modal{background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto}
.modal h3{font-size:17px; margin-bottom:4px}
@media(min-width:640px){
  .velo{align-items:center; padding:20px}
  .modal{border-radius:var(--r)}
}

/* ---------- Ingreso ---------- */
.ingreso{max-width:400px; margin:0 auto; padding:34px 16px 60px}
.ingreso .logo{display:flex; gap:3px; align-items:flex-end; height:34px; margin-bottom:16px}
.ingreso .logo i{width:9px; border-radius:2px 2px 0 0; display:block}
.ingreso h1{font-size:23px; line-height:1.15; margin-bottom:6px}
.aviso{background:#FCF2F1; border:1px solid #EBC9C5; color:var(--alerta); border-radius:var(--r-s); padding:9px 11px; font-size:13px; margin-bottom:10px}
.aviso.info{background:var(--verde-claro); border-color:#BEDFCE; color:var(--verde-oscuro)}

.vacio{text-align:center; padding:26px 14px; color:var(--soft); font-size:14px}
.vacio strong{display:block; color:var(--ink); font-family:var(--display); font-size:16px; margin-bottom:4px}

.hoja-impresion{display:none}
@media print{
  body{background:#fff}
  .barra-sup,.cursos,.pestanas,.no-imprimir,.solo-pantalla{display:none !important}
  .envoltura{padding:0; max-width:none}
  .hoja-impresion{display:block}
  .tarjeta{border:0; padding:0}
  .hoja-impresion table{width:100%; table-layout:fixed; border-collapse:collapse}
  .hoja-impresion th,.hoja-impresion td{padding:2px 3px; border:1px solid #b9cfdc;
    white-space:normal; overflow-wrap:anywhere; word-break:break-word; overflow:hidden;
    vertical-align:top; text-align:center}
  .hoja-impresion th{background:#e3f1fa; text-transform:none; letter-spacing:0;
    font-weight:700; color:#14303d; vertical-align:bottom}
  .hoja-impresion th.c-marca{font-family:var(--mono); font-weight:700; white-space:nowrap}
  .hoja-impresion .izq{text-align:left}
  .hoja-impresion thead{display:table-header-group}
  .hoja-impresion tr{break-inside:avoid}

  .leyenda-oa{line-height:1.4; margin:0 0 8px}
  .leyenda-oa .oa-titulo{margin:7px 0 1px; font-family:var(--mono)}
  .leyenda-oa .oa-texto{margin:0 0 3px; text-align:justify; hyphens:auto}
  .leyenda-oa .rejilla-ind{display:grid; grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:1fr; gap:3px; margin:0 0 4px; align-items:stretch}
  .leyenda-oa .caja-ind{border:1px solid #b9cfdc; border-radius:3px; padding:2px 4px;
    line-height:1.25; break-inside:avoid; height:100%; box-sizing:border-box}
  .leyenda-oa .caja-ind b{font-family:var(--mono)}
  .leyenda-oa .caja-ind i{font-style:normal; color:#5a7382; white-space:nowrap}
  .hoja-impresion h1{margin:0 0 2px}
  .col-fija{position:static; box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

function oasDelCurso(cursoId) {
  const c = CURRICULO[cursoId];
  if (!c) return [];
  const lista = c.oas.map((o) => ({
    codigo: `${c.sigla} OA ${String(o.n).padStart(2, "0")}`,
    eje: o.e, ejeNombre: EJES[o.e], texto: o.t
  }));
  c.oaa.forEach((o) => lista.push({
    codigo: `${c.sigla} OAA ${o.n}`,
    eje: "act", ejeNombre: EJES.act, texto: o.t
  }));
  return lista;
}

function esTextoDeOA(texto, cursoId) {
  const t = (texto || "").trim();
  return !!t && oasDelCurso(cursoId).some((o) => o.texto.trim() === t);
}

function opcionesOAsHTML(cursoId, ev, actual) {
  const usados = new Set((ev && ev.criterios ? ev.criterios : []).map((c) => c.oa).filter(Boolean));
  if (actual) usados.delete(actual);
  const grupos = {};
  oasDelCurso(cursoId).forEach((o) => { (grupos[o.ejeNombre] = grupos[o.ejeNombre] || []).push(o); });
  return Object.entries(grupos).map(([eje, lista]) => `
    <optgroup label="${esc(eje)}">
      ${lista.map((o) => `<option value="${esc(o.codigo)}" ${o.codigo === actual ? "selected" : ""} ${usados.has(o.codigo) ? "disabled" : ""}>${esc(o.codigo)}${usados.has(o.codigo) ? " (ya está)" : ""} · ${esc(recorte(o.texto, 70))}</option>`).join("")}
    </optgroup>`).join("");
}

function aplicarUnidad(ev, u, cods) {
  ev.oa = `Unidad ${u.n}: ${u.titulo}`;
  if (!ev.nombre || /^Lista de cotejo$/.test(ev.nombre)) ev.nombre = `Unidad ${u.n} · ${u.titulo}`;
  cods = cods || [];
  const vacio = ev.criterios.length === 1 && !ev.criterios[0].texto.trim() && !ev.criterios[0].oa;
  if (vacio && cods.length) { ev.criterios = []; ev.marcas.forEach((f) => { f.length = 0; }); ev.datos.forEach((f) => { f.length = 0; }); }
  cods.forEach((cod) => {
    if (ev.criterios.some((c) => c.oa === cod)) return;
    ev.criterios.push(criterioDesdeOA(cod, S.cursoId, 3));
    ev.marcas.forEach((f) => f.push([0, 0, 0]));
    ev.datos.forEach((f) => f.push(filaNiveles(ev.criterios[ev.criterios.length - 1])));
  });
  S.criterioActivo = 0; marcarCambio(); pintar();
}

function buscarOA(cursoId, codigo) {
  return oasDelCurso(cursoId).find((o) => o.codigo === codigo) || null;
}

/* ===== Escala de notas =====
   Exigencia fija del 60%. Nota mínima 2,0 · aprobación 4,0 con el 60% del
   puntaje · nota máxima 7,0 con el puntaje total. Los tramos son lineales. */
const EXIGENCIA = 60;
const NOTA_MIN = 2, NOTA_APROB = 4, NOTA_MAX = 7;

function calcularNota(puntaje, total, exig) {
  if (!total || total <= 0) return null;
  const corte = (total * exigenciaValida(exig)) / 100;
  let n;
  if (corte <= 0) n = NOTA_MAX;
  else if (puntaje <= corte) n = NOTA_MIN + (NOTA_APROB - NOTA_MIN) * (puntaje / corte);
  else if (total - corte <= 0) n = NOTA_MAX;
  else n = NOTA_APROB + (NOTA_MAX - NOTA_APROB) * ((puntaje - corte) / (total - corte));
  return Math.round(Math.min(NOTA_MAX, Math.max(NOTA_MIN, n)) * 10) / 10;
}

/* Puntaje mínimo que alcanza cada nota, para mostrar la escala completa */
function tablaNotas(total, exig) {
  const filas = [];
  for (let p = 0; p <= total; p++) filas.push({ p, nota: calcularNota(p, total, exig) });
  return filas;
}
const pesoDe = (ev) => { const n = Number(ev && ev.peso); return n >= 0 && n <= 10 ? n : 1; };
const exigenciaValida = (e) => { const n = Number(e); return n >= 10 && n <= 100 ? n : EXIGENCIA; };

const PALETA = ["#c0392b", "#d9701f", "#e0a50f", "#7fa83f", "#2e9e6b"];
function mezclar(a, b, t) {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.substr(i, 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  const v = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, "0");
  return `#${v(r1, r2)}${v(g1, g2)}${v(b1, b2)}`;
}
function colorNivel(k, total) {
  if (total <= 1) return PALETA[4];
  const t = ((k - 1) / (total - 1)) * (PALETA.length - 1);
  const i = Math.min(PALETA.length - 2, Math.floor(t));
  return mezclar(PALETA[i], PALETA[i + 1], t - i);
}

function puntajeTotal(ev) {
  if (esEscala(ev)) return totalIndicadores(ev) * maxNivel(ev);
  let t = 0;
  ev.criterios.forEach((c) => c.indicadores.forEach((ind) => { t += Number(ind.pts) || 0; }));
  return t;
}

function totalIndicadores(ev) {
  return ev.criterios.reduce((a, c) => a + c.indicadores.length, 0);
}

function marcaDe(ev, i, j, q) {
  const f = ev.marcas[i];
  if (!f || !f[j]) return 0;
  return f[j][q] || 0;
}

/* Resultado de un estudiante: puntaje logrado sobre el total del instrumento */
function resultado(ev, i) {
  let puntaje = 0, marcados = 0, logrados = 0, sinMarca = 0;
  if (esEscala(ev)) {
    ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
      const v = nivelDe(ev, i, j, q);
      if (v) { puntaje += puntosNivel(ev, v); marcados++; if (v === nNiveles(ev)) logrados++; }
      else sinMarca++;
    }));
    const tot = puntajeTotal(ev);
    return { puntaje, total: tot, marcados, logrados, sinMarca,
      nota: marcados ? calcularNota(puntaje, tot, ev.exigencia) : null };
  }
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    const v = marcaDe(ev, i, j, q);
    if (v === 1) { puntaje += Number(ind.pts) || 0; logrados++; marcados++; }
    else if (v === 2) marcados++;
    else sinMarca++;
  }));
  const total = puntajeTotal(ev);
  return {
    puntaje, total, marcados, logrados, sinMarca,
    nota: marcados ? calcularNota(puntaje, total, ev.exigencia) : null
  };
}

/* Logro de un criterio para un estudiante */
function logroCriterio(ev, i, j) {
  const c = ev.criterios[j];
  let logrados = 0, marcados = 0, puntaje = 0, total = 0;
  if (esEscala(ev)) {
    c.indicadores.forEach((ind, q) => {
      total += maxNivel(ev);
      const v = nivelDe(ev, i, j, q);
      if (v) { marcados++; puntaje += puntosNivel(ev, v); if (v === nNiveles(ev)) logrados++; }
    });
    return { logrados, marcados, puntaje, total, n: c.indicadores.length };
  }
  c.indicadores.forEach((ind, q) => {
    const v = marcaDe(ev, i, j, q);
    total += Number(ind.pts) || 0;
    if (v === 1) { logrados++; marcados++; puntaje += Number(ind.pts) || 0; }
    else if (v === 2) marcados++;
  });
  return { logrados, marcados, puntaje, total, n: c.indicadores.length };
}

        peso: pesoDe(e),

        modo: e.modo === "escala" ? "escala" : "cotejo",
        escala: { niveles: (Array.isArray(e.escala && e.escala.niveles) && e.escala.niveles.length >= 2
          ? e.escala.niveles : ESCALA_BASE).slice(0, 8).map((x, k) => ({
            r: String(x && x.r != null ? x.r : "Nivel " + (k + 1)),
            p: Number.isFinite(Number(x && x.p)) ? Number(x.p) : k + 1 })) },
        criterios,
        marcas: Array.from({ length: n }, (_, i) =>
          criterios.map((c, j) =>
            Array.from({ length: c.indicadores.length }, (_, q) => {
              const v = e.marcas && e.marcas[i] && e.marcas[i][j] ? Number(e.marcas[i][j][q]) : 0;
              return v === 1 || v === 2 ? v : 0;
            }))),
        datos: Array.from({ length: n }, (_, i) =>
          criterios.map((c, j) => {
            const bruto = e.datos && e.datos[i] ? e.datos[i][j] : null;
            const limpio = (x) => { const v = Number(x); return v >= 1 && v <= 8 ? v : 0; };
            if (Array.isArray(bruto)) return c.indicadores.map((_, q) => limpio(bruto[q]));
            const v = limpio(bruto);
            return c.indicadores.map((_, q) => (q === 0 ? v : 0));
          })),
        estado: Array.from({ length: n }, (_, i) => {
          const v = e.estado ? Number(e.estado[i]) : 0;
          return v === 1 || v === 2 ? v : 0;
        }),
        obs: Array.from({ length: n }, (_, i) => (e.obs && e.obs[i]) || "")
      };
    })
  };
}

let sb = null;
let sbListo = (async () => {
  try {
    const m = await import("https://esm.sh/@supabase/supabase-js@2");
    sb = m.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: "sb-evalef-auth" }
    });
  } catch (err) {
    console.warn("Sin conexión con el servidor:", err);
    sb = null;
  }
})();

async function usuarioActual() {
  if (!sb) return null;
  try {
    const { data } = await sb.auth.getSession();
    return data && data.session && data.session.user ? data.session.user : null;
  } catch { return null; }
}

const almacen = {
  async leer(cursoId) {
    const u = await usuarioActual();
    if (u) {
      const { data, error } = await sb.from(TABLA).select("contenido")
        .eq("user_id", u.id).eq("curso_id", cursoId).maybeSingle();
      if (!error && data && data.contenido) {
        try { localStorage.setItem(PREFIJO + cursoId, JSON.stringify(data.contenido)); } catch {}
        return normalizar(data.contenido);
      }
      if (error) throw new Error(error.message);
    }
    const local = localStorage.getItem(PREFIJO + cursoId);
    if (local) { try { return normalizar(JSON.parse(local)); } catch {} }
    return cursoVacio(cursoId);
  },
  async escribir(cursoId, obj) {
    try { localStorage.setItem(PREFIJO + cursoId, JSON.stringify(obj)); } catch {}
    const u = await usuarioActual();
    if (!u) throw new Error("sin-sesion");
    const { error } = await sb.from(TABLA).upsert(
      { user_id: u.id, curso_id: cursoId, contenido: obj, actualizado: new Date().toISOString() },
      { onConflict: "user_id,curso_id" }
    );
    if (error) throw new Error(error.message);
  }
};

let temporizador = null, cursoPendiente = null, datosPendientes = null;
function marcarCambio() {
  /* Se recuerda a qué curso pertenece el cambio: si se cambia de curso antes de
     que alcance a guardar, los datos igual van a donde corresponden. */
  cursoPendiente = S.cursoId;
  datosPendientes = S.datos;
  S.guardado = "pendiente";
  pintarEstado();
  clearTimeout(temporizador);
  temporizador = setTimeout(guardar, 700);
}
async function guardar() {
  const curso = cursoPendiente || S.cursoId;
  const datos = datosPendientes || S.datos;
  cursoPendiente = null; datosPendientes = null;
  if (!datos) return;
  S.guardado = "guardando"; S.detalleError = ""; pintarEstado();
  try {
    await almacen.escribir(curso, datos);
    S.guardado = "ok";
  } catch (e) {
    S.guardado = e.message === "sin-sesion" ? "local" : "error";
    S.detalleError = e.message === "sin-sesion" ? "" : e.message;
  }
  pintarEstado();
}
function pintarEstado() {
  const c = $("#estado");
  if (!c) return;
  const mapa = {
    ok: ["", "Guardado automático"], guardando: ["trabajando", "Guardando…"],
    pendiente: ["trabajando", "Guardando…"], local: ["error", "Solo en este equipo"],
    error: ["error", "No se pudo guardar"]
  };
  const [cls, txt] = mapa[S.guardado] || mapa.ok;
  c.innerHTML = `<span class="punto ${cls}"></span><span>${esc(txt)}</span>`;
}

async function cargarCurso(id) {
  if (datosPendientes) { clearTimeout(temporizador); await guardar(); }
  S.cursoId = id; S.cargando = true; S.errorCarga = ""; S.evalIdx = 0;
  S.criterioActivo = 0; S.alumnoActivo = 0; S.ajustes = false;
  try { localStorage.setItem(PREFIJO + "ultimoCurso", id); } catch {}
  pintar();
  try { S.datos = await almacen.leer(id); }
  catch (e) { S.errorCarga = e.message; S.datos = cursoVacio(id); }
  S.cargando = false;
  pintar();
}

/* --- Cabecera de la evaluación --- */
function estadisticas(ev) {
  const n = S.datos.roster.length;
  let puntaje = 0, maximo = 0, sinEvaluar = 0, ausentes = 0;
  const notas = [];
  const total = puntajeTotal(ev);
  for (let i = 0; i < n; i++) {
    if (ev.estado[i]) { ausentes++; continue; }
    const r = resultado(ev, i);
    puntaje += r.puntaje;
    maximo += total;
    if (r.sinMarca > 0) sinEvaluar++;
    if (r.nota !== null) notas.push(r.nota);
  }
  return {
    puntaje, maximo, sinEvaluar, ausentes,
    logro: maximo ? Math.round((puntaje / maximo) * 100) : null,
    prom: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null
  };
}

    ["Marca en clases", "En <b>Planilla</b>, cada indicador tiene L (logrado) y NL (no logrado). La nota se calcula sola, al 60% de exigencia."]
  ];
  return `<ol class="pasos">${pasos.map(([t, d]) => `<li><b>${t}.</b> ${d}</li>`).join("")}</ol>`;
}

/* --- Pestaña Evaluar --- */
function vistaEvaluar() {
  const ev = evalActual();
  if (!S.datos.roster.length) {
    const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
    return `<div class="tarjeta">
      <h3 style="margin:0 0 4px">Empecemos por ${esc(curso.nombre)}</h3>
      <p class="sub" style="margin:0 0 12px">Todavía no hay estudiantes en este curso. Son tres pasos.</p>
      ${pasosHTML()}
      <div style="margin-top:14px">
        <button class="btn btn-lleno btn-ancho" data-accion="pestana" data-v="curso">1 · Cargar la nómina del curso</button>
      </div>
    </div>` + cabeceraEvaluacion();
  }
  return cabeceraEvaluacion() + `
  <div class="pestanas no-imprimir" style="margin-top:0">
    <button class="pestana" data-accion="modo" data-v="planilla" aria-pressed="${S.modo === "planilla"}">Planilla</button>
    <button class="pestana" data-accion="modo" data-v="criterio" aria-pressed="${S.modo === "criterio"}">Por criterio</button>
    <button class="pestana" data-accion="modo" data-v="alumno" aria-pressed="${S.modo === "alumno"}">Por estudiante</button>
  </div>
  ${S.modo === "criterio" ? vistaPorCriterio(ev) : S.modo === "alumno" ? vistaPorAlumno(ev) : vistaPlanilla(ev)}`;
}

function parCasillas(ev, i, j, q, compacto) {
  const v = marcaDe(ev, i, j, q);
  return `<span class="par-cas${compacto ? " compacto" : ""}">
    <button class="cas ${v === 1 ? "si" : ""}" data-accion="marca-l" data-i="${i}" data-j="${j}" data-q="${q}"
      aria-pressed="${v === 1}" title="Logrado">${v === 1 ? "✓" : ""}</button>
    <button class="cas no ${v === 2 ? "si" : ""}" data-accion="marca-nl" data-i="${i}" data-j="${j}" data-q="${q}"
      aria-pressed="${v === 2}" title="No logrado">${v === 2 ? "✗" : ""}</button>
  </span>`;
}

function descriptorDe(ev, c, k) {
  const propio = c && Array.isArray(c.descriptores) ? (c.descriptores[k] || "").trim() : "";
  return propio || (ev.escala.niveles[k] ? ev.escala.niveles[k].r : "");
}

function medidor(ev, i, j, q, compacto) {
  const N = nNiveles(ev), valor = nivelDe(ev, i, j, q);
  const c = ev.criterios[j];
  return `<div class="medidor${compacto ? " compacto" : ""}" style="grid-template-columns:repeat(${N},1fr)">
    ${ev.escala.niveles.map((n, k) => {
      const k1 = k + 1, alto = 6 + Math.round((k / Math.max(1, N - 1)) * 12);
      return `<button class="nivel" style="--c:${colorNivel(k1, N)}" data-accion="poner-nivel"
        data-i="${i}" data-j="${j}" data-q="${q}" data-k="${k1}" aria-pressed="${valor === k1}"
        title="${esc(descriptorDe(ev, c, k))} · ${n.p} pt"><span class="barra" style="height:${alto}px"></span>
        <span class="num">${k1}</span></button>`;
    }).join("")}
  </div>${compacto || !valor ? "" : `<p class="sub descriptor-elegido">${esc(descriptorDe(ev, c, valor - 1))}</p>`}`;
}

function leyendaEscala(ev) {
  return ev.escala.niveles.map((n, k) => `${k + 1} ${esc(n.r)} (${n.p} pt)`).join(" · ");
}

function botonAsistencia(ev, i) {
  const e = ev.estado[i] || 0;
  const cls = e === 1 ? "ausente" : e === 2 ? "justificado" : "";
  const txt = e === 1 ? "A" : e === 2 ? "J" : "P";
  const tit = e === 1 ? "Ausente" : e === 2 ? "Ausente justificado" : "Presente";
  return `<button class="asis ${cls}" data-accion="asistencia" data-i="${i}" title="${tit}">${txt}</button>`;
}

function insigniaCriterio(ev, i, j) {
  const l = logroCriterio(ev, i, j);
  const cls = !l.marcados ? "" : l.puntaje === l.total ? "verde" : l.puntaje === 0 ? "roja" : "media";
  return `<span class="insignia-nivel ${cls}">${l.marcados ? `${l.logrados}/${l.n} · ${l.puntaje} pts` : "sin marcar"}</span>`;
}

/* --- Planilla --- */
function columnasPlanilla(ev) {
  const cols = [];
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => cols.push({ j, q, ind })));
  return cols;
}

function vistaPlanilla(ev) {
  const cols = columnasPlanilla(ev);
  const total = puntajeTotal(ev);
  return `
  <p class="ayuda no-imprimir">${esEscala(ev) ? `Cada indicador se marca con un nivel de la escala: <b>${leyendaEscala(ev)}</b>.
  Toca la celda para avanzar de nivel y sigue tocando para volver a dejarla vacía.` : `Cada indicador tiene dos casillas: <b>L</b> logrado y <b>NL</b> no logrado.
  Toca para marcar y vuelve a tocar la misma casilla para dejarla sin marca. El botón <b>✓✓</b> del encabezado
  marca logrado ese indicador a todo el curso presente, y lo limpia si ya estaban todos. El botón de asistencia
  cicla <b>P → A</b> (ausente) <b>→ J</b> (justificado). El botón <b>✎</b> agrega una observación. Con <b>+</b>
  agregas otro indicador al criterio, y el texto del encabezado se edita tocándolo.`}
  Escala automática al ${exigenciaValida(ev.exigencia)}%: <b>0</b> pts = 2,0 · <b>${ptsAprobacion(total, ev.exigencia).toString().replace(".", ",")}</b> pts = 4,0 · <b>${total}</b> pts = 7,0.</p>
  <div class="envoltura-tabla planilla">
    <table>
      <thead>
        <tr>
          <th class="izq col-fija" rowspan="3">ESTUDIANTE</th>
          <th rowspan="3">ASIS.</th>
          ${ev.criterios.map((c, j) => `<th class="th-grupo" colspan="${c.indicadores.length * (esEscala(ev) ? 1 : 2)}">
            <span class="rot-crit">${esc(c.oa || "Sin OA")}</span> ${esc(recorte(c.texto || "Objetivo sin redactar", 90))}
            <button class="btn-mas" data-accion="agregar-indicador" data-j="${j}" title="Agregar indicador">+</button>
          </th>`).join("")}
          <th rowspan="3">PTS</th><th rowspan="3">NOTA</th><th rowspan="3">OBS</th>
        </tr>
        <tr>
          ${ev.criterios.map((c, j) => c.indicadores.map((ind, q) => `<th ${esEscala(ev) ? "" : `colspan="2"`} class="th-ind">
              <input type="text" data-campo="indicador" data-j="${j}" data-q="${q}" value="${esc(ind.texto)}" placeholder="Indicador ${q + 1}">
              ${esEscala(ev) ? `<span class="pts-pill">1–${nNiveles(ev)}</span>`
                : `<span class="pts-pill">${ind.pts} pts</span>
              <button class="btn-todos" data-accion="todos-marca" data-j="${j}" data-q="${q}" title="Marcar logrado a todo el curso">✓✓</button>`}
            </th>`).join("")).join("")}
        </tr>
        <tr>
          ${cols.map(() => esEscala(ev) ? `<th class="th-lnl">nivel</th>` : `<th class="th-lnl">L</th><th class="th-lnl">NL</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${S.datos.roster.map((nom, i) => {
          const r = resultado(ev, i);
          const est = ev.estado[i] || 0;
          return `<tr class="${est ? "fila-ausente" : ""}">
            <td class="izq col-fija"><span class="n-orden">${String(i + 1).padStart(2, "0")}</span> ${esc(nom || "—")}</td>
            <td>${botonAsistencia(ev, i)}</td>
            ${cols.map((col) => {
              if (esEscala(ev)) {
                if (est) return `<td class="raya">—</td>`;
                const v = nivelDe(ev, i, col.j, col.q);
                return `<td class="celda-tap"><button class="cas nivel-cas"
                  style="${v ? `background:${colorNivel(v, nNiveles(ev))};color:#fff;border-color:transparent` : ""}"
                  data-accion="ciclo-nivel" data-i="${i}" data-j="${col.j}" data-q="${col.q}"
                  title="${v ? esc(descriptorDe(ev, ev.criterios[col.j], v - 1)) : "Sin marca"}">${v || ""}</button></td>`;
              }
              if (est) return `<td class="raya">—</td><td class="raya">—</td>`;
              const v = marcaDe(ev, i, col.j, col.q);
              return `<td class="celda-tap"><button class="cas ${v === 1 ? "si" : ""}" data-accion="marca-l"
                  data-i="${i}" data-j="${col.j}" data-q="${col.q}" aria-pressed="${v === 1}"
                  aria-label="Logrado">${v === 1 ? "✓" : ""}</button></td>
                <td class="celda-tap"><button class="cas no ${v === 2 ? "si" : ""}" data-accion="marca-nl"
                  data-i="${i}" data-j="${col.j}" data-q="${col.q}" aria-pressed="${v === 2}"
                  aria-label="No logrado">${v === 2 ? "✗" : ""}</button></td>`;
            }).join("")}
            <td class="mono">${est ? "—" : r.puntaje + "/" + total}</td>
            <td>${est ? "—" : `<span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}">${num1(r.nota)}</span>`}</td>
            <td><button class="btn-obs ${ev.obs[i] ? "con-texto" : ""}" data-accion="obs" data-i="${i}" title="Observación">✎</button></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>
  <div class="fila no-imprimir" style="margin-top:10px">
    <button class="btn btn-mini" data-accion="imprimir">Imprimir o guardar PDF</button>
    <button class="btn btn-mini" data-accion="excel">Descargar Excel</button>
  </div>`;
}

/* --- Por criterio --- */
function vistaPorCriterio(ev) {
  const j = Math.min(S.criterioActivo, ev.criterios.length - 1);
  const c = ev.criterios[j];
  return `
  <div class="tarjeta">
    <div class="fila no-imprimir" style="gap:5px;margin-bottom:10px;overflow-x:auto">
      ${ev.criterios.map((x, k) => `<button class="chip-crit" data-accion="criterio" data-j="${k}" aria-pressed="${k === j}">${esc(x.oa || "Sin OA")}</button>`).join("")}
    </div>
    ${c.oa ? `<p class="sub" style="margin:0 0 4px">${esc(EJES[c.eje] || "")}</p>` : ""}
    <h2 style="font-size:15px;line-height:1.35">${esc(c.texto || "Criterio " + (j + 1))}</h2>
    ${esEscala(ev) ? `<p class="sub" style="margin:6px 0 0">${leyendaEscala(ev)}</p>`
      : `<ol class="lista-ind">${c.indicadores.map((ind, q) => `<li><b class="mono">${q + 1}</b> ${esc(ind.texto || "Indicador sin redactar")} <span class="pts-pill oscuro">${ind.pts} pts</span></li>`).join("")}</ol>`}
    <div class="fila no-imprimir" style="gap:5px;padding:10px 0;border-bottom:1px solid var(--line)">
      ${esEscala(ev)
        ? `<span class="sub">Marcar a todo el curso:</span>
           ${ev.escala.niveles.map((n, k) => `<button class="btn btn-mini" data-accion="todos-nivel" data-j="${j}" data-k="${k + 1}" title="${esc(n.r)}">${k + 1}</button>`).join("")}`
        : `<span class="sub">✓ a todo el curso:</span>
           ${c.indicadores.map((ind, q) => `<button class="btn btn-mini" data-accion="todos-marca" data-j="${j}" data-q="${q}" title="${esc(ind.texto)}">${q + 1}</button>`).join("")}`}
      <button class="btn btn-mini" data-accion="limpiar-criterio" data-j="${j}">Limpiar</button>
    </div>
    ${S.datos.roster.map((nombre, i) => {
      const r = resultado(ev, i);
      const est = ev.estado[i] || 0;
      return `<div class="alumno">
        <div class="alumno-cab">
          <span class="n-orden">${String(i + 1).padStart(2, "0")}</span>
          <span class="nombre">${esc(nombre || "—")}</span>
          <span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}">${num1(r.nota)}</span>
          ${botonAsistencia(ev, i)}
        </div>
        ${est ? `<p class="ausente-aviso">${est === 1 ? "Ausente" : "Ausente justificado"} · no se promedia</p>`
          : esEscala(ev) ? ev.criterios[j].indicadores.map((ind, q) => `<div class="ind-escala">
              <span>${esc(ind.texto || "Indicador " + (q + 1))}</span>${medidor(ev, i, j, q, true)}</div>`).join("")
          : `<div class="fila" style="gap:9px;align-items:flex-end">
              ${c.indicadores.map((ind, q) => `<div class="indicador-mini"><b class="mono">${q + 1}</b>${parCasillas(ev, i, j, q, true)}</div>`).join("")}
              <span style="margin-left:auto">${insigniaCriterio(ev, i, j)}</span>
            </div>`}
      </div>`;
    }).join("")}
  </div>`;
}

/* --- Por estudiante --- */
function vistaPorAlumno(ev) {
  const i = Math.min(S.alumnoActivo, S.datos.roster.length - 1);
  const r = resultado(ev, i);
  const est = ev.estado[i] || 0;
  return `
  <div class="tarjeta">
    <div class="fila fila-sep no-imprimir" style="margin-bottom:10px">
      <button class="btn btn-mini" data-accion="alumno-mover" data-d="-1" ${i === 0 ? "disabled" : ""}>‹ Anterior</button>
      <select data-accion="elegir-alumno" style="flex:1;min-width:140px">
        ${S.datos.roster.map((n, k) => `<option value="${k}" ${k === i ? "selected" : ""}>${esc(n || "—")}</option>`).join("")}
      </select>
      <button class="btn btn-mini" data-accion="alumno-mover" data-d="1" ${i === S.datos.roster.length - 1 ? "disabled" : ""}>Siguiente ›</button>
    </div>
    <div class="fila fila-sep" style="border-bottom:1px solid var(--line);padding-bottom:10px">
      <div>
        <h2 style="font-size:16px">${esc(S.datos.roster[i] || "—")}</h2>
        <p class="sub" style="margin:2px 0 0">${esEscala(ev) ? `${r.marcados} de ${totalIndicadores(ev)} indicadores evaluados` : `${r.logrados} de ${totalIndicadores(ev)} indicadores logrados`} · ${r.puntaje} de ${r.total} pts${r.sinMarca ? ` · ${r.sinMarca} sin marcar` : ""}</p>
      </div>
      <div class="fila">
        <span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}" style="font-size:17px">${num1(r.nota)}</span>
        ${botonAsistencia(ev, i)}
      </div>
    </div>
    ${est ? `<p class="ausente-aviso">${est === 1 ? "Ausente" : "Ausente justificado"} · no se promedia</p>`
      : ev.criterios.map((c, j) => `
        <div class="criterio-linea">
          <div class="rotulo"><b>${esc(c.oa || "C" + (j + 1))}</b><span>${esc(c.texto || "Criterio " + (j + 1))}</span></div>
          ${esEscala(ev) ? `<div class="indicadores">
            ${c.indicadores.map((ind, q) => `<div class="ind-escala">
              <span>${esc(ind.texto || "Indicador " + (q + 1))}</span>${medidor(ev, i, j, q)}</div>`).join("")}
          </div>
          <div class="fila" style="margin-top:7px">${insigniaCriterio(ev, i, j)}</div>` : `<div class="indicadores">
            <div class="cabecera-lnl"><span>L</span><span>NL</span></div>
            ${c.indicadores.map((ind, q) => `<div class="indicador">${parCasillas(ev, i, j, q)}
              <span>${esc(ind.texto || "Indicador " + (q + 1))} <span class="pts-pill oscuro">${ind.pts} pts</span></span></div>`).join("")}
          </div>
          <div class="fila" style="margin-top:7px">${insigniaCriterio(ev, i, j)}</div>`}
        </div>`).join("")}
    <div style="margin-top:12px">
      <button class="obs-boton" data-accion="obs" data-i="${i}">${ev.obs[i] ? "Ver observación" : "Agregar observación"}</button>
      ${ev.obs[i] ? `<p class="sub" style="margin:2px 0 0">${esc(ev.obs[i])}</p>` : ""}
      <div style="margin-top:6px"><button class="obs-boton" data-accion="ficha" data-i="${i}">Ver todas sus observaciones del curso</button></div>
    </div>
  </div>`;
}

/* --- Pestaña Resumen --- */
function vistaResumen() {
  const ev = evalActual();
  const n = S.datos.roster.length;
  if (!n) return `<div class="tarjeta"><div class="vacio"><strong>Sin datos</strong>Carga la nómina del curso.</div></div>`;

  const e = estadisticas(ev);
  const notas = [];
  for (let i = 0; i < n; i++) {
    if (ev.estado[i]) continue;
    const r = resultado(ev, i);
    if (r.nota !== null) notas.push(r.nota);
  }
  const aprob = notas.filter((x) => x >= 4).length;

  const logros = [];
  if (esEscala(ev)) {
    ev.criterios.forEach((c, j) => {
      let suma = 0, cont = 0;
      for (let i = 0; i < n; i++) {
        if (ev.estado[i]) continue;
        c.indicadores.forEach((ind, q) => {
          const v = nivelDe(ev, i, j, q);
          if (v) { suma += puntosNivel(ev, v); cont++; }
        });
      }
      logros.push({ rot: c.oa || `C${j + 1}`, texto: c.texto || `Criterio ${j + 1}`,
        pct: cont ? Math.round((suma / (cont * maxNivel(ev))) * 100) : null });
    });
  } else ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    let log = 0, marc = 0;
    for (let i = 0; i < n; i++) {
      if (ev.estado[i]) continue;
      const v = marcaDe(ev, i, j, q);
      if (v === 1) { log++; marc++; } else if (v === 2) marc++;
    }
    logros.push({ rot: `${j + 1}.${q + 1}`, texto: ind.texto || `Indicador ${q + 1}`, pct: marc ? Math.round((log / marc) * 100) : null, log, marc });
  }));

  return `
  <div class="tarjeta">
    <h2>${esc(ev.nombre)}</h2>
    <p class="sub" style="margin:2px 0 12px">${fechaLarga(ev.fecha)} · ${esc((CURSOS.find((c) => c.id === S.cursoId) || {}).nombre)} · ${esEscala(ev) ? "escala de apreciación" : totalIndicadores(ev) + " indicadores"} · ${puntajeTotal(ev)} pts</p>
    <div class="metricas">
      <div class="metrica"><b>${num1(e.prom)}</b><span>PROMEDIO</span></div>
      <div class="metrica"><b>${notas.length ? Math.round((aprob / notas.length) * 100) + "%" : "—"}</b><span>SOBRE 4,0</span></div>
      <div class="metrica"><b>${e.logro === null ? "—" : e.logro + "%"}</b><span>LOGRO DEL CURSO</span></div>
    </div>
    ${e.ausentes ? `<p class="sub" style="margin:10px 0 0">${e.ausentes} estudiante${e.ausentes > 1 ? "s" : ""} sin evaluar por inasistencia.</p>` : ""}
    ${e.sinEvaluar ? `<p class="sub" style="margin:4px 0 0">${e.sinEvaluar} con indicadores sin marcar.</p>` : ""}
  </div>

  <div class="tarjeta">
    <h2 style="font-size:15px">${esEscala(ev) ? "Logro por criterio" : "Logro por indicador"}</h2>
    <p class="sub" style="margin:2px 0 12px">${esEscala(ev) ? "Porcentaje del puntaje posible alcanzado en cada criterio." : "Porcentaje de estudiantes que logró cada indicador, entre quienes ya tienen marca."}</p>
    <div class="logro">
      ${logros.map((l) => `
        <div class="logro-item">
          <div class="rotulo"><span><b class="mono" style="font-size:11px">${l.rot}</b> ${esc(l.texto)}</span><em>${l.pct === null ? "—" : l.pct + "%"}</em></div>
          <div class="pista"><i class="${l.pct === null ? "" : l.pct < 50 ? "critica" : l.pct < 70 ? "baja" : ""}" style="width:${l.pct || 0}%"></i></div>
        </div>`).join("")}
    </div>
  </div>

  <div class="tarjeta">
    <h2 style="font-size:15px">Notas del curso</h2>
    <div style="margin-top:8px">
      ${S.datos.roster.map((nom, i) => {
        const r = resultado(ev, i);
        const est = ev.estado[i] || 0;
        return `<div class="alumno-cab" style="padding:6px 0;border-top:1px solid var(--line)">
          <span class="n-orden">${String(i + 1).padStart(2, "0")}</span>
          <span class="nombre">${esc(nom || "—")}</span>
          ${est ? `<span class="sub">${est === 1 ? "Ausente" : "Justificado"}</span>`
            : `<span class="sub mono">${r.puntaje}/${r.total}</span>
               <span class="nota ${r.nota === null ? "" : r.nota < 4 ? "roja" : "azul"}">${num1(r.nota)}</span>`}
        </div>`;
      }).join("")}
    </div>
    <div class="fila no-imprimir" style="margin-top:14px">
      <button class="btn btn-mini" data-accion="imprimir">Imprimir o guardar PDF</button>
      <button class="btn btn-mini" data-accion="excel">Descargar Excel</button>
    </div>
  </div>`;
}

/* --- Pestaña Consolidado --- */
function datosConsolidado() {
  const evs = S.datos.evaluaciones;
  const filas = S.datos.roster.map((nom, i) => {
    const notas = evs.map((ev) => (ev.estado[i] ? null : resultado(ev, i).nota));
    const val = notas.filter((x) => x !== null);
    let sum = 0, pesos = 0;
    notas.forEach((n, k) => { if (n === null) return; const w = pesoDe(evs[k]); sum += n * w; pesos += w; });
    return { nom, notas, val, prom: pesos > 0 ? sum / pesos : null };
  });
  const proms = filas.map((f) => f.prom).filter((x) => x !== null);
  return {
    evs, filas,
    promCurso: proms.length ? proms.reduce((a, b) => a + b, 0) / proms.length : null,
    aprob: proms.filter((x) => x >= 4).length, conNota: proms.length
  };
}

function fichaDe(i) {
  const evs = S.datos.evaluaciones;
  const items = evs.map((ev) => {
    const est = ev.estado[i] || 0;
    const r = est ? null : resultado(ev, i);
    return { ev, est, nota: r ? r.nota : null, obs: (ev.obs[i] || "").trim() };
  });
  const notas = items.map((x) => x.nota).filter((n) => n !== null);
  let sum = 0, pesos = 0;
  items.forEach((x) => { if (x.nota === null) return; const w = pesoDe(x.ev); sum += x.nota * w; pesos += w; });
  return {
    nombre: S.datos.roster[i] || "—",
    items,
    conObs: items.filter((x) => x.obs).length,
    prom: pesos > 0 ? sum / pesos : null
  };
}

function fichaHTML(i) {
  const f = fichaDe(i);
  return f.items.map((x) => `
    <div class="bloque-unidad">
      <div class="fila fila-sep">
        <b>${esc(x.ev.nombre)}</b>
        <span class="nota ${x.nota === null ? "" : x.nota < 4 ? "roja" : "azul"}">${x.est ? (x.est === 1 ? "A" : "J") : num1(x.nota)}</span>
      </div>
      <p class="sub" style="margin:2px 0 6px">${fechaLarga(x.ev.fecha)}${x.ev.oa ? " · " + esc(x.ev.oa) : ""}</p>
      ${x.obs ? `<p style="margin:0">${esc(x.obs)}</p>`
              : `<p class="sub" style="margin:0">Sin observación en esta lista.</p>`}
    </div>`).join("");
}

    <div class="metricas">

        <th>PROM.</th>
      </tr></thead>
      <tbody>
        ${filas.map((f, i) => `<tr>
          <td class="izq col-fija"><span class="n-orden">${String(i + 1).padStart(2, "0")}</span>
            <button class="obs-boton" data-accion="ficha" data-i="${i}" title="Ver sus observaciones">${esc(f.nom || "—")}</button></td>
          ${f.notas.map((n) => `<td class="mono" style="color:${n === null ? "var(--line)" : n < 4 ? "var(--n1)" : "var(--ink)"}">${n === null ? "—" : num1(n)}</td>`).join("")}
          <td><span class="nota ${f.prom === null ? "" : f.prom < 4 ? "roja" : "azul"}">${num1(f.prom)}</span></td>

  <div class="fila no-imprimir" style="margin-top:10px">

}

function listaOAsHTML(cursoId, modo) {
  const oas = oasDelCurso(cursoId);

           <span><b class="mono">${esc(o.codigo)}</b> ${esc(recorte(o.texto, 150))}</span></button>`).join("")}`).join("") +
    `<p class="fuente">Objetivos de Aprendizaje de las Bases Curriculares de Educación Física y Salud,
     Unidad de Currículum y Evaluación, Mineduc (curriculumnacional.cl).</p>`;

   Modales

function abrirModal(html) {
  $("#capa-modal").innerHTML = `<div class="velo" data-accion="cerrar-modal"><div class="modal" data-detener>${html}</div></div>`;
}
function cerrarModal() { $("#capa-modal").innerHTML = ""; }

let pendienteConfirmar = null;
function confirmar(mensaje, alAceptar) {
  pendienteConfirmar = alAceptar;
  abrirModal(`
    <h3>Confirma</h3>
    <p class="sub" style="margin:6px 0 16px">${esc(mensaje)}</p>
    <div class="fila">
      <button class="btn btn-lleno" data-accion="confirmar-si">Sí, continuar</button>
      <button class="btn" data-accion="cerrar-modal">Cancelar</button>
    </div>`);
}

/* =========================================================
   Acciones
   ========================================================= */
document.addEventListener("click", async (evt) => {
  const btn = evt.target.closest("[data-accion]");
  if (!btn) return;
  const a = btn.dataset.accion;
  const ev = evalActual();

  if (a === "cerrar-modal") { if (btn.classList.contains("velo") && evt.target !== btn) return; cerrarModal(); return; }
  if (a === "confirmar-si") { cerrarModal(); if (pendienteConfirmar) pendienteConfirmar(); pendienteConfirmar = null; return; }

  /* --- sesión --- */
  if (a === "entrar") {
    const correo = $("#correo").value.trim(), clave = $("#clave").value;
    if (!sb) { S.errorIngreso = "No hay conexión con el servidor."; pintar(); return; }
    btn.disabled = true; btn.textContent = "Entrando…";
    const { data, error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
    if (error) { S.errorIngreso = "Correo o contraseña incorrectos."; pintar(); return; }
    S.sesion = data.user; S.errorIngreso = ""; await cargarCurso(S.cursoId); return;
  }
  if (a === "sin-cuenta") { S.sinCuenta = true; await cargarCurso(S.cursoId); return; }
  if (a === "salir") {
    confirmar("Vas a cerrar la sesión en este equipo.", async () => {
      if (sb) await sb.auth.signOut();
      S.sesion = null; S.sinCuenta = false; S.datos = null; pintar();
    });
    return;
  }

  /* --- navegación --- */
  if (a === "curso") { await cargarCurso(btn.dataset.id); return; }
  if (a === "pestana") { S.pestana = btn.dataset.v; pintar(); return; }
  if (a === "modo") { S.modo = btn.dataset.v; pintar(); return; }
  if (a === "criterio") { S.criterioActivo = +btn.dataset.j; pintar(); return; }
  if (a === "ajustes") { S.ajustes = !S.ajustes; pintar(); return; }
  if (a === "abrir-eval") { S.evalIdx = +btn.dataset.i; S.pestana = "evaluar"; S.criterioActivo = 0; pintar(); return; }
  if (a === "alumno-mover") {
    S.alumnoActivo = Math.max(0, Math.min(S.datos.roster.length - 1, S.alumnoActivo + +btn.dataset.d));
    pintar(); return;
  }

  /* --- marcado --- */
  if (a === "marca-l" || a === "marca-nl") {
    const i = +btn.dataset.i, j = +btn.dataset.j, q = +btn.dataset.q;
    const objetivo = a === "marca-l" ? 1 : 2;
    const fila = ev.marcas[i][j];
    fila[q] = fila[q] === objetivo ? 0 : objetivo;
    marcarCambio(); pintar(); return;
  }
  if (a === "ciclo-nivel") {
    const i = +btn.dataset.i, j = +btn.dataset.j;
    const q0 = +btn.dataset.q || 0;
    if (!Array.isArray(ev.datos[i][j])) ev.datos[i][j] = filaNiveles(ev.criterios[j]);
    ev.datos[i][j][q0] = ((ev.datos[i][j][q0] || 0) + 1) % (nNiveles(ev) + 1);
    marcarCambio(); pintar(); return;
  }
  if (a === "poner-nivel") {
    const i = +btn.dataset.i, j = +btn.dataset.j, k = +btn.dataset.k;
    const q1 = +btn.dataset.q || 0;
    if (!Array.isArray(ev.datos[i][j])) ev.datos[i][j] = filaNiveles(ev.criterios[j]);
    ev.datos[i][j][q1] = ev.datos[i][j][q1] === k ? 0 : k;
    marcarCambio(); pintar(); return;
  }
  if (a === "todos-nivel") {
    const j = +btn.dataset.j, k = +btn.dataset.k;
    S.datos.roster.forEach((_, i) => { if (!ev.estado[i]) ev.datos[i][j] = k; });
    marcarCambio(); pintar(); return;
  }
  if (a === "cambiar-modo") {
    const v = btn.dataset.v;
    if (ev.modo === v) return;
    ev.modo = v;
    marcarCambio(); pintar(); return;
  }
  if (a === "agregar-nivel") {
    ev.escala.niveles.push({ r: "Nivel " + (nNiveles(ev) + 1), p: maxNivel(ev) + 1 });
    marcarCambio(); pintar(); return;
  }
  if (a === "borrar-nivel") {
    const k = +btn.dataset.k;
    if (nNiveles(ev) <= 2) return;
    confirmar("Se quitará ese nivel y las marcas más altas bajarán al nivel máximo disponible.", () => {
      ev.escala.niveles.splice(k, 1);
      const N = nNiveles(ev);
      ev.datos.forEach((f) => f.forEach((fila) => { if (Array.isArray(fila)) fila.forEach((v, q) => { if (v > N) fila[q] = N; }); }));
      marcarCambio(); pintar();
    });
    return;
  }
  if (a === "todos-marca") {
    const j = +btn.dataset.j, q = +btn.dataset.q;
    const presentes = S.datos.roster.map((_, i) => i).filter((i) => !ev.estado[i]);
    const todos = presentes.length && presentes.every((i) => ev.marcas[i][j][q] === 1);
    presentes.forEach((i) => { ev.marcas[i][j][q] = todos ? 0 : 1; });
    marcarCambio(); pintar(); return;
  }
  if (a === "limpiar-criterio") {
    const j = +btn.dataset.j;
    S.datos.roster.forEach((_, i) => { ev.marcas[i][j] = ev.marcas[i][j].map(() => 0); ev.datos[i][j] = 0; });
    marcarCambio(); pintar(); return;
  }
  if (a === "asistencia") {
    const i = +btn.dataset.i;
    ev.estado[i] = ((ev.estado[i] || 0) + 1) % 3;
    marcarCambio(); pintar(); return;
  }
  if (a === "limpiar-marcas") {
    confirmar("Se borrarán todas las marcas de esta lista. La nómina y los indicadores se conservan.", () => {
      ev.marcas = ev.marcas.map((f) => f.map((g) => g.map(() => 0)));
      ev.datos = ev.datos.map(() => ev.criterios.map(filaNiveles));
      ev.estado = ev.estado.map(() => 0);
      marcarCambio(); pintar();
    });
    return;
  }

  if (a === "ayuda") {
    abrirModal(`
      <h3>Cómo funciona</h3>
      <p class="sub" style="margin:4px 0 10px">Una lista de cotejo por clase, con los objetivos del programa de cada curso.</p>
      ${pasosHTML()}
      <p class="sub" style="margin:12px 0 0">Las otras pestañas: <b>Resumen</b> muestra cómo va el curso en la lista abierta,
      <b>Consolidado</b> cruza todas las listas y da el promedio de cada estudiante, y <b>Curso</b> es donde editas la nómina.</p>
      <div class="fila" style="margin-top:12px"><button class="btn btn-lleno" data-accion="cerrar-modal">Entendido</button></div>`);
    return;
  }
  if (a === "ficha") {
    const i = +btn.dataset.i, f = fichaDe(i);
    abrirModal(`
      <h3>${esc(f.nombre)}</h3>
      <p class="sub" style="margin:4px 0 10px">${f.items.length} listas · promedio ${num1(f.prom)} ·
        ${f.conObs ? `${f.conObs} con observación` : "sin observaciones escritas"}</p>
      <div class="caja-oas">${fichaHTML(i)}</div>
      <div class="fila" style="margin-top:10px">
        <button class="btn btn-lleno" data-accion="imprimir-ficha" data-i="${i}">Imprimir o guardar PDF</button>
        <button class="btn" data-accion="cerrar-modal">Cerrar</button>
      </div>`);
    return;
  }
  if (a === "imprimir-ficha") { const i = +btn.dataset.i; cerrarModal(); imprimirFicha(i); return; }

  /* --- observación --- */
  if (a === "obs") {
    const i = +btn.dataset.i;
    abrirModal(`
      <h3>Observación</h3>
      <p class="sub" style="margin:4px 0 10px">${esc(S.datos.roster[i])}</p>
      <textarea id="txt-obs" rows="4" placeholder="Qué observaste y qué apoyo necesita">${esc(ev.obs[i] || "")}</textarea>
      <div class="fila" style="margin-top:12px">
        <button class="btn btn-lleno" data-accion="guardar-obs" data-i="${i}">Guardar</button>
        <button class="btn" data-accion="cerrar-modal">Cancelar</button>
      </div>`);
    return;
  }
  if (a === "guardar-obs") {
    ev.obs[+btn.dataset.i] = $("#txt-obs").value.trim();
    cerrarModal(); marcarCambio(); pintar(); return;
  }

  /* --- listas --- */
  if (a === "nueva-eval") {
    abrirModal(`
      <h3>Nueva lista de cotejo</h3>
      <label class="campo" style="margin-top:10px"><span>Nombre</span><input type="text" id="ne-nombre" placeholder="Cotejo de handball"></label>
      <label class="campo"><span>Fecha</span><input type="date" id="ne-fecha" value="${hoy()}"></label>
      <p class="sub" style="margin:2px 0 8px">Elige los objetivos de aprendizaje de ${esc((CURSOS.find((c) => c.id === S.cursoId) || {}).nombre)}. Cada uno se agrega como criterio de la lista.</p>
      <div class="caja-oas">${listaOAsHTML(S.cursoId, "check")}</div>
      <div class="fila" style="margin-top:6px">
        <button class="btn btn-lleno" data-accion="crear-eval">Crear</button>
        <button class="btn" data-accion="cerrar-modal">Cancelar</button>
      </div>`);
    return;
  }
  if (a === "crear-eval") {
    const nom = $("#ne-nombre").value.trim(), f = $("#ne-fecha").value;
    const cods = [...document.querySelectorAll(".oa-check:checked")].map((x) => x.value);
    const nueva = nuevaEvaluacion(S.datos.roster.length, cods, nom, S.cursoId);
    if (f) nueva.fecha = f;
    nueva.ptsDefecto = ev.ptsDefecto;
    S.datos.evaluaciones.push(nueva);
    S.evalIdx = S.datos.evaluaciones.length - 1; S.criterioActivo = 0;
    cerrarModal(); marcarCambio(); pintar(); return;
  }
  if (a === "duplicar-eval") {
    const copia = JSON.parse(JSON.stringify(ev));
    copia.id = idNuevo(); copia.nombre = ev.nombre + " (copia)"; copia.fecha = hoy();
    copia.marcas = copia.marcas.map((f) => f.map((g) => g.map(() => 0)));
    copia.datos = copia.datos.map(() => copia.criterios.map(filaNiveles));
    copia.estado = copia.estado.map(() => 0);
    copia.obs = copia.obs.map(() => "");
    S.datos.evaluaciones.push(copia);
    S.evalIdx = S.datos.evaluaciones.length - 1;
    marcarCambio(); pintar(); return;
  }
  if (a === "borrar-eval") {
    if (S.datos.evaluaciones.length === 1) {
      confirmar("Es la única lista del curso: se vaciarán sus marcas.", () => {
        S.datos.evaluaciones = [nuevaEvaluacion(S.datos.roster.length, [], "", S.cursoId)];
        S.evalIdx = 0; marcarCambio(); pintar();
      });
      return;
    }
    confirmar(`Se eliminará "${ev.nombre}" con todas sus marcas.`, () => {
      S.datos.evaluaciones.splice(S.evalIdx, 1);
      S.evalIdx = Math.max(0, S.evalIdx - 1); marcarCambio(); pintar();
    });
    return;
  }

  /* --- criterios e indicadores --- */
  if (a === "agregar-criterio") {
    ev.criterios.push({ texto: "", oa: "", eje: "", indicadores: [{ texto: "", pts: ev.ptsDefecto }] });
    ev.marcas.forEach((f) => f.push([0]));
    ev.datos.forEach((f) => f.push(filaNiveles(ev.criterios[ev.criterios.length - 1])));
    marcarCambio(); pintar(); return;
  }
  if (a === "borrar-criterio") {
    const j = +btn.dataset.j;
    if (ev.criterios.length <= 1) return;
    confirmar("Se quitará ese criterio con sus indicadores y las marcas de todo el curso.", () => {
      ev.criterios.splice(j, 1);
      ev.marcas.forEach((f) => f.splice(j, 1));
      ev.datos.forEach((f) => f.splice(j, 1));
      S.criterioActivo = 0; marcarCambio(); pintar();
    });
    return;
  }
  if (a === "agregar-indicador") {
    const j = +btn.dataset.j;
    ev.criterios[j].indicadores.push({ texto: "", pts: ev.ptsDefecto });
    ev.marcas.forEach((f) => f[j].push(0));
    ev.datos.forEach((f) => { if (Array.isArray(f[j])) f[j].push(0); });
    marcarCambio(); pintar(); return;
  }
  if (a === "borrar-indicador") {
    const j = +btn.dataset.j, q = +btn.dataset.q;
    if (ev.criterios[j].indicadores.length <= 1) return;
    confirmar("Se quitará ese indicador y sus marcas en todo el curso.", () => {
      ev.criterios[j].indicadores.splice(q, 1);
      ev.marcas.forEach((f) => f[j].splice(q, 1));
      ev.datos.forEach((f) => { if (Array.isArray(f[j])) f[j].splice(q, 1); });
      marcarCambio(); pintar();
    });
    return;
  }
  if (a === "ver-escala") {
    const total = puntajeTotal(ev);
    abrirModal(`

document.addEventListener("input", (evt) => {
  const el = evt.target.closest("[data-campo]");
  if (!el || !S.datos) return;
  const ev = evalActual();
  const campo = el.dataset.campo;
  if (campo === "nombre") ev.nombre = el.value;
  else if (campo === "fecha") ev.fecha = el.value;
  else if (campo === "oa") ev.oa = el.value;
  else if (campo === "ptsDefecto") ev.ptsDefecto = Math.min(20, Math.max(1, +el.value || 1));
  else if (campo === "criterio") ev.criterios[+el.dataset.j].texto = el.value;
  else if (campo === "indicador") ev.criterios[+el.dataset.j].indicadores[+el.dataset.q].texto = el.value;
  else if (campo === "nivel-r") ev.escala.niveles[+el.dataset.k].r = el.value;
  else if (campo === "nivel-p") ev.escala.niveles[+el.dataset.k].p = Math.max(0, +el.value || 0);
  else if (campo === "pts") ev.criterios[+el.dataset.j].indicadores[+el.dataset.q].pts = Math.max(0, +el.value || 0);
  else if (campo === "alumno") S.datos.roster[+el.dataset.i] = el.value;
  else if (campo === "exigencia") { ev.exigencia = Math.min(100, Math.max(10, +el.value || EXIGENCIA)); marcarCambio(); pintar(); return; }
  else if (campo === "peso") { ev.peso = Math.min(10, Math.max(0, +el.value || 0)); marcarCambio(); pintar(); return; }
  else if (campo === "descriptor") {
    const c = ev.criterios[+el.dataset.j];
    c.descriptores = c.descriptores || [];
    c.descriptores[+el.dataset.k] = el.value;
    marcarCambio(); return;
  }
  else return;
  marcarCambio();
});

  const el = evt.target.closest("[data-accion]");
  if (el) {
    const a = el.dataset.accion;
