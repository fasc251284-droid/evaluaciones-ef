/* =========================================================
   Salidas: impresión, Excel, respaldo
   ========================================================= */
/* El PDF se adapta: pocas columnas van en vertical y con letra grande;
   muchas, en horizontal y más apretadas. */

/* La planilla se parte en bloques que siempre caben en el ancho de la hoja.
   Las columnas de marca no llevan ancho: el reparto lo hace la tabla. */
function planImpresion(nMarcas) {
  const n = Math.max(0, nMarcas);
  const orientacion = n <= 8 ? "portrait" : "landscape";
  // Mientras más indicadores, más recuadros por fila y letra más chica:
  // así la leyenda no se come la hoja y cada recuadro crece hacia abajo.
  const cajas = n <= 6 ? 2 : n <= 12 ? 3 : n <= 20 ? 4 : 5;
  const fuenteLey = n <= 6 ? 9.5 : n <= 12 ? 8.5 : n <= 20 ? 7.5 : 7;
  return { orientacion, fuente: n <= 14 ? 9 : 8, cajas: orientacion === "landscape" ? cajas + 1 : cajas,
    fuenteLey };
}

/* Ancho mínimo, en mm, que necesita un texto para no partirse:
   ancho de carácter ≈ 0,58 del tamaño de letra, más el relleno de la celda. */
function mmTexto(txt, px) { return (String(txt).length * px * 0.58) / 3.78 + 2.2; }

/* Reparte el ancho de la hoja midiendo lo que pide cada encabezado y su contenido,
   en vez de asignar porcentajes a ojo. */
function anchosImpresion(nMarcas, orientacion, fuente) {
  const hoja = orientacion === "portrait" ? 191 : 278;   // A4 menos 9 mm de margen
  const pide = {
    n: Math.max(mmTexto("N°", fuente), mmTexto("25", fuente)),
    asis: Math.max(mmTexto("Asis.", fuente), mmTexto("P", fuente)),
    pts: Math.max(mmTexto("Pts", fuente), mmTexto("120/120", fuente)),
    nota: Math.max(mmTexto("Nota", fuente), mmTexto("7,0", fuente)),
    obs: mmTexto("Observación", fuente),
    nom: mmTexto("Estudiante", fuente)
  };
  const nom = Math.max(pide.nom, 30);                    // que quepa un nombre completo
  const obs = Math.max(pide.obs, 18);
  const fijo = pide.n + pide.asis + pide.pts + pide.nota + nom + obs;
  const marca = nMarcas ? (hoja - fijo) / nMarcas : 0;
  const pct = (mm) => ((mm / hoja) * 100).toFixed(2) + "%";
  return { hoja, marca, pide, nom, obs, fijo,
    css: { n: pct(pide.n), asis: pct(pide.asis), pts: pct(pide.pts),
           nota: pct(pide.nota), nom: pct(nom), obs: pct(obs) } };
}

/* El rótulo va escrito solo si la columna alcanza los 14 mm; si no, solo el número. */
function modoRotulo(nMarcas) {
  if (!nMarcas) return "numero";
  const p = planImpresion(nMarcas);
  return anchosImpresion(nMarcas, p.orientacion, p.fuente).marca >= 14 ? "texto" : "numero";
}

function prepararImpresion(nMarcas) {
  const { orientacion, fuente, cajas, fuenteLey } = planImpresion(nMarcas);
  const texto = modoRotulo(nMarcas) === "texto";
  const A = anchosImpresion(nMarcas, orientacion, fuente, texto);
  const css = `
    @page{size:A4 ${orientacion}; margin:9mm}
    .hoja-impresion table{font-size:${fuente}px}
    .hoja-impresion .c-n{width:${A.css.n}}
    .hoja-impresion .c-nom{width:${A.css.nom}}
    .hoja-impresion .c-asis{width:${A.css.asis}}
    .hoja-impresion .c-pts{width:${A.css.pts}}
    .hoja-impresion .c-nota{width:${A.css.nota}}
    .hoja-impresion .c-obs{width:${A.css.obs}}
    .hoja-impresion th.c-n,.hoja-impresion th.c-asis,.hoja-impresion th.c-pts,
    .hoja-impresion th.c-nota,.hoja-impresion th.c-obs,.hoja-impresion th.c-nom{
      white-space:nowrap; overflow-wrap:normal; word-break:normal}
    .hoja-impresion th.c-marca{font-family:${texto ? "inherit" : "var(--mono)"};
      white-space:${texto ? "normal" : "nowrap"}; font-size:${texto ? 7.5 : fuente}px;
      line-height:1.2; vertical-align:bottom; text-align:center}
    .hoja-impresion th.c-marca .num-col{display:block; font-family:var(--mono); margin-bottom:1px}
    .leyenda-oa{font-size:${fuenteLey}px}
    .leyenda-oa .rejilla-ind{grid-template-columns:repeat(${cajas}, 1fr)}
    .leyenda-oa .oa-titulo{margin-top:${fuenteLey < 8 ? 4 : 7}px}`;
  let tag = $("#css-impresion");
  if (!tag) {
    tag = document.createElement("style");
    tag.id = "css-impresion";
    tag.media = "print";
    document.head.appendChild(tag);
  }
  tag.textContent = css;
}

function claseCol(k, n) {
  if (k === 0) return "c-n";
  if (k === 1) return "c-nom izq";
  if (k === 2) return "c-asis";
  if (k === n - 1) return "c-obs izq";
  if (k === n - 2) return "c-nota";
  if (k === n - 3) return "c-pts";
  return "c-marca";
}

function filasDeEvaluacion(ev) {
  const cols = columnasPlanilla(ev);
  const total = puntajeTotal(ev);
  const cab = ["N°", "Estudiante", "Asis.",
    ...cols.map((c) => (c.ind && c.ind.texto.trim()) || `${c.j + 1}.${c.q + 1}`),
    "Puntaje", "Nota", "Observación"];
  const filas = S.datos.roster.map((n, i) => {
    const r = resultado(ev, i);
    const est = ev.estado[i] || 0;
    return [
      i + 1, n || "", est === 1 ? "A" : est === 2 ? "J" : "P",
      ...cols.map((c) => {
        if (est) return "";
        if (esEscala(ev)) return nivelDe(ev, i, c.j, c.q) || "";
        const v = marcaDe(ev, i, c.j, c.q);
        return v === 1 ? "L" : v === 2 ? "NL" : "";
      }),
      est ? "" : `${r.puntaje}/${total}`,
      est ? "" : (r.nota === null ? "" : num1(r.nota)),
      ev.obs[i] || ""
    ];
  });
  return { cab, filas, total, cols };
}

function imprimirConsolidado() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  const { evs, filas, promCurso } = datosConsolidado();
  prepararImpresion(evs.length + 1);
  $("#impresion").innerHTML = `
    <h1 style="font-size:15px">Consolidado · ${esc(curso.nombre)}</h1>
    <p style="font-size:11px;margin:2px 0 6px">${evs.length} listas de cotejo · promedio del curso ${num1(promCurso)}</p>
    <table><thead><tr><th class="c-n">N°</th><th class="c-nom izq">Estudiante</th>
      ${evs.map((ev, k) => `<th class="c-nota">${k + 1}</th>`).join("")}<th class="c-nota">Prom.</th></tr></thead>
    <tbody>${filas.map((f, i) => `<tr><td class="c-n">${i + 1}</td><td class="c-nom izq">${esc(f.nom || "—")}</td>
      ${f.notas.map((n) => `<td class="c-nota">${n === null ? "—" : num1(n)}</td>`).join("")}
      <td class="c-nota">${num1(f.prom)}</td></tr>`).join("")}</tbody></table>
    <ol class="leyenda-oa" style="margin-top:6px">${evs.map((ev, k) => `<li><b>${k + 1}</b> ${esc(ev.nombre)} · ${fechaLarga(ev.fecha)}${pesoDe(ev) !== 1 ? ` · peso ${pesoDe(ev)}` : ""}</li>`).join("")}</ol>`;
  setTimeout(() => window.print(), 60);
}

function imprimir() {
  if (S.pestana === "consolidado") return imprimirConsolidado();
  const ev = evalActual();
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  const { filas, total, cols } = filasDeEvaluacion(ev);
  const e = estadisticas(ev);
  prepararImpresion(columnasPlanilla(ev).length * (esEscala(ev) ? 1 : 1));
  $("#impresion").innerHTML = `
    <h1 style="font-size:15px">${esc(ev.nombre)} · ${esc(curso.nombre)}</h1>
    <p style="font-size:11px;margin:2px 0 4px">${fechaLarga(ev.fecha)}${ev.oa ? " · " + esc(ev.oa) : ""}${codigosOA(ev).length ? " · " + codigosOA(ev).join(" · ") : ""} · ${esEscala(ev) ? "escala de apreciación" : "lista de cotejo"} · ${total} pts · exigencia ${exigenciaValida(ev.exigencia)}% (2,0–7,0) · promedio ${num1(e.prom)}</p>
    <div class="leyenda-oa">${ev.criterios.map((c, j) => `
      <p class="oa-titulo"><b>${esc(c.oa || "Criterio " + (j + 1))}</b> · ${esc(EJES[c.eje] || "criterio propio")}</p>
      <p class="oa-texto">${esc(c.texto || "—")}</p>
      <div class="rejilla-ind">${c.indicadores.map((ind, q) => `
        <div class="caja-ind"><b>${j + 1}.${q + 1}</b> ${esc(ind.texto || "sin redactar")}
          <i>${esEscala(ev) ? `1–${nNiveles(ev)}` : `${ind.pts} pts`}</i></div>`).join("")}</div>`).join("")}</div>
    <table>
      <thead><tr>
        <th class="c-n">N°</th><th class="c-nom izq">Estudiante</th><th class="c-asis">Asis.</th>
        ${cols.map((c) => `<th class="c-marca"><span class="num-col">${c.j + 1}.${c.q + 1}</span>${
          modoRotulo(cols.length) === "texto" ? esc((c.ind && c.ind.texto.trim()) || "") : ""}</th>`).join("")}
        <th class="c-pts">Pts</th><th class="c-nota">Nota</th><th class="c-obs izq">Observación</th>
      </tr></thead>
      <tbody>${filas.map((f) => `<tr>${f.map((v, k) => `<td class="${claseCol(k, f.length)}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>`;
  setTimeout(() => window.print(), 60);
}

function imprimirFicha(i) {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  const f = fichaDe(i);
  prepararImpresion(0);
  $("#impresion").innerHTML = `
    <h1 style="font-size:15px">${esc(f.nombre)} · ${esc(curso.nombre)}</h1>
    <p style="font-size:11px;margin:2px 0 8px">Educación Física y Salud · ${f.items.length} listas · promedio ${num1(f.prom)}</p>
    <table><thead><tr><th class="izq" style="width:26%">Lista</th><th style="width:12%">Fecha</th>
      <th class="c-nota">Nota</th><th class="izq">Observación</th></tr></thead>
    <tbody>${f.items.map((x) => `<tr>
      <td class="izq">${esc(x.ev.nombre)}</td>
      <td>${fechaLarga(x.ev.fecha)}</td>
      <td class="c-nota">${x.est ? (x.est === 1 ? "A" : "J") : esc(num1(x.nota))}</td>
      <td class="izq">${esc(x.obs)}</td></tr>`).join("")}</tbody></table>`;
  setTimeout(() => window.print(), 60);
}

function descargar(nombre, contenido, tipo) {
  const b = new Blob([contenido], { type: tipo });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

async function exportarExcel() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  let XLSX = null;
  try {
    if (!window.XLSX) {
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        s.onload = res; s.onerror = rej; document.head.appendChild(s);
      });
    }
    XLSX = window.XLSX;
  } catch { XLSX = null; }

  if (!XLSX) {
    const ev = evalActual();
    const { cab, filas } = filasDeEvaluacion(ev);
    const csv = [cab, ...filas].map((f) => f.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
    descargar(`${curso.label}-${ev.nombre}.csv`, "\ufeff" + csv, "text/csv;charset=utf-8");
    return;
  }
  const libro = XLSX.utils.book_new();
  const con = datosConsolidado();
  const hojaCon = XLSX.utils.aoa_to_sheet([
    [`Consolidado · ${curso.nombre}`],
    [`Promedio del curso: ${num1(con.promCurso)}`],
    [],
    ["N°", "Estudiante", ...con.evs.map((ev, k) => `${k + 1}. ${ev.nombre}`), "Promedio"],
    ...con.filas.map((f, i) => [i + 1, f.nom,
      ...f.notas.map((n) => (n === null ? "" : Number(n.toFixed(1)))),
      f.prom === null ? "" : Number(f.prom.toFixed(1))])
  ]);
  hojaCon["!cols"] = [{ wch: 4 }, { wch: 28 }, ...con.evs.map(() => ({ wch: 12 })), { wch: 10 }];
  XLSX.utils.book_append_sheet(libro, hojaCon, "Consolidado");
  S.datos.evaluaciones.forEach((ev, k) => {
    const { cab, filas, total } = filasDeEvaluacion(ev);
    const encabezado = [
      [`${ev.nombre} · ${curso.nombre}`],
      [`Fecha: ${fechaLarga(ev.fecha)}`, `Exigencia: 60% · 2,0 a 7,0`, `Puntaje total: ${total}`],
      [esEscala(ev) ? `Escala: ${leyendaEscala(ev).replace(/<[^>]*>/g, "")}` : "L = logrado · NL = no logrado · vacío = sin marcar"],
      ...ev.criterios.map((c, j) => [c.oa || `C${j + 1}`, c.texto || "—",
        ...c.indicadores.map((ind, q) => `${j + 1}.${q + 1} ${ind.texto} (${ind.pts} pts)`)]),
      []
    ];
    const hoja = XLSX.utils.aoa_to_sheet([...encabezado, cab, ...filas]);
    hoja["!cols"] = [{ wch: 4 }, { wch: 28 }, { wch: 6 },
      ...columnasPlanilla(ev).map(() => ({ wch: 6 })), { wch: 9 }, { wch: 6 }, { wch: 30 }];
    const nombreHoja = (ev.nombre || `Lista ${k + 1}`).replace(/[\\/*?:[\]]/g, "").slice(0, 28) || `Lista ${k + 1}`;
    XLSX.utils.book_append_sheet(libro, hoja, nombreHoja);
  });
  XLSX.writeFile(libro, `Cotejo-${curso.label.replace("°", "")}basico.xlsx`);
}

function descargarRespaldo() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  descargar(`respaldo-${curso.label.replace("°", "")}basico-${hoy()}.json`,
    JSON.stringify({ curso: S.cursoId, fecha: new Date().toISOString(), datos: S.datos }, null, 2),
    "application/json");
}

function pedirRestaurar() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      try {
        const j = JSON.parse(lector.result);
        const d = j.datos ? j.datos : j;
        confirmar("Se reemplazarán los datos de este curso con los del archivo.", () => {
          S.datos = normalizar(d); S.evalIdx = 0; marcarCambio(); pintar();
        });
      } catch { alert("El archivo no se pudo leer."); }
    };
    lector.readAsText(f);
  };
  inp.click();
}

/* =========================================================
   Arranque
   ========================================================= */
(async function iniciar() {
  pintar();
  await sbListo;
  const u = await usuarioActual();
  S.sesion = u; S.verificando = false;
  if (!u && !sb && localStorage.getItem(PREFIJO + S.cursoId)) S.sinCuenta = true;
  if (u || S.sinCuenta) await cargarCurso(S.cursoId);
  else pintar();
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch {}
  }
})();
