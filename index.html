  const porInd = [];
  ev.criterios.forEach((c, j) => c.indicadores.forEach((ind, q) => {
    let suma = 0, cont = 0, sin = 0;
    for (let i = 0; i < n; i++) {
      if (ev.estado[i]) continue;
      if (esEscala(ev)) {
        const v = nivelDe(ev, i, j, q);
        if (v) { suma += puntosNivel(ev, v) / maxNivel(ev); cont++; } else sin++;
      } else {
        const v = marcaDe(ev, i, j, q);
        if (v) { suma += v === 1 ? 1 : 0; cont++; } else sin++;
      }
    }
    porInd.push({ rot: `${j + 1}.${q + 1}`, oa: c.oa, texto: ind.texto,

      pct: r.total ? Math.round((r.puntaje / r.total) * 100) : null,

    </tbody></table>

    <p class="rot-informe">Logro por indicador</p>
    <table><thead><tr><th class="c-n">N°</th><th class="izq">Indicador</th>
      <th class="col-barra">Logro</th><th class="c-pct">%</th><th class="c-asis">Sin marcar</th></tr></thead>
    <tbody>${porInd.map((x) => `<tr>
      <td class="c-n mono">${x.rot}</td>
      <td class="izq">${esc(x.texto || "sin redactar")}${x.oa ? ` <span class="oa-min">${esc(x.oa)}</span>` : ""}</td>
      <td>${barra(x.pct)}</td>
      <td class="c-pct">${x.pct === null ? "—" : x.pct + "%"}</td>
      <td class="c-asis">${x.sin || ""}</td></tr>`).join("")}</tbody></table>
    ${flojos.length ? `<p class="nota-med"><b>Indicadores bajo 60%:</b>
      ${flojos.map((x) => `${x.rot} (${x.pct}%)`).join(" · ")}. Conviene retomarlos en la próxima clase.</p>` : ""}

    <tbody>${porAlu.map((x, k) => `<tr>
      <td class="c-n">${k + 1}</td>

function descargar(nombre, contenido, tipo) {
  const b = new Blob([contenido], { type: tipo });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}

async function exportarExcel() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  let XLSX = null;
  try {
    if (!window.XLSX) {
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        s.onload = res; s.onerror = rej; document.head.appendChild(s);
      });
    }
    XLSX = window.XLSX;
  } catch { XLSX = null; }

  if (!XLSX) {
    const ev = evalActual();
    const { cab, filas } = filasDeEvaluacion(ev);
    const csv = [cab, ...filas].map((f) => f.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
    descargar(`${curso.label}-${ev.nombre}.csv`, "\ufeff" + csv, "text/csv;charset=utf-8");
    return;
  }
  const libro = XLSX.utils.book_new();
  const con = datosConsolidado();
  const hojaCon = XLSX.utils.aoa_to_sheet([
    [`Consolidado · ${curso.nombre}`],
    [`Promedio del curso: ${num1(con.promCurso)}`],
    [],
    ["N°", "Estudiante", ...con.evs.map((ev, k) => `${k + 1}. ${ev.nombre}`), "Promedio"],
    ...con.filas.map((f, i) => [i + 1, f.nom,
      ...f.notas.map((n) => (n === null ? "" : Number(n.toFixed(1)))),
      f.prom === null ? "" : Number(f.prom.toFixed(1))])
  ]);
  hojaCon["!cols"] = [{ wch: 4 }, { wch: 28 }, ...con.evs.map(() => ({ wch: 12 })), { wch: 10 }];
  XLSX.utils.book_append_sheet(libro, hojaCon, "Consolidado");
  S.datos.evaluaciones.forEach((ev, k) => {
    const { cab, filas, total } = filasDeEvaluacion(ev);
    const encabezado = [
      [`${ev.nombre} · ${curso.nombre}`],
      [`Evalúa: ${quienEvalua(ev)}`],
      [`Fecha: ${fechaLarga(ev.fecha)}`, `Exigencia: ${exigenciaValida(ev.exigencia)}% · 2,0 a 7,0`, `Puntaje total: ${total}`],
      [esEscala(ev) ? `Escala: ${leyendaEscala(ev).replace(/<[^>]*>/g, "")}` : "L = logrado · NL = no logrado · vacío = sin marcar"],
      ...ev.criterios.map((c, j) => [c.oa || `C${j + 1}`, c.texto || "—",
        ...c.indicadores.map((ind, q) => `${j + 1}.${q + 1} ${ind.texto} (${ind.pts} pts)`)]),
      []
    ];
    const hoja = XLSX.utils.aoa_to_sheet([...encabezado, cab, ...filas]);
    hoja["!cols"] = [{ wch: 4 }, { wch: 28 }, { wch: 6 },
      ...columnasPlanilla(ev).map(() => ({ wch: 6 })), { wch: 9 }, { wch: 6 }, { wch: 30 }];
    const nombreHoja = (ev.nombre || `Lista ${k + 1}`).replace(/[\\/*?:[\]]/g, "").slice(0, 28) || `Lista ${k + 1}`;
    XLSX.utils.book_append_sheet(libro, hoja, nombreHoja);
  });
  XLSX.writeFile(libro, `Cotejo-${curso.label.replace("°", "")}basico.xlsx`);
}

function descargarRespaldo() {
  const curso = CURSOS.find((c) => c.id === S.cursoId) || CURSOS[0];
  descargar(`respaldo-${curso.label.replace("°", "")}basico-${hoy()}.json`,
    JSON.stringify({ curso: S.cursoId, fecha: new Date().toISOString(), datos: S.datos }, null, 2),
    "application/json");
}

/* Junta los ocho cursos en un archivo. El curso abierto se toma de memoria,
   para no perder cambios que aún no se hayan sincronizado. */
async function descargarRespaldoTotal() {
  const paquete = { version: 2, fecha: new Date().toISOString(), cursos: {} };
  const fallos = [];
  for (const c of CURSOS) {
    if (c.id === S.cursoId) { paquete.cursos[c.id] = S.datos; continue; }
    try { paquete.cursos[c.id] = await almacen.leer(c.id); }
    catch (e) { fallos.push(c.nombre); }
  }
  descargar(`respaldo-completo-${hoy()}.json`, JSON.stringify(paquete, null, 2), "application/json");
  if (fallos.length) abrirModal(`<h3>Respaldo descargado</h3>
    <p class="sub" style="margin:6px 0 0">No se pudo leer: ${esc(fallos.join(", "))}. El resto quedó guardado.</p>
    <div class="fila" style="margin-top:12px"><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`);
}

function pedirRestaurar() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      try {
        const j = JSON.parse(lector.result);
        if (j && j.cursos) {                       // respaldo completo
          const cuales = CURSOS.filter((c) => j.cursos[c.id]);
          confirmar(`Se reemplazarán los datos de ${cuales.length} cursos: ${cuales.map((c) => c.label).join(", ")}.`, async () => {
            for (const c of cuales) {
              const d = normalizar(j.cursos[c.id]);
              if (c.id === S.cursoId) { S.datos = d; S.evalIdx = 0; marcarCambio(); }
              else { try { await almacen.escribir(c.id, d); } catch (e) { if (e.message !== "sin-sesion") throw e; } }
            }
            pintar();
          });
          return;
        }
        const d = j.datos ? j.datos : j;
        confirmar("Se reemplazarán los datos de este curso con los del archivo.", () => {
          S.datos = normalizar(d); S.evalIdx = 0; marcarCambio(); pintar();
        });
      } catch { alert("El archivo no se pudo leer."); }
    };
    lector.readAsText(f);
  };
  inp.click();
}

/* =========================================================
   Arranque
   ========================================================= */
(async function iniciar() {
  aplicarTema();
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", () => { if (temaGuardado() === "auto") { aplicarTema(); pintar(); } });
  }
  vigilarDeslizamiento();
  window.addEventListener("online", () => { if (Object.keys(leerPendientes()).length) guardar(); });
  pintar();
  await sbListo;
  const u = await usuarioActual();
  S.sesion = u; S.verificando = false;
  if (!u && !sb && localStorage.getItem(PREFIJO + S.cursoId)) S.sinCuenta = true;
  if (u || S.sinCuenta) await cargarCurso(S.cursoId);
  else pintar();
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch {}
  }
})();

</script>
